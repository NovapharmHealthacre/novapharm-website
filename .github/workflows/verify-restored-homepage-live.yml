name: Verify restored public homepage at live custom domain

on:
  pull_request:
    paths:
      - .github/workflows/verify-restored-homepage-live.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-restored-homepage-live.yml
  workflow_dispatch:
  # Read-only rollback checks after successful GitHub Pages publications.
  deployment_status:
  # Fallback for GitHub's branch-published Pages workflow, which may not emit
  # a deployment_status event to this repository's Actions workflows.
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  # Detect an accidental return to the old homepage after later publishing events.
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: read

jobs:
  pr-pure-white-source-acceptance:
    # A PR cannot satisfy post-deployment custom-domain evidence. Validate
    # the proposed source without mistaking today's live site for this PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm proposed Pure White source and current Medicine hero
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<meta name="theme-color" content="#FFFFFF">' index.html
          grep -Fq 'Medicine. Where it needs to be' index.html
          grep -Fq 'class="npd-apple-hero nph-earth-hero"' index.html
          grep -Fq 'src="/assets/media/home/earth-reference-1400.jpg"' index.html
          grep -Fq -- '--np-color-canvas: #FFFFFF' assets/css/novapharm.bundle.css

  live-origin-acceptance:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'gh-pages' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Confirm updated Earth homepage and protected existing routes on independent origin
        shell: bash
        env:
          LIVE_ORIGIN: https://novapharmhealthcare.com
        run: |
          set -euo pipefail
          cache="earth-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          successful=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --retry 1 --max-time 20 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$LIVE_ORIGIN/?${cache}-${attempt}" -o /tmp/novapharm-restored-home.html; then
              # The source-approved 2026-11-23 release replaced the retired
              # editorial-home copy. Verify its new headline, actual Earth
              # artwork, source receipt and exact browser theme instead.
              if grep -Fq 'Medicine. Where it needs to be' /tmp/novapharm-restored-home.html \
                && grep -Fq 'class="npd-apple-hero nph-earth-hero"' /tmp/novapharm-restored-home.html \
                && grep -Fq 'src="/assets/media/home/earth-reference-1400.jpg"' /tmp/novapharm-restored-home.html \
                && grep -Fq '<meta name="theme-color" content="#FFFFFF">' /tmp/novapharm-restored-home.html \
                && grep -Fq 'name="novapharm-source-sha" content="' /tmp/novapharm-restored-home.html \
                && ! grep -Fq 'class="npd-hero npd-hero-media"' /tmp/novapharm-restored-home.html; then
                successful=true
                break
              fi
            fi
            sleep 8
          done
          if [ "$successful" != true ]; then
            echo "::error::Live homepage is missing the verified source receipt, Pure White browser metadata, approved Medicine headline or Earth hero."
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 20 \
            "$LIVE_ORIGIN/assets/css/novapharm.bundle.css?${cache}" -o /tmp/novapharm-restored-style.css
          grep -Fq 'nph-earth-hero-landscape' /tmp/novapharm-restored-style.css
          grep -Fq -- '--apple-pharma-public-contract: 3' /tmp/novapharm-restored-style.css
          curl --fail --silent --show-error --location --max-time 20 \
            "$LIVE_ORIGIN/assets/media/home/earth-reference-1400.jpg?${cache}" -o /tmp/novapharm-restored-earth.jpg
          test "$(wc -c < /tmp/novapharm-restored-earth.jpg)" -ge 60000
          for route in contact products/nutraxin; do
            curl --fail --silent --show-error --location --max-time 20 \
              "$LIVE_ORIGIN/$route/?${cache}" -o "/tmp/novapharm-preserved-${route//\//-}.html"
          done
          grep -Fq 'Contact NovaPharm' /tmp/novapharm-preserved-contact.html
          grep -Fq 'Nutraxin' /tmp/novapharm-preserved-products-nutraxin.html
          echo "PASSED: released Medicine homepage, Pure White, source receipt, Earth media, CSS, Contact and Nutraxin routes verified live."
