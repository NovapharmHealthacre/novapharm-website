name: Managed staging preflight

on:
  pull_request:
    paths:
      - '.github/workflows/azure-deploy.yml'
      - '.github/workflows/staging-preflight.yml'
      - 'infra/**'
      - 'docs/programme/azure-unified-estate-acceptance.md'
      - 'scripts/validate-unified-staging-preflight.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/azure-deploy.yml'
      - '.github/workflows/staging-preflight.yml'
      - 'infra/**'
      - 'docs/programme/azure-unified-estate-acceptance.md'
      - 'scripts/validate-unified-staging-preflight.mjs'
  workflow_dispatch:

permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate managed-staging repository contract
        run: node scripts/validate-unified-staging-preflight.mjs
