name: Reconcile journey branch image inventory
on:
  push:
    branches:
      - feature/technology-workspace-journey-20261112
    paths:
      - .github/workflows/technology-journey-inventory-recheck.yml
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'NovapharmHealthacre/novapharm-website' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Regenerate authoritative inventory from exact source tree
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          git diff --stat -- audit/generated/image-inventory.json
      - name: Commit only exact regenerations to feature branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feature/technology-workspace-journey-20261112 | cut -f1)" = "$GITHUB_SHA"
          git add audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Inventory is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(evidence): reconcile journey branch against current public and portal assets"
          git push origin HEAD:refs/heads/feature/technology-workspace-journey-20261112
