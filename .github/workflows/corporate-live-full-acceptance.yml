name: Corporate live Chromium WebKit Firefox acceptance

on:
  pull_request:
    paths:
      - 'scripts/test-corporate-live-acceptance.mjs'
      - '.github/workflows/corporate-live-full-acceptance.yml'
  workflow_run:
    workflows: ["Publish verified AWS-backed contact form"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corporate-live-acceptance-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout acceptance source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies and browsers
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit firefox
      - name: Inspect live domain and capture evidence, never submit customer forms
        env:
          CORPORATE_LIVE_ORIGIN: https://novapharmhealthcare.com
          EXPECTED_LIVE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: node scripts/test-corporate-live-acceptance.mjs
      - name: Preserve screenshots, accessibility results and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: corporate-live-acceptance-${{ github.run_id }}
          path: artifacts/corporate-live-acceptance
          if-no-files-found: warn
          retention-days: 14
