name: Reconcile owner-approved Intelligence hero inventory
on:
  push:
    branches:
      - fix/intelligence-approved-hero-composition-20261112
permissions:
  contents: write
jobs:
  reconcile:
    if: "!contains(github.event.head_commit.message, '[npi-inventory-ready]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Regenerate governed image register from exact committed binaries
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          git add audit/generated/image-inventory.json
          git rm .github/workflows/npi-approved-hero-inventory-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(portal): reconcile approved hero image inventory [npi-inventory-ready]"
          git push origin HEAD:fix/intelligence-approved-hero-composition-20261112
