name: Reconcile corporate image provenance on isolated candidate
on:
  push:
    branches:
      - fix/corporate-inventory-readiness-20261111
    paths:
      - .github/workflows/reconcile-corporate-inventory-readiness.yml

permissions:
  contents: read

jobs:
  reconcile:
    if: github.repository == 'NovapharmHealthacre/novapharm-website'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Regenerate authoritative inventory from registered originals
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "fix/corporate-inventory-readiness-20261111"
          npm ci --ignore-scripts
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          test "$(git diff --name-only)" = "audit/generated/image-inventory.json"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("audit/generated/image-inventory.json","utf8"));if(!p.assets||!p.summary)process.exit(1);for(const f of ["assets/media/capabilities/approved-vial-photo-800.webp","assets/media/capabilities/approved-earth-horizon-crest.webp"])if(!p.assets.some(a=>a.path===f||a.publicPath===f))process.exit(1)'
          git add audit/generated/image-inventory.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(evidence): regenerate corporate image inventory without weakening provenance"
          git push origin HEAD:refs/heads/fix/corporate-inventory-readiness-20261111
