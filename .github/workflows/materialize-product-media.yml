name: Materialise licensed product media

on:
  pull_request:
    branches:
      - main
    paths:
      - "creative-assets/image-asset-register.json"
      - "scripts/materialize-product-media.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify public source is default-deny before media work
        run: node scripts/test-static-public-source-safety.mjs

      - name: Acquire and validate licensed derivatives
        env:
          ALLOW_MEDIA_DOWNLOAD: "true"
        run: node scripts/materialize-product-media.mjs

      - name: Enforce media-only mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          changed_paths="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              creative-assets/image-asset-register.json|assets/media/products/*)
                ;;
              *)
                echo "::error file=$path::Product-media materialisation attempted to modify a non-media path."
                exit 1
                ;;
            esac
          done <<< "$changed_paths"

      - name: Validate materialised media without regenerating application source
        run: |
          npm run products:validate
          npm run security:scan
          node scripts/test-static-public-source-safety.mjs

      - name: Assert media materialisation never writes any GitHub source or live asset
        shell: bash
        run: |
          set -euo pipefail
          echo "Validated licensed product media in the ephemeral CI runner."
          echo "No git commit, push, PR mutation, release, or public image artifact upload is permitted."
          echo "Approved changes must be committed on a separately reviewed candidate branch."
