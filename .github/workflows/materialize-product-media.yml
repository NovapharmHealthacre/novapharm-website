name: Materialise licensed product media

on:
  pull_request:
    branches:
      - main
    paths:
      - "creative-assets/image-asset-register.json"
      - "scripts/materialize-product-media.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify public source is default-deny before media work
        run: node scripts/test-static-public-source-safety.mjs

      - name: Acquire and validate licensed derivatives
        env:
          ALLOW_MEDIA_DOWNLOAD: "true"
        run: node scripts/materialize-product-media.mjs

      - name: Enforce media-only mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          changed_paths="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              creative-assets/image-asset-register.json|assets/media/products/*)
                ;;
              *)
                echo "::error file=$path::Product-media materialisation attempted to modify a non-media path."
                exit 1
                ;;
            esac
          done <<< "$changed_paths"

      - name: Validate materialised media without regenerating application source
        run: |
          npm run products:validate
          npm run security:scan
          node scripts/test-static-public-source-safety.mjs

      - name: Commit only validated media to the candidate branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git add -- creative-assets/image-asset-register.json assets/media/products
          if git diff --cached --quiet; then
            echo "Licensed media is already materialised and current."
            exit 0
          fi

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              creative-assets/image-asset-register.json|assets/media/products/*)
                ;;
              *)
                echo "::error file=$path::Refusing to commit a non-media path from product-media materialisation."
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add validated licensed product photography"
          git push origin "HEAD:${TARGET_BRANCH}"
