name: Intelligence CLIP research contract
on:
  pull_request:
    paths:
      - "services/clip/**"
      - "server.mjs"
      - "apps/portal/data/nova-ml-modules.ts"
      - "docs/ai-model-register.json"
      - "docs/ai-use-case-register.json"
      - "docs/intelligence/visual-search-cross-platform-contract.json"
      - "src/core/intelligence-visual-search.mjs"
      - "scripts/test-intelligence-visual-search.mjs"
      - "apps/portal/app/gateway/**"
      - "apps/portal/components/clip-visual-search*"
      - "apps/portal/components/nova-ml-workspaces.tsx"
      - "native/novapharm-intelligence-apple/**"
      - "native/novapharm-intelligence-android/**"
      - ".github/workflows/dispatch-approved-aws-contact-release.yml"
      - ".github/workflows/publish-aws-contact-production.yml"
      - "scripts/aws/contact-release-routing.test.mjs"
      - "package.json"
      - ".github/workflows/intelligence-clip-research-contract.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate CLIP source-only AWS publication isolation
        run: node --test scripts/aws/contact-release-routing.test.mjs
      - name: Prove default-off, origin-denial, schema and role contracts
        run: node --test scripts/test-intelligence-visual-search.mjs
      - name: Inspect Node syntax without runtime activation
        run: |
          node --check server.mjs
          node --check src/core/intelligence-visual-search.mjs
      - name: Verify local rights and fail-closed source metadata without downloading models
        run: python3 -m unittest discover -s services/clip -p "test_*.py" -v
      - name: Compile isolated Python sources without loading models or network access
        run: |
          python3 -m py_compile services/clip/rights.py services/clip/serve.py services/clip/build_index.py services/clip/evaluate.py
      - name: Guard against bundled model and secret material
        run: |
          if find services/clip native/novapharm-intelligence-android -type f \
             \( -name '*.pt' -o -name '*.pth' -o -name '*.onnx' -o -name '*.mlmodel' -o -name '*.mlmodelc' \) | grep -q .; then
            echo "Bundled model artifact is forbidden"; exit 1
          fi

  android-library:
    name: Compile Kotlin adapter and fail-closed JVM tests (not an APK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.3"
      - name: Compile Kotlin adapter and run fail-closed tests
        run: gradle -p native/novapharm-intelligence-android/clipResearch test --no-daemon
      - name: Record Android boundary
        run: echo "JVM adapter tests do not certify Android packaging, network-security configuration, signing, authentication or physical devices."
