name: Intelligence live Stripe catalog fail-closed contract

on:
  pull_request:
    paths:
      - 'src/core/intelligence-live-stripe-catalog.mjs'
      - 'scripts/test-intelligence-live-stripe-catalog.mjs'
      - '.github/workflows/intelligence-live-stripe-catalog.yml'

permissions:
  contents: read

jobs:
  verify-live-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify live Stripe catalog is correctly priced and fail-closed
        run: node --test scripts/test-intelligence-live-stripe-catalog.mjs
      - name: Verify enterprise release ledger remains intact
        run: npm run intelligence:requirements:validate
