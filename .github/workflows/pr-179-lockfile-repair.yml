name: PR 179 dependency lockfile repair
on:
  push:
    branches:
      - dependabot/npm_and_yarn/development-dependencies-766a7676c2
    paths:
      - .github/workflows/pr-179-lockfile-repair.yml
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  resolve-npm-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Regenerate npm lock without dependency lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify immutable npm installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate pnpm lockfile under declared pnpm version
        run: |
          npm install -g pnpm@11.9.0 --ignore-scripts --no-audit --no-fund
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Export refreshed npm and pnpm lockfiles for review
        run: |
          node -e 'const fs=require("node:fs"); for (const [file,key] of [["package-lock.json","NPM"],["pnpm-lock.yaml","PNPM"]]) { const b=fs.readFileSync(file).toString("base64"); console.log("NOVA_PR179_"+key+"_BEGIN"); for(let i=0;i<b.length;i+=3000) console.log(b.slice(i,i+3000)); console.log("NOVA_PR179_"+key+"_END"); }'
