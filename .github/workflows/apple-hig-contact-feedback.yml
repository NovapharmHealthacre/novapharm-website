name: Apple HIG Contact Feedback Contract
on:
  pull_request:
    paths:
      - "apps/corporate/components/contact-workflow.tsx"
      - "apps/corporate/test/contact-feedback-contract.test.ts"
      - ".github/workflows/apple-hig-contact-feedback.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Verify contact feedback and submission guard
        working-directory: apps/corporate
        run: npx tsx --test test/contact-feedback-contract.test.ts test/contact-premium.test.ts
      - name: Verify corporate TypeScript constraints
        run: npm run typecheck -w @novapharm/corporate
