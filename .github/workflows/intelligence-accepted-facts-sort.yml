name: Medicines accepted-facts sorting contract
on:
  pull_request:
    paths:
      - 'src/core/medicines-query-contract.mjs'
      - 'src/core/medicines-intelligence-service.mjs'
      - 'apps/portal/components/medicines-intelligence.tsx'
      - 'apps/portal/test/browser-acceptance.ts'
      - 'scripts/test-medicines-intelligence-service.mjs'
      - '.github/workflows/intelligence-accepted-facts-sort.yml'
permissions:
  contents: read
jobs:
  protected-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install pinned repository dependencies
        run: npm ci
      - name: Exercise real SQLite medicine analytics, sorting, pagination and role boundary
        run: npm run test:medicines-intelligence
      - name: Check strict Next.js portal types and internal contracts
        run: npm run portal:check
      - name: Verify ledger truth remains bounded
        run: npm run intelligence:requirements:validate
