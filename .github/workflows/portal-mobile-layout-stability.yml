name: Portal mobile layout stability source contract
on:
  pull_request:
    paths:
      - 'apps/portal/components/dashboard.tsx'
      - 'apps/portal/components/customer-commerce-workspace.tsx'
      - 'apps/portal/components/module-presentations.module.css'
      - 'scripts/test-portal-customer-dom-order.mjs'
      - '.github/workflows/portal-mobile-layout-stability.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/components/dashboard.tsx'
      - 'apps/portal/components/customer-commerce-workspace.tsx'
      - 'apps/portal/components/module-presentations.module.css'
      - 'scripts/test-portal-customer-dom-order.mjs'
      - '.github/workflows/portal-mobile-layout-stability.yml'
permissions:
  contents: read
jobs:
  customer-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node --test scripts/test-portal-customer-dom-order.mjs
