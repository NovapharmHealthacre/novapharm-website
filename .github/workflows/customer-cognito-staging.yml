name: Customer Cognito staging identity isolation
on:
  pull_request:
    paths:
      - 'infra/aws/customer-cognito-staging.json'
      - 'scripts/aws/customer-cognito-staging.test.mjs'
      - '.github/workflows/customer-cognito-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-identity-default-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Assert self-signup disabled and customer pool isolated from workforce
        run: node --test scripts/aws/customer-cognito-staging.test.mjs
