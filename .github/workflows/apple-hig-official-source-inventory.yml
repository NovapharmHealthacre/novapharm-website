name: Apple HIG authoritative source inventory (metadata only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-hig-official-source-inventory
  cancel-in-progress: false

jobs:
  fetch-official-hig-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate offline source-auditor code
        run: node --check scripts/audit-apple-hig-official-sources.mjs
      - name: Fetch only 172 public Apple Markdown sources, headings and inside-link metadata
        env:
          HIG_SOURCE_AUDIT_NETWORK: '1'
        run: node scripts/audit-apple-hig-official-sources.mjs
      - name: Preserve output even when official links reject requests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v6
        with:
          name: apple-hig-official-metadata
          path: audit/evidence/apple-hig-official-source-metadata.json
          retention-days: 14
          if-no-files-found: warn
