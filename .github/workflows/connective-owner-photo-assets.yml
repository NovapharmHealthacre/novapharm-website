name: Materialise 395 owner-authorised original Connective photos
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/materialize-connective-owner-photos.py"
      - ".github/workflows/connective-owner-photo-assets.yml"
permissions:
  contents: write
  actions: read
jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: connective-packshot-review
          path: review/batch01
          run-id: 45533367019
          github-token: ${{ github.token }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: connective-batch02-part-*
          path: review/batch02
          run-id: 45537009006
          github-token: ${{ github.token }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vitabiotics-packshot-review
          path: review/vitabiotics
          run-id: 45545185102
          github-token: ${{ github.token }
      - name: Install pinned media decoder in isolated environment
        run: |
          python3 -m venv /tmp/npr-image-env
          /tmp/npr-image-env/bin/pip install --disable-pip-version-check Pillow==12.3.0
      - name: Check original evidence and build 395 WebP derivatives
        run: /tmp/npr-image-env/bin/python scripts/materialize-connective-owner-photos.py
      - name: Commit candidates only on this working PR branch
        env:
          TARGET_BRANCH: ${{ github.head_ref }
        run: |
          git config user.name "novapharm-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -- assets/media/products/connective docs/retail/connective-395-owner-photo-candidates.json
          if git diff --cached --quiet; then
            echo "All candidate images already staged"
          else
            git commit -m "Stage 395 verified-original Connective photo derivatives"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
