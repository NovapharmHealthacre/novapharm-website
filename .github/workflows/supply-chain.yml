name: Supply chain

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - name: Install the immutable dependency graph
        run: npm ci --ignore-scripts
      - name: Verify the migration workspace lock
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Audit production dependency graph under pnpm as well
        run: pnpm audit --prod --audit-level high
      - name: Validate action pins, dependency licences and release governance
        run: npm run supply-chain:validate
      - name: Generate CycloneDX SBOM and checksum
        run: |
          npm sbom --sbom-format cyclonedx > novapharm.cdx.json
          sha256sum novapharm.cdx.json > novapharm.cdx.json.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: novapharm-sbom-${{ github.sha }}
          path: |
            novapharm.cdx.json
            novapharm.cdx.json.sha256
          if-no-files-found: error
          retention-days: 30
