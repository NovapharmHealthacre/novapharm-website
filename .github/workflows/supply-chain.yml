name: Supply chain

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0
          run_install: false
      - name: Install the immutable dependency graph
        run: npm ci --ignore-scripts
      - name: Verify the migration workspace lock
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Validate action pins, dependency licences and release governance
        run: npm run supply-chain:validate
      - name: Generate CycloneDX SBOM and checksum
        run: |
          npm sbom --sbom-format cyclonedx > novapharm.cdx.json
          sha256sum novapharm.cdx.json > novapharm.cdx.json.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-sbom-${{ github.sha }}
          path: |
            novapharm.cdx.json
            novapharm.cdx.json.sha256
          if-no-files-found: error
          retention-days: 30
