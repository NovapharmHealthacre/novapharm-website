name: Supply chain

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
          run_install: false
      - name: Install the immutable dependency graph
        run: npm ci --ignore-scripts
      - name: Verify the migration workspace lock
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Validate action pins, dependency licences and release governance
        run: npm run supply-chain:validate
      - name: Generate CycloneDX SBOM and checksum
        run: |
          npm sbom --sbom-format cyclonedx > novapharm.cdx.json
          sha256sum novapharm.cdx.json > novapharm.cdx.json.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novapharm-sbom-${{ github.sha }}
          path: |
            novapharm.cdx.json
            novapharm.cdx.json.sha256
          if-no-files-found: error
          retention-days: 30
