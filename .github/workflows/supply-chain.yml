name: Supply chain

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# PR-only supersession prevents stale commits competing for runner slots.
# Each main push and manual dispatch has a unique group: no cancellation there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0
          run_install: false
      - name: Install the immutable dependency graph
        run: npm ci --ignore-scripts
      - name: Verify the migration workspace lock
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Validate action pins, dependency licences and release governance
        run: npm run supply-chain:validate
      - name: Generate CycloneDX SBOM and checksum
        run: |
          npm sbom --sbom-format cyclonedx > novapharm.cdx.json
          sha256sum novapharm.cdx.json > novapharm.cdx.json.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-sbom-${{ github.sha }}
          path: |
            novapharm.cdx.json
            novapharm.cdx.json.sha256
          if-no-files-found: error
          retention-days: 30
