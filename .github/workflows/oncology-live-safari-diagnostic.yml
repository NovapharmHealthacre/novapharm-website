name: Diagnose live Oncology rendering in Chromium and WebKit
on:
  pull_request:
    paths:
      - '.github/workflows/oncology-live-safari-diagnostic.yml'
      - 'scripts/probe-live-oncology.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-ss2-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Capture actual live origin and computed Safari styles
        run: node scripts/probe-live-oncology.mjs
      - name: Preserve screenshots and computed cascade
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oncology-live-safari-${{ github.sha }}
          path: artifacts/oncology-live-safari
          if-no-files-found: warn
          retention-days: 7
