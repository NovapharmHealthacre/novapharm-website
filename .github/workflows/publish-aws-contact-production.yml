                break
              fi
              sed -n '/<header class="site-header npd-header"/,/<\/header>/p' "$target" > /tmp/owner-final-header.html
              if ! grep -Fq "href=\"/assets/css/novapharm.bundle.css?v=20261111-forensic-design-v3&amp;sha256=${bundle_css_sha256}\"" "$target" \
                || ! grep -Fq '<picture class="brand-logo"><img src="/assets/brand/novapharm-healthcare-logo.png"' /tmp/owner-final-header.html \
                || ! grep -Fq 'href="https://portal.novapharmhealthcare.com/"' /tmp/owner-final-header.html; then
                verified=false
                break
              fi
            done
            if [ "$verified" = true ]; then
              curl --fail --silent --show-error --location --max-time 20 \
                "https://novapharmhealthcare.com/assets/brand/novapharm-healthcare-logo.png?owner-final-${GITHUB_SHA}" \
                -o /tmp/owner-final-red-logo.png
              cmp -s assets/brand/novapharm-healthcare-logo.png /tmp/owner-final-red-logo.png || verified=false
            fi
            if [ "$verified" = true ]; then
              echo 'Official red master logo and direct Secure Portal verified in every live primary header.'
              break
            fi
            sleep 5
          done
          test "$verified" = true || {
            echo '::error::Official red logo or Secure Portal still missing on at least one production header.'
            exit 1
          }

      - name: Verify unified Products hero and source photography on live custom domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            url="https://novapharmhealthcare.com/products/?products-$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache, no-store' "$url" \
              -o /tmp/novapharm-live-products.html \
              && grep -Fq 'Different products.' /tmp/novapharm-live-products.html \
              && grep -Fq 'np-products-stage-nutraxin' /tmp/novapharm-live-products.html \
              && grep -Fq 'np-products-stage-esco' /tmp/novapharm-live-products.html \
              && grep -Fq 'np-products-stage-pharma' /tmp/novapharm-live-products.html \
              && grep -Fq 'href="/products/esco/"' /tmp/novapharm-live-products.html; then
              curl --fail --silent --show-error --max-time 20 \
                "https://novapharmhealthcare.com/assets/css/products-editorial.css?products-$GITHUB_SHA" \
                -o /tmp/novapharm-live-products.css
              if grep -Fq 'PRODUCTS UNIFIED HERO 2026-11-10' /tmp/novapharm-live-products.css \
                && grep -Fq 'mask-image:radial-gradient' /tmp/novapharm-live-products.css; then
                echo 'Approved Nutraxin, ESCO and pharmaceutical hero design and edge blending verified on live custom domain.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo '::error::Unified Products hero or unframed supplier photography CSS is not live.'
          exit 1

      - name: Verify live Global Distribution, Market Access and Markets pages
        run: |
          set -euo pipefail
          distribution_css_sha256="$(sha256sum assets/css/global-distribution-editorial.css)"
          distribution_css_sha256="${distribution_css_sha256%% *}"
          markets_css_sha256="$(sha256sum assets/css/markets-editorial.css)"
          markets_css_sha256="${markets_css_sha256%% *}"
          for route in distribution market-access markets; do
            verified=false
            for attempt in $(seq 1 18); do
              url="https://novapharmhealthcare.com/$route/?release=$GITHUB_SHA-$attempt-$(date +%s)"
              if curl --fail --silent --show-error --location --max-time 15 \
                  -H 'Cache-Control: no-cache, no-store' "$url" -o "/tmp/novapharm-$route.html" \
                && grep -Fq 'Regulated pharmaceutical wholesale supply has not commenced' "/tmp/novapharm-$route.html" \
                && grep -Fq "href=\"/assets/css/global-distribution-editorial.css?v=20261111-forensic-design-v3&amp;sha256=${distribution_css_sha256}\"" "/tmp/novapharm-$route.html" \
                && grep -Fq "https://novapharmhealthcare.com/$route/" "/tmp/novapharm-$route.html"; then
                verified=true
                break
              fi
              sleep 5
            done
            test "$verified" = true || { echo "::error::$route not verified live on the customer domain"; exit 1; }
          done
          # Confirm the actual new hero and owner-provided warehouse, not just the legacy route.
          grep -Fq 'data-distribution-design="20261111-real-warehouse"' /tmp/novapharm-distribution.html
          grep -Fq 'Global distribution<br>for modern healthcare.' /tmp/novapharm-distribution.html
          grep -Fq '/assets/media/insights/compliance-first-distribution-960.jpg' /tmp/novapharm-distribution.html
          grep -Fq 'class="ndist-hero-warehouse" src="/assets/media/about/novapharm-warehouse-original.jpg"' /tmp/novapharm-distribution.html
          curl --fail --silent --show-error --location --max-time 15 \
            'https://novapharmhealthcare.com/assets/css/global-distribution-editorial.css' \
            -o /tmp/global-distribution-editorial.css
          grep -Fq 'White space, quiet typography' /tmp/global-distribution-editorial.css
          # Confirm the original full-resolution NASA Expedition 70 photograph
          # is published, not the earlier soft third-party preview.
          grep -Fq 'data-markets-design="apple-photographic-approved-20261111"' /tmp/novapharm-markets.html
          grep -Fq 'iss070e075895_lrg.jpg" width="5568" height="3712"' /tmp/novapharm-markets.html
          grep -Fq "href=\"/assets/css/markets-editorial.css?v=20261111-nasa-hd-1&amp;sha256=${markets_css_sha256}\"" /tmp/novapharm-markets.html
          if grep -Fq 'd2pn8kiwq2w21t.cloudfront.net' /tmp/novapharm-markets.html; then
            echo '::error::Retired soft Markets hero remains live.'
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 20 \
            "https://novapharmhealthcare.com/assets/css/markets-editorial.css?source-$GITHUB_SHA" \
            -o /tmp/novapharm-markets-editorial.css
          grep -Fq 'NASA' /tmp/novapharm-markets-editorial.css
          echo 'Full-resolution NASA Markets hero, credited source and responsive CSS verified live.'
          echo 'All three canonical commercial routes and Apple-inspired styling are live.'

          # Prove Distribution exists in the actual visible primary navigation on
          # both the homepage and all three commercial routes (not only footers).
          for route in home distribution market-access markets; do
            verified=false
            for attempt in $(seq 1 18); do
              if [ "$route" = home ]; then path=""; else path="$route/"; fi
              url="https://novapharmhealthcare.com/${path}?nav-${GITHUB_SHA}-${attempt}-$(date +%s)"
              if curl --fail --silent --show-error --location --max-time 20 \
                   -H 'Cache-Control: no-cache, no-store' "$url" -o /tmp/novapharm-live-distribution-header.html; then
                sed -n '/<nav class="site-nav npd-global-nav"/,/<\/nav>/p' \
                  /tmp/novapharm-live-distribution-header.html > /tmp/novapharm-live-distribution-nav.html
                if grep -Fq 'href="/distribution/"' /tmp/novapharm-live-distribution-nav.html \
                  && grep -Fq 'data-mega-trigger="distribution"' /tmp/novapharm-live-distribution-nav.html \
                  && grep -Fq 'data-mega-panel="distribution"' /tmp/novapharm-live-distribution-header.html \
                  && grep -Fq 'href="https://portal.novapharmhealthcare.com/"' /tmp/novapharm-live-distribution-nav.html; then
                  verified=true
                  break
                fi
              fi
              sleep 5
            done
            test "$verified" = true || { echo "::error::Distribution primary navigation not verified on $route"; exit 1; }
          done
          echo 'Distribution primary menu and Secure Portal are live on all four routes.'

      - name: Verify live official Intelligence research with AWS contact preserved
        env:
          LIVE_ORIGIN: https://novapharmhealthcare.com
        shell: bash
        run: |
          set -euo pipefail
          technology_css_sha256="$(sha256sum assets/css/intelligence-workspace-embedded.css)"
          technology_css_sha256="${technology_css_sha256%% *}"
          key="npi-intel-$GITHUB_SHA-$(date +%s)"
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/technology/?$key" -o /tmp/npi-live-technology.html
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/assets/js/intelligence-live-research.js?$key" -o /tmp/npi-live-intelligence.js
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/contact/?$key" -o /tmp/npi-live-contact.html
          grep -Fq 'data-npi-research' /tmp/npi-live-technology.html
          # Public Intelligence directory must be present on the real customer domain.
          # Source/build success alone never certifies 22 published workspaces.
          grep -Fq 'id="intelligence-workspace-directory"' /tmp/npi-live-technology.html
          # Source-level 22-entry counts are insufficient: also verify the native
          # interactive UI and its shipped JS/CSS on the actual custom domain.
          grep -Fq 'id="npi-exp-shell"' /tmp/npi-live-technology.html
          grep -Fq 'src="/assets/js/intelligence-workspace-embedded.js"' /tmp/npi-live-technology.html
          grep -Fq "href=\"/assets/css/intelligence-workspace-embedded.css?v=20261111-forensic-design-v3&amp;sha256=${technology_css_sha256}\"" /tmp/npi-live-technology.html
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/assets/js/intelligence-workspace-embedded.js?$key" -o /tmp/npi-live-workspace-runtime.js
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/assets/css/intelligence-workspace-embedded.css?$key" -o /tmp/npi-live-workspace-styles.css
          grep -Fq 'function renderSupplyMode(mode)' /tmp/npi-live-workspace-runtime.js
          grep -Fq 'ILLUSTRATIVE PRODUCT EXPERIENCE' /tmp/npi-live-workspace-runtime.js
          grep -Fq 'npi-workspace-live-experience' /tmp/npi-live-workspace-styles.css
          grep -Fq 'ALL 22 PROFESSIONAL WORKSPACES' /tmp/npi-live-technology.html
          test "$(grep -o 'data-npi-workspace="' /tmp/npi-live-technology.html | wc -l | tr -d '[:space:]')" -eq 22
          grep -Fq 'Public research is available separately' /tmp/npi-live-technology.html
          grep -Fq 'src="/assets/js/intelligence-live-research.js"' /tmp/npi-live-technology.html
          grep -Fq 'US regulatory and trial searches send the medicine term' /tmp/npi-live-technology.html
          grep -Fq '5pcszvyqm1.execute-api.eu-north-1.amazonaws.com' /tmp/npi-live-intelligence.js
          grep -Fq 'data-live-b2b-enquiry-form' /tmp/npi-live-contact.html
          echo 'Live Intelligence official research and existing AWS-backed contact verified.'
