name: Publish verified AWS-backed contact form

on:
  push:
    branches: [main]
    paths:
      - 'products/nutraxin/**'
      - 'assets/data/nutraxin-consumer-auth.json'
      - 'src/content/site-content.mjs'
      - 'assets/js/nutraxin-consumer-account.js'
      - 'src/content/nutraxin-showcase.html'
      - 'assets/js/nutraxin-retail-store.js'
      - 'assets/js/contact-production.js'
      - 'assets/js/esco-catalogue.js'
      - 'scripts/apply-esco-catalogue.mjs'
      - 'scripts/esco-merchandising.mjs'
      - 'assets/js/esco-bag.js'
      - 'assets/css/esco-catalogue.css'
      - 'assets/data/esco-catalogue.json'
      - 'assets/data/esco-checkout-config.json'
      - 'scripts/test-esco-catalogue.mjs'
      - 'scripts/build-site.mjs'
      - 'assets/data/nutraxin-retail-catalogue.json'
      - 'scripts/apply-corporate-product-discipline.mjs'
      - 'scripts/enhance-seo-authority.mjs'
      - 'scripts/test-native-organic-marketing.mjs'
      - 'scripts/stage-pages-artifact.mjs'
      - 'scripts/validate-public-sitemaps.py'
      - 'assets/js/cookie-consent.js'
      - 'assets/js/consent-analytics.js'
      - 'legal/cookies/index.html'
      - 'legal/privacy/index.html'
      - '.github/workflows/publish-aws-contact-production.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved main commit SHA
        type: string
        required: true
      contact_api_origin:
        description: Verified eu-north-1 AWS HTTP API origin, HTTPS without a path
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: novapharm-pages-production
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exactly approved main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
          persist-credentials: false
      - name: Match independently reviewed commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Prove default public website is noncollecting
        run: |
          node scripts/test-static-public-source-safety.mjs
          node --test scripts/test-account-request-intake.mjs
          npm ci --ignore-scripts
          PUBLIC_ANALYTICS_PRIVACY_APPROVED=true PUBLIC_GA4_MEASUREMENT_ID=G-897L1VS8BX npm run build:public-only
          python3 scripts/validate-public-sitemaps.py
          node scripts/test-native-organic-marketing.mjs
          npm run test:owner-corrections:public-only
          node --test scripts/test-nutraxin-retail-store.mjs
          npm run test:cookies
          npm run validate:domain
          node scripts/stage-pages-artifact.mjs _site
          node --test scripts/test-esco-catalogue.mjs
          grep -Fq 'data-esco-catalogue' _site/products/esco/index.html
          grep -Fq 'data-esco-quote-items' _site/products/esco/index.html
          grep -Fq 'data-esco-bag-items' _site/products/esco/bag/index.html
          grep -Fq 'data-esco-card-checkout disabled' _site/products/esco/bag/index.html
          grep -Fq 'UK guide' _site/products/esco/index.html
          test -s _site/assets/data/esco-uk-guide-prices.json
          test -s _site/assets/data/esco-checkout-config.json
          grep -Fq 'data-esco-payment-terms' _site/products/esco/bag/index.html
          test -s _site/assets/js/esco-bag.js
          test -s _site/assets/media/esco/previews/esco-cat-0373.svg
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('_site/assets/data/esco-uk-guide-prices.json','utf8'));if(x.entriesTotal!==373||x.checkoutEnabled||x.paymentCollectionEnabled||!x.requestQuoteOnly||Object.keys(x.guidePrices).length!==373||Object.keys(x.visualPreviews).length!==373)process.exit(1)"

          grep -Fq 'ESCO Anand' _site/products/index.html
          test -s _site/assets/css/esco-catalogue.css
          test -s _site/assets/js/esco-catalogue.js
          grep -Fq 'ESCO Anand UK quotation request' _site/assets/js/contact-production.js
          test "$(tr -d '\r\n' < _site/da125ceca8032e01fc98782c388f894f.txt)" = 'da125ceca8032e01fc98782c388f894f'
          grep -Fq 'Simple from start to finish.' _site/products/nutraxin/bag/index.html
          grep -Fq 'Guest checkout available' _site/products/nutraxin/bag/index.html
          grep -Fq 'Nutraxin UK Supplements | Explore 19 Products | NovaPharm' _site/products/nutraxin/index.html
          grep -Fq 'name="novapharm-ga4-id" content="G-897L1VS8BX"' _site/products/nutraxin/index.html
          grep -Fq '/assets/js/consent-analytics.js' _site/products/nutraxin/index.html
          ! grep -Fq 'www.googletagmanager.com' _site/products/nutraxin/index.html
          ! grep -Fq 'novapharm-ga4-id' _site/contact/index.html
          ! grep -Fq 'novapharm-ga4-id' _site/portal/index.html
          ! grep -Fq 'novapharm-ga4-id' _site/legal/cookies/index.html
          grep -Fq 'Google Analytics 4' _site/legal/cookies/index.html
          test -s _site/assets/js/consent-analytics.js
          jq -e '.enabled == true and .account_url == "https://novapharmhealthcare.com/products/nutraxin/account/"' _site/assets/data/nutraxin-consumer-auth.json
          test -s _site/products/nutraxin/account/index.html
          test -s _site/assets/js/nutraxin-consumer-account.js
          grep -Fq 'class="nx-purchase-progress"' _site/products/nutraxin/bag/index.html
          node scripts/check-links.mjs _site
          test -s _site/assets/js/contact-production.js
          test -s _site/assets/js/account-request-production.js
          test -s _site/assets/css/account-request.css
      - name: Validate deployed AWS API and record one synthetic business receipt
        env:
          CONTACT_ORIGIN: ${{ github.event_name == 'push' && 'https://h4dc1e4u57.execute-api.eu-north-1.amazonaws.com' || inputs.contact_api_origin }}
        run: |
          set -euo pipefail
          [[ "$CONTACT_ORIGIN" =~ ^https://[a-z0-9]+\.execute-api\.eu-north-1\.amazonaws\.com$ ]] || exit 1
          curl --fail --silent --show-error --max-time 15 \
            -H "Cache-Control: no-cache" \
            "$CONTACT_ORIGIN/health" -o /tmp/novapharm-contact-health.json
          jq -e '.service == "novapharm-contact-intake" and .ready == true and .environment == "production"' /tmp/novapharm-contact-health.json
          rejected=$(curl --silent --show-error --max-time 15 -o /tmp/novapharm-anon.json -w '%{http_code}' \
            -X POST "$CONTACT_ORIGIN/contact" \
            -H 'Content-Type: application/json' -d '{}' )
          test "$rejected" = "403"
          echo '{
            "name":"SYNTHETIC-NOVAPHARM-QA",
            "email":"synthetic@example.com",
            "company":"NovaPharm QA",
            "role":"Release acceptance",
            "country":"United Kingdom",
            "telephone":"",
            "enquiryType":"General enquiry",
            "message":"SYNTHETIC DATA. Verified AWS release acceptance for NovaPharm business enquiry route.",
            "website":"",
            "privacyAcknowledgement":"yes",
            "safetyConfirmation":"yes"
          }' > /tmp/novapharm-qa-input.json
          outcome=$(curl --silent --show-error --max-time 15 -o /tmp/novapharm-qa-receipt.json -w '%{http_code}' \
            -X POST "$CONTACT_ORIGIN/contact" \
            -H 'Origin: https://novapharmhealthcare.com' \
            -H 'Content-Type: application/json' \
            -H 'X-Novapharm-Intake: v1' \
            --data-binary @/tmp/novapharm-qa-input.json)
          test "$outcome" = "201"
          jq -e '.ok == true and .persisted == true and .notificationAccepted == true and (.receiptId | test("^[0-9a-f-]{36}$"))' /tmp/novapharm-qa-receipt.json
          echo "Synthetic AWS durable storage and accepted notification confirmed."
      - name: Activate contact on staged Pages artifact only
        env:
          NOVAPHARM_CONTACT_RELEASE_ACCEPTED: "yes"
          NOVAPHARM_CONTACT_ARTIFACT_ROOT: "_site"
          NOVAPHARM_CONTACT_API_ORIGIN: ${{ github.event_name == 'push' && 'https://h4dc1e4u57.execute-api.eu-north-1.amazonaws.com' || inputs.contact_api_origin }}
        run: |
          node scripts/activate-contact-intake.mjs
          grep -Fq 'data-live-b2b-enquiry-form' _site/contact/index.html
          grep -Fq 'data-live-contact-status' _site/contact/index.html
          grep -Fq 'name="privacyAcknowledgement"' _site/contact/index.html
          grep -Fq 'name="safetyConfirmation"' _site/contact/index.html
          grep -Fq 'src="/assets/js/contact-production.js"' _site/contact/index.html
          grep -Fq 'Secure online enquiry storage' _site/legal/privacy/index.html
          grep -Fq 'data-live-account-request-form' _site/account-application/index.html
          grep -Fq 'data-account-request-status' _site/account-application/index.html
          grep -Fq "data-api-origin=\"$NOVAPHARM_CONTACT_API_ORIGIN\"" _site/account-application/index.html
          grep -Fq 'src="/assets/js/account-request-production.js"' _site/account-application/index.html
          grep -Fq 'name="privacyAcknowledgement"' _site/account-application/index.html
          grep -Fq 'name="safetyConfirmation"' _site/account-application/index.html
          ! grep -Fq 'type="password"' _site/account-application/index.html
          ! grep -Fq 'type="file"' _site/account-application/index.html
          ! grep -Fq 'data-email-enquiry-form' _site/contact/index.html
          ! grep -Fq 'This public information release does not collect or transmit enquiry details' _site/contact/index.html
          grep -Fq 'This public website never asks for a portal username, password or confidential company record' _site/portal/index.html
          ! grep -Fq 'type="password"' _site/portal/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload exact verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.ship.outputs.page_url }}
    steps:
      - name: Publish verified Pages artifact
        id: ship
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Verify customer contact form on NovaPharm domain without exposing portal login
        env:
          EXPECTED_ORIGIN: ${{ github.event_name == 'push' && 'https://h4dc1e4u57.execute-api.eu-north-1.amazonaws.com' || inputs.contact_api_origin }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            url="https://novapharmhealthcare.com/contact/?accepted-$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location --max-time 15 -H "Cache-Control: no-cache" "$url" > /tmp/novapharm-live-contact.html; then
              if grep -Fq 'data-live-b2b-enquiry-form' /tmp/novapharm-live-contact.html \
                && grep -Fq "$EXPECTED_ORIGIN" /tmp/novapharm-live-contact.html \
                && grep -Fq 'src="/assets/js/contact-production.js"' /tmp/novapharm-live-contact.html \
                && ! grep -Fq 'data-email-enquiry-form' /tmp/novapharm-live-contact.html; then
                curl --fail --silent --show-error --max-time 15 -o /tmp/novapharm-live-contact.js "https://novapharmhealthcare.com/assets/js/contact-production.js"
                grep -Fq "data-live-b2b-enquiry-form" /tmp/novapharm-live-contact.js
                curl --fail --silent --show-error --location --max-time 15 -H "Cache-Control: no-cache" \
                  "https://novapharmhealthcare.com/account-application/?accepted-$GITHUB_SHA-$attempt-$(date +%s)" > /tmp/novapharm-live-account.html
                grep -Fq 'data-live-account-request-form' /tmp/novapharm-live-account.html
                grep -Fq "$EXPECTED_ORIGIN" /tmp/novapharm-live-account.html
                grep -Fq 'src="/assets/js/account-request-production.js"' /tmp/novapharm-live-account.html
                ! grep -Fq 'type="password"' /tmp/novapharm-live-account.html
                curl --fail --silent --show-error --max-time 15 \
                  -o /tmp/novapharm-live-account.js "https://novapharmhealthcare.com/assets/js/account-request-production.js"
                grep -Fq 'data-live-account-request-form' /tmp/novapharm-live-account.js
                echo "Public business contact and receipt-only account-request forms are online after verified AWS acceptance."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Cutover not verified on customer domain. Treat release as FAILED and restore public-only artifact." >&2
          exit 1

      - name: Verify unified Nutraxin Bag on the live domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            url="https://novapharmhealthcare.com/products/nutraxin/bag/?release-$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location --max-time 15 -H "Cache-Control: no-cache" "$url" -o /tmp/novapharm-live-bag.html; then
              if grep -Fq 'Simple from start to finish.' /tmp/novapharm-live-bag.html \
                && grep -Fq 'Guest checkout available' /tmp/novapharm-live-bag.html \
                && grep -Fq 'class="nx-purchase-progress"' /tmp/novapharm-live-bag.html; then
                curl --fail --silent --show-error --location --max-time 15 \
                  "https://novapharmhealthcare.com/assets/js/nutraxin-retail-store.js" \
                  -o /tmp/novapharm-live-shopping.js
                grep -Fq 'CHECKOUT_API_ORIGIN' /tmp/novapharm-live-shopping.js
                grep -Fq 'Continue as guest' /tmp/novapharm-live-shopping.js
                echo "Live Nutraxin guest checkout journey matches approved Pages artifact."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Live Nutraxin Bag did not match the approved Apple-style release." >&2
          exit 1

      - name: Verify limited consumer registration on the live custom domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            cache="account-${GITHUB_SHA}-${attempt}-$(date +%s)"
            if curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache, no-store' "https://novapharmhealthcare.com/assets/data/nutraxin-consumer-auth.json?${cache}" -o /tmp/novapharm-live-consumer-auth.json \
               && jq -e '.enabled == true and .account_url == "https://novapharmhealthcare.com/products/nutraxin/account/"' /tmp/novapharm-live-consumer-auth.json; then
              curl --fail --silent --show-error --location --max-time 15 "https://novapharmhealthcare.com/products/nutraxin/account/?${cache}" -o /tmp/novapharm-live-consumer-page.html
              grep -Fq 'data-nx-account-public' /tmp/novapharm-live-consumer-page.html
              grep -Fq '/assets/js/nutraxin-consumer-account.js' /tmp/novapharm-live-consumer-page.html
              echo "Limited account registration is served. Real verified-email customer acceptance remains separate."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Account signup config not verified on live website." >&2
          exit 1
      - name: Verify ESCO Anand catalogue and quotation list on live custom domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            url="https://novapharmhealthcare.com/products/esco/?release-$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location --max-time 15 -H "Cache-Control: no-cache, no-store" "$url" -o /tmp/novapharm-live-esco.html; then
              if grep -Fq 'data-esco-catalogue' /tmp/novapharm-live-esco.html \
                && grep -Fq 'data-esco-quote-items' /tmp/novapharm-live-esco.html \
                && grep -Fq 'ESCO-CAT-0373' /tmp/novapharm-live-esco.html \
                && grep -Fq '373 catalogue entries' /tmp/novapharm-live-esco.html; then
                curl --fail --silent --show-error --max-time 15 "https://novapharmhealthcare.com/assets/js/esco-catalogue.js" -o /tmp/novapharm-live-esco.js
                grep -Fq 'MAX_ITEMS = 12' /tmp/novapharm-live-esco.js
                curl --fail --silent --show-error --max-time 15 "https://novapharmhealthcare.com/assets/css/esco-catalogue.css" -o /tmp/novapharm-live-esco.css
                grep -Fq '.esco-category-image' /tmp/novapharm-live-esco.css
                echo "ESCO Anand 373-entry collection, responsive category assets and quotation list live on production domain."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::ESCO catalogue not verified on production custom domain." >&2
          exit 1

      - name: Verify customer ESCO Bag, 373 guide prices and visual previews on the live domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            url="https://novapharmhealthcare.com/products/esco/bag/?release-$GITHUB_SHA-$attempt-$(date +%s)"
            if curl --fail --silent --show-error --location --max-time 15 -H "Cache-Control: no-cache, no-store" "$url" -o /tmp/novapharm-live-esco-bag.html \
              && grep -Fq 'data-esco-bag-items' /tmp/novapharm-live-esco-bag.html \
              && grep -Fq 'data-esco-bag-quote' /tmp/novapharm-live-esco-bag.html \
              && grep -Fq 'data-esco-card-checkout disabled' /tmp/novapharm-live-esco-bag.html; then
              curl --fail --silent --show-error --max-time 15 \
                "https://novapharmhealthcare.com/assets/data/esco-uk-guide-prices.json?release-$GITHUB_SHA" \
                -o /tmp/novapharm-live-esco-guides.json
              jq -e '.entriesTotal == 373 and (.guidePrices | length) == 373 and (.visualPreviews | length) == 373 and .checkoutEnabled == false and .paymentCollectionEnabled == false and .requestQuoteOnly == true' \
                /tmp/novapharm-live-esco-guides.json
              curl --fail --silent --show-error --max-time 15 \
                "https://novapharmhealthcare.com/assets/js/esco-bag.js?release-$GITHUB_SHA" \
                -o /tmp/novapharm-live-esco-bag.js
              grep -Fq 'MAX_ITEMS = 12' /tmp/novapharm-live-esco-bag.js
              curl --fail --silent --show-error --max-time 15 \
                "https://novapharmhealthcare.com/assets/media/esco/previews/esco-cat-0373.svg?release-$GITHUB_SHA" \
                -o /tmp/novapharm-live-esco-preview.svg
              grep -Fq 'Concept illustration for' /tmp/novapharm-live-esco-preview.svg
              echo "Live ESCO Bag, 373 indicative guide prices, product previews and disabled-until-approved card controls verified."
              exit 0
            fi
            sleep 5
          done
          echo "::error::ESCO Bag customer journey and non-binding price assets not verified on production custom domain." >&2
          exit 1

      - name: Verify ESCO protected card readiness without initiating customer payments
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "https://novapharmhealthcare.com/assets/data/esco-checkout-config.json?release-$GITHUB_SHA" \
            -o /tmp/novapharm-live-esco-checkout-config.json
          node -e "const x=require('/tmp/novapharm-live-esco-checkout-config.json');if(x.enabled!==true||x.public_guide_prices_authorize_payment!==false||!/^https:\/\/[a-z0-9]+\.execute-api\.eu-north-1\.amazonaws\.com$/.test(x.api_origin))process.exit(1)"
          curl --fail --silent --show-error --max-time 20 \
            -H 'Origin: https://novapharmhealthcare.com' \
            "https://vflz5z5jfc.execute-api.eu-north-1.amazonaws.com/readiness" \
            -o /tmp/novapharm-esco-checkout-readiness.json
          node -e "const x=require('/tmp/novapharm-esco-checkout-readiness.json');if(typeof x.checkout_ready!=='boolean'||!Array.isArray(x.approved_catalogue_ids)||x.payment_collection_active!==x.checkout_ready)process.exit(1)"
          echo "ESCO public payment discovery and live server-authoritative readiness verified; no payment initiated."
      - name: Verify live organic search title and privacy-gated analytics asset
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 -H "Cache-Control: no-cache, no-store" \
              "https://novapharmhealthcare.com/products/nutraxin/?marketing-$GITHUB_SHA-$attempt-$(date +%s)" \
              -o /tmp/novapharm-live-organic.html; then
              if grep -Fq 'Nutraxin UK Supplements | Explore 19 Products | NovaPharm' /tmp/novapharm-live-organic.html \
                 && grep -Fq 'name="novapharm-ga4-id" content="G-897L1VS8BX"' /tmp/novapharm-live-organic.html \
                 && grep -Fq '/assets/js/consent-analytics.js' /tmp/novapharm-live-organic.html \
                 && ! grep -Fq 'www.googletagmanager.com' /tmp/novapharm-live-organic.html; then
                curl --fail --silent --show-error --max-time 15 \
                  "https://novapharmhealthcare.com/assets/js/consent-analytics.js" \
                  -o /tmp/novapharm-live-analytics.js
                grep -Fq 'novapharm:consent' /tmp/novapharm-live-analytics.js
                grep -Fq 'analyticsConsent()' /tmp/novapharm-live-analytics.js
                curl --fail --silent --show-error --location --max-time 15 "https://novapharmhealthcare.com/contact/?ga4-$GITHUB_SHA-$attempt" -o /tmp/novapharm-live-analytics-contact.html
                ! grep -Fq 'novapharm-ga4-id' /tmp/novapharm-live-analytics-contact.html
                curl --fail --silent --show-error --location --max-time 15 "https://novapharmhealthcare.com/legal/cookies/?ga4-$GITHUB_SHA-$attempt" -o /tmp/novapharm-live-cookie-notice.html
                grep -Fq 'Google Analytics 4' /tmp/novapharm-live-cookie-notice.html
                echo "Consented NovaPharm GA4 public tag verified; no tag on Contact or legal routes."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Live organic metadata or inactive analytics contract did not match accepted release." >&2
          exit 1
      - name: Check out verified main source for IndexNow
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Notify IndexNow of verified changed public product URLs
        continue-on-error: true
        run: |
          set -euo pipefail
          key_url="https://novapharmhealthcare.com/da125ceca8032e01fc98782c388f894f.txt"
          actual=$(curl --fail --silent --show-error --max-time 15 "$key_url" | tr -d '\r\n')
          test "$actual" = "da125ceca8032e01fc98782c388f894f" || {
            echo "::warning::Published IndexNow ownership key unverified; URLs not submitted."
            exit 1
          }
          node scripts/indexnow.mjs --submit \
            https://novapharmhealthcare.com/products/ \
            https://novapharmhealthcare.com/products/nutraxin/
