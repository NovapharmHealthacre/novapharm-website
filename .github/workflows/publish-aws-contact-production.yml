name: Publish verified AWS-backed contact form

on:
  push:
    branches: [main]
    paths:
      - 'products/nutraxin/**'
      - 'assets/data/nutraxin-consumer-auth.json'
      - 'assets/js/nutraxin-consumer-account.js'
      - 'assets/css/nutraxin-consumer-account.css'
      - 'scripts/test-nutraxin-consumer-account.mjs'
      - 'src/content/nutraxin-showcase.html'
      - 'assets/js/nutraxin-retail-store.js'
      - 'assets/js/contact-production.js'
      - 'assets/js/esco-catalogue.js'
      - 'scripts/apply-esco-catalogue.mjs'
      - 'scripts/esco-merchandising.mjs'
      - 'assets/js/esco-bag.js'
      - 'assets/js/commerce-marketplace.js'
      - 'assets/css/commerce-marketplace.css'
      - 'scripts/generate-commerce-marketplace.mjs'
      - 'scripts/generate-commerce-tracking.mjs'
      - 'scripts/test-commerce-stock-live.mjs'
      - 'scripts/test-commerce-marketplace.mjs'
      - 'infra/aws/commerce-stock-public-production.json'
      - 'apps/commerce-stock-api/index.py'
      - 'assets/css/esco-catalogue.css'
      - 'assets/data/esco-catalogue.json'
      - 'assets/data/esco-checkout-config.json'
      - 'scripts/test-esco-catalogue.mjs'
      - 'scripts/check-pages-monotonic-release.mjs'
      - 'scripts/test-pages-monotonic-release.mjs'
      # Owner-approved Capabilities Earth/vial and editorial typography are release surfaces.
      - 'capabilities/index.html'
      - 'src/content/capabilities-editorial.html'
      - 'assets/css/capabilities-editorial.css'
      - 'scripts/apply-capabilities-editorial.mjs'
      # Owner-approved About editorial is a public release surface.
      - 'about/**'
      - 'assets/css/about-editorial.css'
      # Publish and verify the owner-approved Products experience on every future revision.
      - 'products/index.html'
      - 'src/content/products-editorial.html'
      - 'assets/css/products-editorial.css'
      - 'scripts/apply-products-editorial.mjs'
      - 'assets/media/about/**'
      - 'scripts/apply-about-editorial.mjs'
      - 'scripts/build-site.mjs'
      - 'scripts/version-public-visual-assets.mjs'
      - 'assets/css/homepage-editorial.css'
      - 'scripts/validate-site.mjs'
      # Keep corporate app route parity and new commercial site releases in the
      # same AWS-backed publisher as the verified live contact service.
      - 'apps/corporate/data/site.ts'
      - 'apps/corporate/data/pages.ts'
      - 'apps/corporate/scripts/validate-content.ts'
      - 'src/content/site-content.mjs'
      - 'scripts/apply-global-distribution-foundation.mjs'
      - 'assets/css/global-distribution-editorial.css'
      # Owner-approved original NASA photographic Markets hero and attribution.
      - 'scripts/apply-markets-editorial.mjs'
      - 'assets/css/markets-editorial.css'
      - 'scripts/test-global-distribution-foundation.mjs'
      - 'assets/data/nutraxin-retail-catalogue.json'
      - 'scripts/apply-corporate-product-discipline.mjs'
      - 'technology/index.html'
      # The interactive customer-facing workspace section and its published assets.
      - 'technology/workspaces/**'
      - 'assets/css/intelligence-workspace-embedded.css'
      - 'assets/js/intelligence-workspace-embedded.js'
      - 'assets/css/intelligence-workspace-product.css'
      - 'assets/js/intelligence-workspace-product.js'
      - 'src/content/technology-intelligence.html'
      - 'assets/js/intelligence-live-research.js'
      - 'scripts/test-intelligence-live-public-research.mjs'
      - 'oncology/**'
      - 'assets/css/oncology-hope-v2.css'
      - 'assets/css/oncology-editorial.css'
      - 'assets/media/oncology/**'
      - 'scripts/test-oncology-content.mjs'
      - 'scripts/test-oncology-hero-browser.mjs'
      - '.github/workflows/oncology-hero-acceptance.yml'
      - 'scripts/test-public-pages-browser.mjs'
      - 'scripts/enhance-seo-authority.mjs'
      - 'scripts/test-native-organic-marketing.mjs'
      - 'scripts/stage-pages-artifact.mjs'
      - 'scripts/validate-public-sitemaps.py'
      - 'assets/js/cookie-consent.js'
      - 'assets/js/consent-analytics.js'
      - 'legal/cookies/index.html'
      - 'legal/privacy/index.html'
      - '.github/workflows/publish-aws-contact-production.yml'
      # Dispatch deduplication changes must trigger one independently verified publication.
      - '.github/workflows/dispatch-approved-aws-contact-release.yml'
      # Retain every legacy automatic public-release trigger in one guarded publisher.
      - '.github/workflows/pages-live-publish.yml'
      - 'assets/css/technology-intelligence.css'
      - 'scripts/test-intelligence-technology-page.mjs'
      - 'docs/strategy/global-distribution-execution.md'
      - 'package.json'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved main commit SHA
        type: string
        required: true
      contact_api_origin:
        description: Verified eu-north-1 AWS HTTP API origin, HTTPS without a path
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

# Exact-main verification precedes build; a verified artifact may publish later
# only when last successful Pages deployment and current main prove forward ancestry.
concurrency:
  # v3 isolates the guarded AWS-backed publisher from stale v2 Pages recovery locks.
  # Preserve one active/one pending publisher, independent forward-only ancestry
  # verification and every contact/commerce acceptance gate below.
  group: novapharm-pages-verified-aws-customer-publication-v3
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      bundle_css_sha256: ${{ steps.public_css.outputs.bundle_css_sha256 }}
    steps:
      - name: Checkout exactly approved main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
          persist-credentials: false
      - name: Match independently reviewed commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify queued source remains an ancestor of current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
        run: |
          set -euo pipefail
          node --test scripts/test-pages-ancestor-build.mjs
          node scripts/check-pages-ancestor-build.mjs
      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Prove default public website is noncollecting
        run: |
          node scripts/test-static-public-source-safety.mjs
          node --test scripts/test-pages-monotonic-release.mjs
          node --test scripts/test-account-request-intake.mjs
          npm ci --ignore-scripts
          PUBLIC_ANALYTICS_PRIVACY_APPROVED=true PUBLIC_GA4_MEASUREMENT_ID=G-897L1VS8BX npm run build:public-only
          npm run validate
          python3 scripts/validate-public-sitemaps.py
          node scripts/test-native-organic-marketing.mjs
          npm run test:owner-corrections:public-only
          node --test scripts/test-nutraxin-retail-store.mjs
          node --test scripts/test-nutraxin-consumer-account.mjs
          npm run test:cookies
          npm run validate:domain
          node scripts/stage-pages-artifact.mjs _site
          node --test scripts/test-intelligence-live-public-research.mjs
          test -s _site/technology/index.html
          # Reject publication when the owner-approved interactive Technology experience
          # or its CSP-safe native runtime is missing from the staged public artifact.
          test -s _site/assets/css/intelligence-workspace-embedded.css
          test -s _site/assets/js/intelligence-workspace-embedded.js
          grep -Fq 'id="npi-exp-shell"' _site/technology/index.html
          grep -Fq 'src="/assets/js/intelligence-workspace-embedded.js"' _site/technology/index.html
          technology_css_sha256="$(sha256sum _site/assets/css/intelligence-workspace-embedded.css)"
          technology_css_sha256="${technology_css_sha256%% *}"
          grep -Fq "href=\"/assets/css/intelligence-workspace-embedded.css?v=20261111-forensic-design-v3&amp;sha256=${technology_css_sha256}\"" _site/technology/index.html
          grep -Fq 'function renderSupplyMode(mode)' _site/assets/js/intelligence-workspace-embedded.js
          grep -Fq 'ILLUSTRATIVE PRODUCT EXPERIENCE' _site/assets/js/intelligence-workspace-embedded.js
          grep -Fq 'npi-workspace-live-experience' _site/assets/css/intelligence-workspace-embedded.css
          test -s _site/assets/js/intelligence-live-research.js
          grep -Fq 'data-npi-research' _site/technology/index.html
          grep -Fq 'src="/assets/js/intelligence-live-research.js"' _site/technology/index.html
          grep -Fq 'US regulatory and trial searches send the medicine term' _site/technology/index.html
          grep -Fq '5pcszvyqm1.execute-api.eu-north-1.amazonaws.com' _site/assets/js/intelligence-live-research.js
          # Three commercial routes must be included in the same verified release.
          distribution_css_sha256="$(sha256sum _site/assets/css/global-distribution-editorial.css)"
          distribution_css_sha256="${distribution_css_sha256%% *}"
          for route in distribution market-access markets; do
            test -s "_site/$route/index.html"
            grep -Fq 'Regulated pharmaceutical wholesale supply has not commenced' "_site/$route/index.html"
            grep -Fq "href=\"/assets/css/global-distribution-editorial.css?v=20261111-forensic-design-v3&amp;sha256=${distribution_css_sha256}\"" "_site/$route/index.html"
            grep -Fq "https://novapharmhealthcare.com/$route/" _site/sitemap.xml
          done
          # Distribution's premium release must not silently fall back to the old page.
          grep -Fq 'data-distribution-design="20261111-real-warehouse"' _site/distribution/index.html
          grep -Fq 'Global distribution<br>for modern healthcare.' _site/distribution/index.html
          grep -Fq '/assets/media/insights/compliance-first-distribution-960.jpg' _site/distribution/index.html
          grep -Fq 'class="ndist-hero-warehouse" src="/assets/media/about/novapharm-warehouse-original.jpg"' _site/distribution/index.html
          test -s _site/assets/media/about/novapharm-warehouse-original.jpg
          test -s _site/assets/media/insights/compliance-first-distribution-960.jpg
          test -s _site/assets/css/global-distribution-editorial.css
          grep -Fq 'id="commercial-pathways"' _site/index.html
          # A primary link, not a Capabilities sub-link or footer CTA, is required.
          sed -n '/<nav class="site-nav npd-global-nav"/,/<\/nav>/p' _site/index.html > /tmp/staged-distribution-header-nav.html
          grep -Fq 'href="/distribution/"' /tmp/staged-distribution-header-nav.html
          grep -Fq 'data-mega-trigger="distribution"' /tmp/staged-distribution-header-nav.html
          grep -Fq 'data-mega-panel="distribution"' _site/index.html
          grep -Fq 'href="https://portal.novapharmhealthcare.com/"' /tmp/staged-distribution-header-nav.html
          # Verify the approved About story, asset fallbacks and responsive stylesheet
          # in the exact staged artifact before touching the active public website.
          grep -Fq 'Getting medicine to where it matters.' _site/about/index.html
          grep -Fq 'Specialist medicines' _site/about/index.html
          grep -Fq 'Resilient supply' _site/about/index.html
          grep -Fq 'Decision systems' _site/about/index.html
          grep -Fq '/assets/css/about-editorial.css' _site/about/index.html
          grep -Fq '/assets/media/about/novapharm-warehouse-original.jpg' _site/about/index.html
          test -s _site/assets/css/about-editorial.css
          test -s _site/assets/media/about/novapharm-warehouse-original.jpg
          test -s _site/assets/media/about/novapharm-warehouse.avif
          # Preserve the approved Capabilities story and raster artwork in the exact staged release.
          grep -Fq 'data-capabilities-editorial="approved-2026-11"' _site/capabilities/index.html
          grep -Fq 'class="npd-hero ncap-hero"' _site/capabilities/index.html
          grep -Fq 'class="ncap-vial-illustration" src="data:image/webp;base64,' _site/capabilities/index.html
          grep -Fq 'class="ncap-vial-illustration" src="data:image/webp;base64,UklGRrQKA' _site/capabilities/index.html
          grep -Fq 'class="ncap-earth-illustration" src="data:image/webp;base64,' _site/capabilities/index.html
          grep -Fq 'class="ncap-earth-illustration" src="data:image/webp;base64,UklGRooEA' _site/capabilities/index.html
          grep -Fq 'Start with one decision.' _site/capabilities/index.html
          capabilities_css_sha256="$(sha256sum _site/assets/css/capabilities-editorial.css)"
          capabilities_css_sha256="${capabilities_css_sha256%% *}"
          grep -Fq "href=\"/assets/css/capabilities-editorial.css?v=20261111-capabilities-approved-photo-v5&amp;sha256=${capabilities_css_sha256}\"" _site/capabilities/index.html
          test -s _site/assets/css/capabilities-editorial.css
          grep -Fq '@media print' _site/assets/css/capabilities-editorial.css
          # Exact approved homepage image and styling must be in the artifact.
          grep -Fq 'class="npd-apple-hero nph-earth-hero"' _site/index.html
          grep -Fq 'src="/assets/media/home/earth-reference-1400.jpg"' _site/index.html
          test -s _site/assets/media/home/earth-reference-1400.jpg
          grep -Fq 'nph-earth-hero' _site/assets/css/novapharm.bundle.css
          # The approved Oncology design and its exact mobile CSS are deployment prerequisites.
          node scripts/test-oncology-content.mjs
          test -s _site/assets/css/oncology-hope-v2.css
          oncology_css_sha256="$(sha256sum _site/assets/css/oncology-hope-v2.css)"
          oncology_css_sha256="${oncology_css_sha256%% *}"
          grep -Fq "href=\"/assets/css/oncology-hope-v2.css?v=20261113-hope-responsive-v7&amp;sha256=${oncology_css_sha256}\"" _site/oncology/index.html
          grep -Fq 'A Hope for<br>Tomorrow.' _site/oncology/index.html
          ! grep -Fq 'Illustrative creative image. No patient, treatment result or NovaPharm facility is depicted.' _site/oncology/index.html
          grep -Fq 'grid-template-columns:repeat(3,minmax(220px,1fr))' _site/assets/css/oncology-hope-v2.css
          grep -Fq 'aspect-ratio:890/550' _site/assets/css/oncology-hope-v2.css
          grep -Fq 'transparent 8%,rgba(0,0,0,.5) 10%,#000 14%' _site/assets/css/oncology-hope-v2.css
          grep -Fq 'padding:22px 0 54px' _site/assets/css/oncology-hope-v2.css
          node scripts/verify-nutraxin-merchant-live.mjs --local
          test -s _site/shopping/nutraxin-uk.tsv
          cmp _site/shopping/nutraxin-uk.tsv shopping/nutraxin-uk.tsv
          jq -e '.enabled == true and .pool_id == "eu-north-1_SLNUKZypt" and .account_url == "https://novapharmhealthcare.com/products/nutraxin/account/" and .api_origin == "https://7cs8kxkj5d.execute-api.eu-north-1.amazonaws.com"' _site/assets/data/nutraxin-consumer-auth.json
          test -s _site/products/nutraxin/account/index.html
          test -s _site/assets/js/nutraxin-consumer-account.js
          test -s _site/assets/css/nutraxin-consumer-account.css
          grep -Fq 'data-nx-account-signup' _site/products/nutraxin/account/index.html
          grep -Fq 'data-nx-account-orders' _site/products/nutraxin/account/index.html
          grep -Fq 'data-nx-account-recover' _site/products/nutraxin/account/index.html
          grep -Fq 'href="/account-application/"' _site/products/nutraxin/account/index.html
          grep -Fq '/forgotPassword' _site/assets/js/nutraxin-consumer-account.js
          node --test scripts/test-esco-catalogue.mjs
          grep -Fq 'data-esco-catalogue' _site/products/esco/index.html
          grep -Fq 'data-esco-quote-items' _site/products/esco/index.html
          grep -Fq 'data-esco-bag-items' _site/products/esco/bag/index.html
          grep -Fq 'data-esco-card-checkout disabled' _site/products/esco/bag/index.html
          grep -Fq 'Base price £' _site/products/esco/index.html
          grep -Fq 'Ex VAT · delivery confirmed before acceptance' _site/products/esco/index.html
          test -s _site/assets/data/esco-uk-guide-prices.json
          test -s _site/assets/data/esco-checkout-config.json
          grep -Fq 'data-esco-payment-terms' _site/products/esco/bag/index.html
          test -s _site/assets/js/esco-bag.js
          test -s _site/assets/media/esco/previews/esco-cat-0373.svg
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('_site/assets/data/esco-uk-guide-prices.json','utf8'));if(x.entriesTotal!==373||x.checkoutEnabled||x.paymentCollectionEnabled||!x.requestQuoteOnly||Object.keys(x.guidePrices).length!==373||Object.keys(x.visualPreviews).length!==373)process.exit(1)"

          # The Products hero is one uninterrupted, three-family photographic story.
          grep -Fq 'Different products.' _site/products/index.html
          grep -Fq 'np-products-stage-esco' _site/products/index.html
          grep -Fq 'np-products-stage-pharma' _site/products/index.html
          grep -Fq 'href="/products/nutraxin/"' _site/products/index.html
          grep -Fq 'href="/products/esco/"' _site/products/index.html
          grep -Fq 'href="/products/strategic-portfolio/"' _site/products/index.html
          products_css_sha256="$(sha256sum _site/assets/css/products-editorial.css)"
          products_css_sha256="${products_css_sha256%% *}"
          grep -Fq "href=\"/assets/css/products-editorial.css?v=20261111-products-layout-v4&amp;sha256=${products_css_sha256}\"" _site/products/index.html
          test -s _site/assets/css/products-editorial.css
          grep -Fq 'PRODUCTS UNIFIED HERO 2026-11-10' _site/assets/css/products-editorial.css
          grep -Fq 'ESCO Anand' _site/products/index.html
          test -s _site/assets/css/esco-catalogue.css
          test -s _site/assets/js/esco-catalogue.js
          grep -Fq 'ESCO Anand UK quotation request' _site/assets/js/contact-production.js
          test "$(tr -d '\r\n' < _site/da125ceca8032e01fc98782c388f894f.txt)" = 'da125ceca8032e01fc98782c388f894f'
          grep -Fq 'Simple from start to finish.' _site/products/nutraxin/bag/index.html
          grep -Fq 'Guest checkout available' _site/products/nutraxin/bag/index.html
          grep -Fq 'Nutraxin UK Supplements | Explore 19 Products | NovaPharm' _site/products/nutraxin/index.html
          grep -Fq 'name="novapharm-ga4-id" content="G-897L1VS8BX"' _site/products/nutraxin/index.html
          grep -Fq '/assets/js/consent-analytics.js' _site/products/nutraxin/index.html
          ! grep -Fq 'www.googletagmanager.com' _site/products/nutraxin/index.html
          ! grep -Fq 'novapharm-ga4-id' _site/contact/index.html
          ! grep -Fq 'novapharm-ga4-id' _site/portal/index.html
          ! grep -Fq 'novapharm-ga4-id' _site/legal/cookies/index.html
          grep -Fq 'Google Analytics 4' _site/legal/cookies/index.html
          test -s _site/assets/js/consent-analytics.js
          grep -Fq 'class="nx-purchase-progress"' _site/products/nutraxin/bag/index.html
          node scripts/check-links.mjs _site
          test -s _site/assets/js/contact-production.js
          test -s _site/assets/js/account-request-production.js
          test -s _site/assets/css/account-request.css
      - name: Verify production contact API without sending notifications
        env:
          CONTACT_ORIGIN: ${{ github.event_name == 'push' && 'https://h4dc1e4u57.execute-api.eu-north-1.amazonaws.com' || inputs.contact_api_origin }}
        run: |
          set -euo pipefail
          # Explicit owner instruction: NO EMAIL to anyone, including SNS
          # synthetic production receipts. Never submit an accepted enquiry
          # from this publisher. Test GET health and rejected anonymous POST only.
          node --test scripts/test-no-email-release-guard.mjs
          [[ "$CONTACT_ORIGIN" =~ ^https://[a-z0-9]+\.execute-api\.eu-north-1\.amazonaws\.com$ ]] || exit 1
          curl --fail --silent --show-error --max-time 15 \
            -H "Cache-Control: no-cache" \
            "$CONTACT_ORIGIN/health" -o /tmp/novapharm-contact-health.json
          jq -e '.service == "novapharm-contact-intake" and .ready == true and .environment == "production"' /tmp/novapharm-contact-health.json
          # This request is rejected before storage/SNS; it cannot be a valid enquiry.
          rejected=$(curl --silent --show-error --max-time 15 -o /tmp/novapharm-anon.json -w '%{http_code}' \
            -X POST "$CONTACT_ORIGIN/contact" \
            -H 'Content-Type: application/json' -d '{}' )
          test "$rejected" = "403"
          echo 'AWS contact health and anonymous rejection verified without email or persisted enquiry.'
      - name: Activate contact on staged Pages artifact only
        env:
          NOVAPHARM_CONTACT_RELEASE_ACCEPTED: "yes"
          NOVAPHARM_CONTACT_ARTIFACT_ROOT: "_site"
          NOVAPHARM_CONTACT_API_ORIGIN: ${{ github.event_name == 'push' && 'https://h4dc1e4u57.execute-api.eu-north-1.amazonaws.com' || inputs.contact_api_origin }}
        run: |
          node scripts/activate-contact-intake.mjs
          grep -Fq 'data-live-b2b-enquiry-form' _site/contact/index.html
          grep -Fq 'data-live-contact-status' _site/contact/index.html
          grep -Fq 'name="privacyAcknowledgement"' _site/contact/index.html
          grep -Fq 'name="safetyConfirmation"' _site/contact/index.html
          grep -Fq 'src="/assets/js/contact-production.js"' _site/contact/index.html
          grep -Fq 'Secure online enquiry storage' _site/legal/privacy/index.html
          grep -Fq 'data-live-account-request-form' _site/account-application/index.html
          grep -Fq 'data-account-request-status' _site/account-application/index.html
          grep -Fq "data-api-origin=\"$NOVAPHARM_CONTACT_API_ORIGIN\"" _site/account-application/index.html
          grep -Fq 'src="/assets/js/account-request-production.js"' _site/account-application/index.html
          grep -Fq 'name="privacyAcknowledgement"' _site/account-application/index.html
          grep -Fq 'name="safetyConfirmation"' _site/account-application/index.html
          ! grep -Fq 'type="password"' _site/account-application/index.html
          ! grep -Fq 'type="file"' _site/account-application/index.html
          ! grep -Fq 'data-email-enquiry-form' _site/contact/index.html
          ! grep -Fq 'This public information release does not collect or transmit enquiry details' _site/contact/index.html
          grep -Fq 'This public website never asks for a portal username, password or confidential company record' _site/portal/index.html
          ! grep -Fq 'type="password"' _site/portal/index.html
      - name: Bind staged shared stylesheet to deployment receipt
        id: public_css
        run: |
          set -euo pipefail
          test -s _site/assets/css/novapharm.bundle.css
          bundle_css_sha256="$(sha256sum _site/assets/css/novapharm.bundle.css)"
          bundle_css_sha256="${bundle_css_sha256%% *}"
          [[ "$bundle_css_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          for page in index.html capabilities/index.html oncology/index.html products/index.html; do
            test -s "_site/$page"
            grep -Fq "href=\"/assets/css/novapharm.bundle.css?v=20261111-forensic-design-v3&amp;sha256=${bundle_css_sha256}\"" "_site/$page"
          done
          printf 'bundle_css_sha256=%s\n' "$bundle_css_sha256" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload exact verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.ship.outputs.page_url }}
    steps:
      - name: Check out independently verified release policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
          persist-credentials: false
      - name: Prove forward-only release ancestry and deploy evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
          EXPECTED_BUNDLE_CSS_SHA256: ${{ needs.build-and-verify.outputs.bundle_css_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BUNDLE_CSS_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          node scripts/check-pages-monotonic-release.mjs
      - name: Publish verified Pages artifact
        id: ship
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check out verified source for Merchant Center release vetting
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
          persist-credentials: false
      - name: Verify 19 live Product Offers and Google Shopping TSV
        env:
