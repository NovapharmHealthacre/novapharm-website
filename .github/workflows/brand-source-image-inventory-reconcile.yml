name: Audit three-brand image inventory (artifact-only draft review)

on:
  push:
    branches:
      - brand/sovereign-crimson-garnet-20261122
    paths:
      - '.github/workflows/brand-source-image-inventory-reconcile.yml'
      - 'assets/brand/**'
      - 'scripts/test-official-brand-triad.mjs'
      - 'apps/corporate/test/sitewide-design-system.test.ts'

permissions:
  contents: read

concurrency:
  group: brand-source-image-inventory-${{ github.ref }}
  cancel-in-progress: false

# The three-brand raster workflow is the only writer of image assets and
# audit/generated/image-inventory.json on this branch. Never race two
# independent source-derivation jobs for the same protected evidence file.
jobs:
  generate:
    if: github.repository == 'NovapharmHealthacre/novapharm-website' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Derive image inventory from the exact tracked source tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          mkdir -p candidate
          cp audit/generated/image-inventory.json candidate/image-inventory.json
          printf '%s\n' "$GITHUB_SHA" > candidate/source-sha.txt
          sha256sum candidate/image-inventory.json > candidate/sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brand-source-image-inventory-candidate
          path: candidate/
          retention-days: 7
