name: Unified portal production cutover preflight

on:
  pull_request:
    paths:
      - "src/core/unified-portal-cutover-preflight.mjs"
      - "scripts/test-unified-portal-cutover-preflight.mjs"
      - "docs/portal/UNIFIED_PORTAL_CUTOVER_PREFLIGHT_20261114.md"
      - ".github/workflows/unified-portal-cutover-preflight.yml"
  push:
    branches: [main]
    paths:
      - "src/core/unified-portal-cutover-preflight.mjs"
      - "scripts/test-unified-portal-cutover-preflight.mjs"
      - ".github/workflows/unified-portal-cutover-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-unverified-domain-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Validate evidence contract and test syntax
        run: |
          node --check src/core/unified-portal-cutover-preflight.mjs
          node --check scripts/test-unified-portal-cutover-preflight.mjs
      - name: Reject missing MFA, storage, rights, routing, rollback and owner approval evidence
        run: node --test scripts/test-unified-portal-cutover-preflight.mjs
