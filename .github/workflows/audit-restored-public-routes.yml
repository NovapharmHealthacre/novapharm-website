name: Audit all live NovaPharm public routes

on:
  pull_request:
    paths:
      - scripts/audit-restored-public-routes.mjs
      - scripts/hig-public-route-signals.mjs
      - scripts/test-hig-public-route-signals.mjs
      - scripts/reconcile-live-public-routes.mjs
      - scripts/test-reconcile-live-public-routes.mjs
      - apps/corporate/data/nutraxin-product-register.json
      - sitemap.xml
      - .github/workflows/audit-restored-public-routes.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

jobs:
  audit-public-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify read-only HIG source-screening parser
        run: |
          node --check scripts/audit-restored-public-routes.mjs
          node --test scripts/test-hig-public-route-signals.mjs scripts/test-reconcile-live-public-routes.mjs
      - name: Audit every public route against live custom domain
        run: node scripts/audit-restored-public-routes.mjs
      - name: Preserve report even when production drift is detected
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-live-route-audit
          path: artifacts/site-restoration/live-route-audit.json
          if-no-files-found: warn
          retention-days: 14
