name: Live Capabilities Chromium and WebKit acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/capabilities-live-rendered-acceptance.yml'
      - 'scripts/test-live-capabilities-browser.mjs'
      - 'apps/corporate/**'
  workflow_run:
    workflows: ["Publish verified AWS-backed contact form"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-live-capabilities:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main acceptance script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned browser dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Inspect real customer-domain design with Chromium and WebKit
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          CAPABILITIES_LIVE_ORIGIN: https://novapharmhealthcare.com
        run: node scripts/test-live-capabilities-browser.mjs
      - name: Preserve actual rendered evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-capabilities-${{ github.run_id }}
          path: artifacts/capabilities-live-browser
          if-no-files-found: warn
          retention-days: 14
