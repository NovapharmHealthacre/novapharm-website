name: Live Capabilities Chromium and WebKit acceptance

on:
  workflow_run:
    workflows: ["Publish verified AWS-backed contact form"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-live-capabilities:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main acceptance script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned browser dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Inspect real customer-domain design with Chromium and WebKit
        env:
          CAPABILITIES_LIVE_ORIGIN: https://novapharmhealthcare.com
        run: node scripts/test-live-capabilities-browser.mjs
      - name: Preserve actual rendered evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-capabilities-${{ github.run_id }}
          path: artifacts/capabilities-live-browser
          if-no-files-found: warn
          retention-days: 14
