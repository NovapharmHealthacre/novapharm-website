name: Apple HIG Portal Actions Feedback Contract
on:
  pull_request:
    paths:
      - "apps/portal/components/dashboard.tsx"
      - "apps/portal/test/portal-action-feedback.test.ts"
      - ".github/workflows/apple-hig-portal-actions-feedback.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal-action-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Validate submitted-form preservation
        run: npx tsx --test apps/portal/test/portal-action-feedback.test.ts
      - name: Typecheck protected portal
        run: npm run typecheck -w @novapharm/portal
