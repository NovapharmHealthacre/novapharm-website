name: Intelligence private Atlas rights reader contract
on:
  pull_request:
    paths:
      - 'src/data/atlas-private-medicine-rights.mjs'
      - 'scripts/test-atlas-private-medicine-rights.mjs'
      - '.github/workflows/intelligence-private-atlas-rights.yml'
      - 'docs/intelligence/ATLAS_PRIVATE_MEDICINE_RIGHTS_READ_20261113.md'
  push:
    branches: [main]
    paths:
      - 'src/data/atlas-private-medicine-rights.mjs'
      - 'scripts/test-atlas-private-medicine-rights.mjs'
      - '.github/workflows/intelligence-private-atlas-rights.yml'
permissions:
  contents: read
jobs:
  verify-read-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node --test scripts/test-atlas-private-medicine-rights.mjs
