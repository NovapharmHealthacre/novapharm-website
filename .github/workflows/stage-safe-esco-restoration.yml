name: Stage ESCO catalogue safely on nonlive branch

on:
  pull_request:
    paths:
      - scripts/stage-safe-esco-restoration.py
      - .github/workflows/stage-safe-esco-restoration.yml
  push:
    branches: [main]
    paths:
      - scripts/stage-safe-esco-restoration.py
      - .github/workflows/stage-safe-esco-restoration.yml

permissions:
  contents: read

concurrency:
  group: novapharm-scoped-esco-staging
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Generate reviewed public-only website and ESCO catalogue
        run: |
          npm ci --ignore-scripts
          npm run build:public-only
          node scripts/stage-pages-artifact.mjs _site
          node scripts/check-links.mjs _site
      - name: Checkout current live Pages separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: published
          persist-credentials: false
      - name: Stage ESCO namespace and preserve protected site byte hashes
        run: python3 scripts/stage-safe-esco-restoration.py
      - name: Preserve sanitized candidate manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esco-scoped-restoration-${{ github.sha }}
          path: artifacts/esco-restoration/manifest.json
          retention-days: 14
          if-no-files-found: warn
  stage-esco:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Generate reviewed public-only website and ESCO catalogue
        run: |
          npm ci --ignore-scripts
          npm run build:public-only
          node scripts/stage-pages-artifact.mjs _site
          node scripts/check-links.mjs _site
      - name: Checkout current live Pages separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: published
          persist-credentials: ${{ github.event_name == 'push' }}
      - name: Stage ESCO namespace and preserve protected site byte hashes
        run: python3 scripts/stage-safe-esco-restoration.py
      - name: Preserve sanitized candidate manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esco-scoped-restoration-${{ github.sha }}
          path: artifacts/esco-restoration/manifest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Push NON-LIVE candidate branch only after main merge
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          name="release/staged-esco-$(git rev-parse --short=12 HEAD)-$GITHUB_RUN_ID"
          test "$(git -C published branch --show-current)" = "gh-pages"
          git -C published switch -c "$name"
          git -C published config user.name 'NovaPharm ESCO Restoration Staging'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add --all
          git -C published diff --cached --name-only > /tmp/esco-changed
          test -s /tmp/esco-changed
          while IFS= read -r f; do
            case "$f" in
              products/esco/*|assets/media/esco/*|assets/css/esco-*|assets/js/esco-*|assets/data/esco-catalogue.json|assets/data/esco-model-photo-map.json|assets/data/esco-checkout-config.json|assets/data/esco-uk-guide-prices.json) ;;
              *) echo "::error::Unapproved ESCO candidate change: $f"; exit 1 ;;
            esac
          done < /tmp/esco-changed
          git -C published commit -m 'candidate: scoped 373-product ESCO restoration, no customer or homepage changes'
          git -C published push origin "HEAD:refs/heads/$name"
          echo "STAGED_ONLY $name. Live gh-pages unchanged."
