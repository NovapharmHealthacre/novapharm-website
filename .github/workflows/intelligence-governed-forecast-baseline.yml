name: Intelligence governed forecasting baseline

on:
  pull_request:
    paths:
      - 'src/core/medicine-forecast-baseline.mjs'
      - 'scripts/test-medicine-forecast-baseline.mjs'
      - 'src/core/medicine-forecast-interval-candidate.mjs'
      - 'scripts/test-medicine-forecast-interval-candidate.mjs'
      - '.github/workflows/intelligence-governed-forecast-baseline.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/medicine-forecast-baseline.mjs'
      - 'scripts/test-medicine-forecast-baseline.mjs'
      - '.github/workflows/intelligence-governed-forecast-baseline.yml'

permissions:
  contents: read

jobs:
  forecast-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Rights-gated, deterministic, non-production forecast contract
        run: node --test scripts/test-medicine-forecast-baseline.mjs scripts/test-medicine-forecast-interval-candidate.mjs
