name: Verify 392-product Commerce and tracker on the public domain

on:
  pull_request:
    paths:
      - scripts/verify-restored-commerce-392-live.mjs
      - .github/workflows/verify-restored-commerce-392-live.yml
  workflow_dispatch:
  schedule:
    - cron: "53 4 * * 3"

permissions:
  contents: read

jobs:
  verify-actual-live-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Independently verify live Commerce HTML, 392 catalogue records, status boundary and assets
        run: node scripts/verify-restored-commerce-392-live.mjs
      - name: Preserve sanitized production verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-live-commerce-392-evidence
          path: artifacts/site-restoration/live-commerce-392.json
          if-no-files-found: warn
          retention-days: 14
