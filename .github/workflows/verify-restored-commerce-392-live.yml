name: Verify 392-product Commerce and tracker on the public domain

on:
  pull_request:
    paths:
      - scripts/verify-restored-commerce-392-live.mjs
      - scripts/lib/verified-commerce-sitemap.mjs
      - scripts/test-verified-commerce-sitemap.mjs
      - assets/data/nutraxin-uk-category-intents.json
      - src/content/our-story.mjs
      - seo/generated/page-metadata-register.json
      - sitemap.xml
      - .github/workflows/verify-restored-commerce-392-live.yml
  workflow_dispatch:
  # Successful Pages deployments trigger a fresh read-only custom-domain check.
  deployment_status:
  # Fallback for GitHub's branch-published Pages workflow, which may not emit
  # a deployment_status event to this repository's Actions workflows.
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  schedule:
    - cron: "53 4 * * *"

permissions:
  contents: read

jobs:
  verify-actual-live-commerce:
    # Never treat a failed/pending or unrelated deployment as a public Pages release.
    if: ${{ (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'gh-pages' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prove exact public sitemap canonical route set
        run: node --test scripts/test-verified-commerce-sitemap.mjs
      - name: Independently verify live Commerce HTML, 392 catalogue records, status boundary and assets
        run: node scripts/verify-restored-commerce-392-live.mjs
      - name: Preserve sanitized production verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-live-commerce-392-evidence
          path: artifacts/site-restoration/live-commerce-392.json
          if-no-files-found: warn
          retention-days: 14
