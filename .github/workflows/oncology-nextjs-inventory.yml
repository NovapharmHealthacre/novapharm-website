name: Reconcile Oncology Next.js image provenance (one-time candidate)
on:
  push:
    branches: [codex/oncology-nextjs-live-20261107]
    paths: [.github/workflows/oncology-nextjs-inventory.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'NovapharmHealthacre/novapharm-website'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate and verify complete governed media inventory
        run: |
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          git diff --stat -- audit/generated/image-inventory.json
      - name: Apply inventory only to the isolated exact-head PR branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/oncology-nextjs-live-20261107'
          remote_head="$(git ls-remote origin refs/heads/codex/oncology-nextjs-live-20261107 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git add audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo 'Authoritative inventory unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(oncology): refresh governed Next.js media inventory'
          git push origin HEAD:refs/heads/codex/oncology-nextjs-live-20261107
