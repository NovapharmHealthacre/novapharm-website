name: PANDORA evidence-graph staging authority and audit

on:
  pull_request:
    paths:
      - 'src/data/atlas-graph-governance-staging.mjs'
      - 'src/core/intelligence-evidence-graph.mjs'
      - 'scripts/test-atlas-graph-governance-staging.mjs'
      - 'scripts/test-intelligence-evidence-graph.mjs'
      - '.github/workflows/intelligence-graph-governance-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-authority-fails-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Test rights, session revision and majority-write audit contract
        run: |
          node --check src/data/atlas-graph-governance-staging.mjs
          node --check src/core/intelligence-evidence-graph.mjs
          node --test scripts/test-intelligence-evidence-graph.mjs scripts/test-atlas-graph-governance-staging.mjs
