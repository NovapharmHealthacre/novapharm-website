name: Intelligence server-only subscription Checkout contract

on:
  pull_request:
    paths:
      - 'src/core/intelligence-subscription-checkout.mjs'
      - 'scripts/test-intelligence-subscription-checkout.mjs'
      - '.github/workflows/intelligence-subscription-checkout.yml'

permissions:
  contents: read

jobs:
  verify-subscription-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify secure subscription Checkout transport contract
        run: node --test scripts/test-intelligence-live-stripe-catalog.mjs scripts/test-intelligence-subscription-checkout.mjs
      - name: Preserve release contract
        run: npm run intelligence:requirements:validate
