name: Apple HIG Menus and Actions Web Contract

on:
  pull_request:
    paths:
      - "packages/design-system/src/menu-actions.tsx"
      - "packages/design-system/src/menu-actions-policy.ts"
      - "apps/portal/components/wms-recorded-evidence-studio.tsx"
      - "apps/corporate/components/mobile-navigation.tsx"
      - "apps/portal/app/employee-distribution.css"
      - "scripts/test-apple-hig-menu-policy.mjs"
      - ".github/pull_request_template.md"
      - "packages/design-system/src/index.ts"
      - "packages/design-system/src/styles.ts"
      - "packages/design-system/test/menu-actions.test.tsx"
      - "manifest.webmanifest"
      - "apps/corporate/app/manifest.ts"
      - "scripts/test-apple-hig-menu-shortcuts.mjs"
      - "docs/design/apple-hig-menus-actions-20261116.md"
      - ".github/workflows/apple-hig-menus-actions.yml"
  push:
    branches: [main]
    paths:
      - "packages/design-system/src/menu-actions.tsx"
      - "packages/design-system/src/menu-actions-policy.ts"
      - "apps/portal/components/wms-recorded-evidence-studio.tsx"
      - "apps/corporate/components/mobile-navigation.tsx"
      - "apps/portal/app/employee-distribution.css"
      - "scripts/test-apple-hig-menu-policy.mjs"
      - ".github/pull_request_template.md"
      - "packages/design-system/src/index.ts"
      - "packages/design-system/src/styles.ts"
      - "packages/design-system/test/menu-actions.test.tsx"
      - "manifest.webmanifest"
      - "apps/corporate/app/manifest.ts"
      - "scripts/test-apple-hig-menu-shortcuts.mjs"
      - ".github/workflows/apple-hig-menus-actions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menus-and-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify public PWA shortcuts and source parity
        run: node --test scripts/test-apple-hig-menu-shortcuts.mjs scripts/test-apple-hig-menu-policy.mjs
      - name: Typecheck shared HIG controls
        run: npm run typecheck -w @novapharm/design-system
      - name: Test shared accessible menu and action controls
        run: npm run test -w @novapharm/design-system
