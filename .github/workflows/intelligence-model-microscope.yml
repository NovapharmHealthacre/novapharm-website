name: Nova Model Microscope interpretability contracts
on:
  pull_request:
    paths:
      - "src/core/ai/model-microscope.mjs"
      - "src/core/ai/model-microscope-synthetic-reference.mjs"
      - "scripts/test-nova-model-microscope-synthetic-reference.mjs"
      - "src/core/ai/model-microscope-signed-evidence.mjs"
      - "scripts/test-nova-model-microscope-signed-evidence.mjs"
      - "docs/intelligence/model-microscope-inspection-v1.schema.json"
      - "docs/ai-use-case-register.json"
      - "docs/ai-risk-register.md"
      - "docs/ai-model-licence-review.md"
      - "docs/ai-system-card.md"
      - "docs/ai-model-register.json"
      - "scripts/test-nova-model-microscope.mjs"
      - "apps/portal/data/nova-ml-modules.ts"
      - "apps/portal/components/nova-ml-workspaces.tsx"
      - "apps/portal/test/routes.test.ts"
      - "scripts/test-nova-ml-apple-adaptation.mjs"
      - "scripts/test-nova-ml-private-ingress.mjs"
      - "native/novapharm-intelligence-mobile/tests/mobile-contract.test.mjs"
      - "native/novapharm-intelligence-mobile/App.tsx"
      - "docs/intelligence/model-microscope-research-to-product-20261118.md"
      - ".github/workflows/intelligence-model-microscope.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-inspection-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node --check src/core/ai/model-microscope.mjs
      - run: node --check src/core/ai/model-microscope-signed-evidence.mjs
      - run: node --test scripts/test-nova-model-microscope.mjs scripts/test-nova-model-microscope-signed-evidence.mjs
      - run: node --check src/core/ai/model-microscope-synthetic-reference.mjs
      - run: node --test scripts/test-nova-model-microscope-synthetic-reference.mjs
      - run: node --test native/novapharm-intelligence-mobile/tests/mobile-contract.test.mjs
      - run: node --test scripts/test-nova-ml-apple-adaptation.mjs scripts/test-nova-ml-private-ingress.mjs
