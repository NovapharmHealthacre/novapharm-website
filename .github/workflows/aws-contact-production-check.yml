name: Production contact intake security contract

on:
  push:
    branches: [codex/contact-real-intake-sns-20261107]
  pull_request:
    paths:
      - 'infra/aws/contact-production/**'
      - 'infra/aws/contact-production.json'
      - 'scripts/aws/contact-production.test.mjs'
      - 'scripts/activate-contact-intake.mjs'
      - 'scripts/contact-activation.test.mjs'
      - 'assets/js/contact-production.js'
      - 'scripts/build-site.mjs'
      - '.github/workflows/aws-contact-production-check.yml'
      - '.github/workflows/dispatch-approved-aws-contact-release.yml'
      - '.github/workflows/pages-live-publish.yml'
      - '.github/workflows/pages-public-release-recovery.yml'
      - '.github/workflows/release-contact-only.yml'
      - 'scripts/aws/contact-release-routing.test.mjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify Lambda JavaScript and replay production security contracts
        run: |
          node --check infra/aws/contact-production/index.js
          node --check assets/js/contact-production.js
          node --test scripts/aws/contact-production.test.mjs scripts/contact-activation.test.mjs scripts/aws/contact-release-routing.test.mjs
