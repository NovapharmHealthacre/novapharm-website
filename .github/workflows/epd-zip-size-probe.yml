name: NHSBSA EPD compressed source size preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/data/probe-epd-zip-size.mjs'
      - '.github/workflows/epd-zip-size-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Default does not contact provider
        run: node scripts/data/probe-epd-zip-size.mjs
      - name: Official HEAD check, no download
        run: node scripts/data/probe-epd-zip-size.mjs --execute
