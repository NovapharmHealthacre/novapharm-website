name: Apple HIG image presentation contract

on:
  pull_request:
    paths:
      - 'assets/css/sitewide-layout-integrity.css'
      - 'assets/css/products-editorial.css'
      - 'assets/css/novapharm.bundle.css'
      - 'scripts/test-apple-image-guidelines.mjs'
      - 'index.html'
      - 'about/**'
      - 'capabilities/**'
      - 'leadership/**'
      - 'oncology/**'
      - 'products/**'
      - '.github/workflows/apple-image-guidelines.yml'
  push:
    branches: [main]
    paths:
      - 'assets/css/sitewide-layout-integrity.css'
      - 'assets/css/products-editorial.css'
      - 'assets/css/novapharm.bundle.css'
      - 'scripts/test-apple-image-guidelines.mjs'
      - 'index.html'
      - 'about/**'
      - 'capabilities/**'
      - 'leadership/**'
      - 'oncology/**'
      - 'products/**'
      - '.github/workflows/apple-image-guidelines.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-layout-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify image layout, intrinsic proportions and product containment
        run: node --test scripts/test-apple-image-guidelines.mjs
