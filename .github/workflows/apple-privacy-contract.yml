name: Apple Privacy Web Contract
on:
  pull_request:
    paths:
      - 'assets/js/cookie-consent.js'
      - 'assets/js/consent-analytics.js'
      - 'legal/privacy/index.html'
      - 'legal/cookies/index.html'
      - 'apps/corporate/data/pages.ts'
      - 'apps/corporate/components/page-renderer.tsx'
      - 'apps/corporate/components/cookie-controls.tsx'
      - 'apps/corporate/app/compact-fixes.css'
      - 'compliance/privacy-data-map.md'
      - 'compliance/cookie-register.md'
      - 'docs/design/apple-privacy-web-adaptation.md'
      - 'scripts/test-apple-privacy-contract.mjs'
      - '.github/workflows/apple-privacy-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Privacy notice and consent adapter contract
        run: node --test scripts/test-apple-privacy-contract.mjs
      - name: Static consent regressions
        run: node scripts/test-cookie-consent.mjs && node scripts/test-consent-analytics.mjs
