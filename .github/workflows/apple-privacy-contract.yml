name: Apple Privacy Web Contract
on:
  pull_request:
    paths:
      - 'assets/js/cookie-consent.js'
      - 'assets/js/consent-analytics.js'
      - 'assets/css/corporate-product-discipline.css'
      - 'assets/css/novapharm.bundle.css'
      - 'scripts/test-apple-privacy-editorial.mjs'
      - 'scripts/build-public-pages.mjs'
      - 'legal/privacy/index.html'
      - 'legal/cookies/index.html'
      - 'apps/corporate/data/pages.ts'
      - 'apps/corporate/components/page-renderer.tsx'
      - 'apps/corporate/components/cookie-controls.tsx'
      - 'apps/corporate/app/compact-fixes.css'
      - 'apps/portal/components/login-panel.tsx'
      - 'apps/portal/app/globals.css'
      - 'apps/technology/app/privacy/page.tsx'
      - 'apps/founder/content/pages/privacy.md'
      - 'apps/status/app/page.tsx'
      - 'apps/status/app/globals.css'
      - 'apps/corporate/test/browser-acceptance.ts'
      - 'compliance/privacy-data-map.md'
      - 'compliance/cookie-register.md'
      - 'docs/design/apple-privacy-web-adaptation.md'
      - 'scripts/test-apple-privacy-contract.mjs'
      - '.github/workflows/apple-privacy-contract.yml'
      - '.github/workflows/publish-aws-contact-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Privacy notice and consent adapter contract
        run: node --test scripts/test-apple-privacy-contract.mjs
      - name: Static consent regressions
        run: node scripts/test-cookie-consent.mjs && node scripts/test-consent-analytics.mjs
      - name: Privacy overview, keyboard-readable structure and CSS parity
        run: node --test scripts/test-apple-privacy-editorial.mjs
