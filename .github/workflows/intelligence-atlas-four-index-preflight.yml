name: Intelligence Atlas four-index read-only preflight

on:
  pull_request:
    paths:
      - 'src/data/atlas-four-index-preflight.mjs'
      - 'src/data/atlas-private-medicine-rights-index.mjs'
      - 'src/data/atlas-medicine-g2-atomic-store.mjs'
      - 'scripts/test-atlas-four-index-preflight.mjs'
      - '.github/workflows/intelligence-atlas-four-index-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/atlas-four-index-preflight.mjs'
      - 'src/data/atlas-private-medicine-rights-index.mjs'
      - 'src/data/atlas-medicine-g2-atomic-store.mjs'
      - 'scripts/test-atlas-four-index-preflight.mjs'
      - '.github/workflows/intelligence-atlas-four-index-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-four-index-readonly-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify dry-run source and index-migration contract
        run: |
          node --check src/data/atlas-four-index-preflight.mjs
          node --test \
            scripts/test-atlas-four-index-preflight.mjs \
            scripts/test-atlas-g2-unique-index-migration.mjs \
            scripts/test-atlas-private-medicine-rights-index.mjs
      - name: Record no-production-write boundary
        run: |
          echo "Four-index contract tests run against injected in-memory fixtures only."
          echo "No production secrets, MongoDB connections, index writes, data grants or customer-access changes."
