name: Intelligence global intake integration and rights contracts

on:
  pull_request:
    paths:
      - 'src/core/intelligence-global-intake-workflow.mjs'
      - 'src/core/intelligence-global-intake-quality.mjs'
      - 'src/core/intelligence-global-nhsbsa-bridge.mjs'
      - 'src/core/intelligence-global-source-gateway.mjs'
      - 'src/core/intelligence-global-evidence-contract.mjs'
      - 'src/core/intelligence-source-snapshot-quarantine.mjs'
      - 'scripts/test-intelligence-global-intake-workflow.mjs'
      - 'scripts/test-intelligence-global-intake-quality.mjs'
      - 'scripts/test-intelligence-global-nhsbsa-bridge.mjs'
      - 'scripts/test-intelligence-source-snapshot-quarantine.mjs'
      - 'scripts/test-intelligence-source-snapshot-schema.mjs'
      - 'docs/intelligence/source-snapshot-quarantine-v1.schema.json'
      - '.github/workflows/intelligence-global-intake-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-intake:
    name: Fail-closed global source intake integration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Check node syntax
        run: |
          node --check src/core/intelligence-global-intake-workflow.mjs
          node --check src/core/intelligence-global-intake-quality.mjs
          node --check src/core/intelligence-global-nhsbsa-bridge.mjs
          node --check src/core/intelligence-source-snapshot-quarantine.mjs
          node --check scripts/test-intelligence-global-intake-workflow.mjs
          node --check scripts/test-intelligence-global-intake-quality.mjs
          node --check scripts/test-intelligence-global-nhsbsa-bridge.mjs
      - name: Validate integration and upstream standalone contracts
        run: |
          node --test scripts/test-intelligence-global-intake-workflow.mjs scripts/test-intelligence-global-intake-quality.mjs scripts/test-intelligence-global-nhsbsa-bridge.mjs scripts/test-intelligence-global-source-gateway.mjs
          node --test scripts/test-intelligence-source-snapshot-quarantine.mjs scripts/test-intelligence-source-snapshot-schema.mjs
