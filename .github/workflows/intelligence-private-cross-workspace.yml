name: Intelligence private cross-workspace acceptance
on:
  pull_request:
    paths:
      - "src/core/intelligence-private-cross-workspace.mjs"
      - "scripts/test-intelligence-private-cross-workspace.mjs"
      - ".github/workflows/intelligence-private-cross-workspace.yml"
  push:
    branches: [main]
    paths:
      - "src/core/intelligence-private-cross-workspace.mjs"
      - "scripts/test-intelligence-private-cross-workspace.mjs"
      - ".github/workflows/intelligence-private-cross-workspace.yml"
permissions:
  contents: read
jobs:
  private-cross-workspace-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Private six-workspace cross-source and tenant negative tests
        run: node --test scripts/test-intelligence-private-cross-workspace.mjs
