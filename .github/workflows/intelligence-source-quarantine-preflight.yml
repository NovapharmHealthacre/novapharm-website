name: Intelligence source quarantine preflight
on:
  pull_request:
    paths:
      - "src/data/intelligence-source-quarantine-preflight.mjs"
      - "scripts/test-intelligence-source-quarantine-preflight.mjs"
      - ".github/workflows/intelligence-source-quarantine-preflight.yml"
  push:
    branches: [main]
    paths:
      - "src/data/intelligence-source-quarantine-preflight.mjs"
      - "scripts/test-intelligence-source-quarantine-preflight.mjs"
      - ".github/workflows/intelligence-source-quarantine-preflight.yml"
permissions:
  contents: read
jobs:
  offline-quarantine-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Offline quarantine contract and adversarial tests
        run: node --test scripts/test-intelligence-source-quarantine-preflight.mjs
