name: Unified Chromium and WebKit acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novapharm-unified-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-applications:
    name: ${{ matrix.application }} public application
    runs-on: ubuntu-24.04
    # Official version-matched image avoids cold Ubuntu apt mirror timeouts
    # while preserving Chromium, WebKit and all existing acceptance tests.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        application:
          - corporate
          - technology
          - founder
          - status
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      # Both browsers must be present before real accessibility, Lighthouse
      # and role/viewport acceptance. Do not disable or mock either engine.
      - name: Verify Chromium and WebKit browsers (bounded)
        run: timeout --signal=TERM --kill-after=30s 600s npx playwright install chromium webkit
      - name: Validate and build ${{ matrix.application }}
        run: npm run ${{ matrix.application }}:check
      - name: Run complete route, viewport and Axe matrix
        run: npm run ${{ matrix.application }}:test:browser
      - name: Upload rendered acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.application }}-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/${{ matrix.application }}-browser
          if-no-files-found: error
          retention-days: 7

  secure-portal:
    name: Secure portal and role-boundary acceptance
    runs-on: ubuntu-24.04
    # Official version-matched image avoids cold Ubuntu apt mirror timeouts
    # while preserving Chromium, WebKit and all existing acceptance tests.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      # Both browsers must be present before real accessibility, Lighthouse
      # and role/viewport acceptance. Do not disable or mock either engine.
      - name: Verify Chromium and WebKit browsers (bounded)
        run: timeout --signal=TERM --kill-after=30s 600s npx playwright install chromium webkit
      - name: Validate portal and API boundary
        run: npm run api:check && npm run portal:check
      - name: Run all portal roles, routes and responsive viewports
        run: npm run portal:test:browser
      - name: Verify Lighthouse transient retry never hides real failures
        run: node --test scripts/test-lighthouse-transient-navigation.mjs
      - name: Run portal Lighthouse acceptance
        run: npm run portal:test:lighthouse
      - name: Upload protected-portal acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/portal-browser
            artifacts/portal-lighthouse
          if-no-files-found: error
          retention-days: 7

  backend-workflows:
    name: Contact, account, upload and authentication workflows
    runs-on: ubuntu-24.04
    # Version-pinned official Playwright image bundles native Chromium/WebKit
    # dependencies; the previous cold Ubuntu apt mirror exhausted 1,200s.
    # Keep both real engines and all synthetic authentication workflows.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      # The official image already supplies native libraries and browser builds
      # matching the frozen npm package. Explicitly verify both engines before
      # the real Chromium+WebKit workflow acceptance; never skip launch/tests.
      - name: Verify Chromium and WebKit browsers (bounded)
        run: timeout --signal=TERM --kill-after=30s 600s npx playwright install chromium webkit
      - name: Build legacy rollback shell used only by the isolated workflow harness
        run: npm run build
      - name: Start synthetic non-production runtime
        run: node scripts/start-browser-validation.mjs "$RUNNER_TEMP/novapharm-browser-backend"
      - name: Run browser workflow integration tests
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4178
          VISUAL_CREDENTIALS_PATH: ${{ runner.temp }}/novapharm-browser-backend/credentials.json
        run: npm run test:browser-workflows
      - name: Remove synthetic runtime and credentials
        if: always()
        run: |
          node scripts/stop-browser-validation.mjs "$RUNNER_TEMP/novapharm-browser-backend" || true
          rm -rf "$RUNNER_TEMP/novapharm-browser-backend"
          test ! -e "$RUNNER_TEMP/novapharm-browser-backend"

  acceptance-gate:
    name: Unified browser acceptance gate
    if: always()
    needs:
      - public-applications
      - secure-portal
      - backend-workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce all rendered and workflow suites
        run: |
          test "${{ needs.public-applications.result }}" = success
          test "${{ needs.secure-portal.result }}" = success
          test "${{ needs.backend-workflows.result }}" = success
