name: Unified Chromium and WebKit acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novapharm-unified-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-applications:
    name: ${{ matrix.application }} public application
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        application:
          - corporate
          - technology
          - founder
          - status
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Validate and build ${{ matrix.application }}
        run: npm run ${{ matrix.application }}:check
      - name: Run complete route, viewport and Axe matrix
        run: npm run ${{ matrix.application }}:test:browser
      - name: Upload rendered acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.application }}-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/${{ matrix.application }}-browser
          if-no-files-found: error
          retention-days: 7

  secure-portal:
    name: Secure portal and role-boundary acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Validate portal and API boundary
        run: npm run api:check && npm run portal:check
      - name: Run all portal roles, routes and responsive viewports
        run: npm run portal:test:browser
      - name: Run portal Lighthouse acceptance
        run: npm run portal:test:lighthouse
      - name: Upload protected-portal acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/portal-browser
            artifacts/portal-lighthouse
          if-no-files-found: error
          retention-days: 7

  backend-workflows:
    name: Contact, account, upload and authentication workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build legacy rollback shell used only by the isolated workflow harness
        run: npm run build
      - name: Start synthetic non-production runtime
        run: node scripts/start-browser-validation.mjs "$RUNNER_TEMP/novapharm-browser-backend"
      - name: Run browser workflow integration tests
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4178
          VISUAL_CREDENTIALS_PATH: ${{ runner.temp }}/novapharm-browser-backend/credentials.json
        run: npm run test:browser-workflows
      - name: Remove synthetic runtime and credentials
        if: always()
        run: |
          node scripts/stop-browser-validation.mjs "$RUNNER_TEMP/novapharm-browser-backend" || true
          rm -rf "$RUNNER_TEMP/novapharm-browser-backend"
          test ! -e "$RUNNER_TEMP/novapharm-browser-backend"

  acceptance-gate:
    name: Unified browser acceptance gate
    if: always()
    needs:
      - public-applications
      - secure-portal
      - backend-workflows
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all rendered and workflow suites
        run: |
          test "${{ needs.public-applications.result }}" = success
          test "${{ needs.secure-portal.result }}" = success
          test "${{ needs.backend-workflows.result }}" = success
