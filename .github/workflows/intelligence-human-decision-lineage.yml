name: Intelligence human decision lineage acceptance

on:
  pull_request:
    paths:
      - 'src/core/intelligence-medicine-decision-review.mjs'
      - 'scripts/test-intelligence-medicine-decision-review.mjs'
      - '.github/workflows/intelligence-human-decision-lineage.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/intelligence-medicine-decision-review.mjs'
      - 'scripts/test-intelligence-medicine-decision-review.mjs'
      - '.github/workflows/intelligence-human-decision-lineage.yml'
permissions:
  contents: read
jobs:
  decision-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify syntax and human authority decision contracts
        run: |
          node --check src/core/intelligence-medicine-decision-review.mjs
          node --test scripts/test-intelligence-medicine-decision-review.mjs
