name: Intelligence isolated evidence-writer candidate contract

on:
  pull_request:
    paths:
      - 'infra/aws/intelligence-commerce-evidence-isolation-candidate.json'
      - 'scripts/test-intelligence-commerce-evidence-isolation-candidate.mjs'
      - '.github/workflows/intelligence-evidence-writer-isolation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate fail-closed migration candidate
        run: node --test scripts/test-intelligence-commerce-evidence-isolation-candidate.mjs
