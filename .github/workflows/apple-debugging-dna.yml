name: Apple debugging DNA and complete tracked-file inventory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novapharm-debugging-dna-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-debugging-audit:
    name: Scan every tracked file without external services
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate debugging inventory and regression gates
        run: node --test scripts/test-debugging-dna.mjs
      - name: Inspect tracked files and release-sensitive debug leakage
        run: node scripts/audit-debugging-dna.mjs --strict
      - name: Preserve minimal debugging inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: novapharm-debugging-dna-${{ github.sha }}
          path: artifacts/debugging/site-audit.json
          if-no-files-found: warn
          retention-days: 14
