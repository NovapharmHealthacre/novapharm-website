name: Apple debugging DNA and complete tracked-file inventory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-debugging-audit:
    name: Scan every tracked file without external services
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate debugging inventory and regression gates
        run: python3 -m unittest discover -s scripts -p test_audit_debugging_dna.py
      - name: Inspect tracked files and release-sensitive debug leakage
        run: python3 scripts/audit_debugging_dna.py --strict
      - name: Preserve minimal debugging inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-debugging-dna-${{ github.sha }}
          path: artifacts/debugging/site-audit.json
          if-no-files-found: warn
          retention-days: 14
