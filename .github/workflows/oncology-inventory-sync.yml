name: Refresh governed Oncology image inventory (one-time candidate)

on:
  push:
    branches:
      - codex/oncology-apple-editorial-20261107
    paths:
      - .github/workflows/oncology-inventory-sync.yml

permissions:
  contents: write

jobs:
  refresh-inventory:
    if: github.repository == 'NovapharmHealthacre/novapharm-website'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Reconcile candidate branch before regenerating inventory
        run: |
          test "${GITHUB_REF_NAME}" = 'codex/oncology-apple-editorial-20261107'
          git fetch origin codex/oncology-apple-editorial-20261107
          git rebase origin/codex/oncology-apple-editorial-20261107
      - name: Regenerate complete provenance-based inventory without relaxing checks
        run: npm run images:inventory
      - name: Verify generated manifest
        run: npm run images:inventory:validate
      - name: Commit only the generated governed inventory back to the candidate
        run: |
          git diff --stat -- audit/generated/image-inventory.json
          if git diff --quiet -- audit/generated/image-inventory.json; then
            echo 'Image inventory already matches; no commit required.'
            exit 0
          fi
          test "${GITHUB_REF_NAME}" = 'codex/oncology-apple-editorial-20261107'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/generated/image-inventory.json
          git commit -m 'chore(oncology): regenerate governed image provenance inventory'
          git push origin HEAD:codex/oncology-apple-editorial-20261107
