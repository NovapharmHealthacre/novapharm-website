name: Nutraxin paid-order receipt outbox safety

on:
  pull_request:
    paths:
      - "apps/nutraxin-payment-notifications/**"
      - "infra/aws/nutraxin-payment-notifications-production.json"
      - ".github/workflows/nutraxin-payment-notifications.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-receipt-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile guarded private receipt worker
        run: python -m py_compile apps/nutraxin-payment-notifications/dispatcher.py
      - name: Verify no-charge synthetic paid-event and SES gates
        run: python -m unittest discover -s apps/nutraxin-payment-notifications -p 'test_dispatcher.py' -v
      - name: Verify reviewed sources are free of trailing whitespace
        run: git diff --check
