name: Apple AI offline research and owner public-release hold

on:
  pull_request:
    paths:
      - "src/ai/search-bootstrap.mjs"
      - "scripts/build-ai-knowledge-index.mjs"
      - "scripts/test-ai-index.mjs"
      - "scripts/test-ai-build-artifact-linkage.mjs"
      - ".github/workflows/apple-ai-public-artifact.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate AI source and public hold contracts
        run: |
          node --check scripts/build-ai-knowledge-index.mjs
          node --check src/ai/search-bootstrap.mjs
          node --test scripts/test-ai-build-artifact-linkage.mjs

  offline-research-index:
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Produce research-only public evidence fixtures without publishing
        run: |
          PLATFORM_MODE=PUBLIC_ONLY node scripts/build-pages.mjs
          node scripts/build-ai-knowledge-index.mjs
          node scripts/test-ai-index.mjs
          node scripts/test-ai-privacy.mjs

  approved-public-hold:
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify approved public-only build retains no public AI
        run: |
          npm run build:public-only
          node scripts/test-owner-corrections.mjs
          node scripts/stage-pages-artifact.mjs _site
          test ! -e _site/search
          test ! -e _site/technology/ai-governance
          test ! -e _site/assets/ai
          test ! -e _site/assets/js/ai-search.js
