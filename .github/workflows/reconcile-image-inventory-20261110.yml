name: Reconcile image provenance inventory in isolated branch
on:
  push:
    branches:
      - fix/image-inventory-provenance-20261110
    paths:
      - .github/workflows/reconcile-image-inventory-20261110.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact, isolated review branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Set Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies, no postinstall execution
        run: npm ci --ignore-scripts
      - name: Reconcile image register only from tracked provenance
        run: |
          set -euo pipefail
          npm run images:inventory
          npm run images:inventory:validate
          test -s audit/generated/image-inventory.json
          git diff --check
          unexpected="$(git diff --name-only -- . ':!audit/generated/image-inventory.json')"
          test -z "$unexpected" || { echo "::error::Unexpected files modified: $unexpected"; exit 1; }
          node -e 'const i=require("./audit/generated/image-inventory.json"); if(!Array.isArray(i.assets)||i.assets.length<100)process.exit(1);console.log("Evidence-only inventory assets:",i.assets.length)'
      - name: Commit generated evidence to this review branch only
        run: |
          set -euo pipefail
          git add audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Current image inventory is already exact."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(evidence): reconcile approved image inventory from tracked source'
          git push origin HEAD:"$GITHUB_REF_NAME"
