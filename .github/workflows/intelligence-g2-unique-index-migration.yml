name: Intelligence G2 Atlas unique-index migration contract
on:
  pull_request:
    paths:
      - 'src/data/atlas-g2-unique-index-migration.mjs'
      - 'scripts/test-atlas-g2-unique-index-migration.mjs'
      - 'docs/intelligence/ATLAS_G2_UNIQUE_INDEX_MIGRATION_20261114.md'
      - '.github/workflows/intelligence-g2-unique-index-migration.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/atlas-g2-unique-index-migration.mjs'
      - 'scripts/test-atlas-g2-unique-index-migration.mjs'
      - 'docs/intelligence/ATLAS_G2_UNIQUE_INDEX_MIGRATION_20261114.md'
      - '.github/workflows/intelligence-g2-unique-index-migration.yml'
permissions:
  contents: read
jobs:
  verify-schema-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Test dry-run, approval fence, exact unique indexes and failure recovery
        run: node --test scripts/test-atlas-g2-unique-index-migration.mjs
