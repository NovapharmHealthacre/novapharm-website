name: SEO and digital authority validation

on:
  pull_request:
    paths:
      - "src/content/**"
      - "src/seo/**"
      - "scripts/build-site.mjs"
      - "scripts/enhance-seo-authority.mjs"
      - "scripts/reconcile-leadership-authority.mjs"
      - "scripts/reconcile-article-authority.mjs"
      - "scripts/reconcile-social-authority.mjs"
      - "scripts/finalise-social-cards.mjs"
      - "scripts/generate-structured-data-register.mjs"
      - "scripts/validate-seo-authority.mjs"
      - "scripts/validate-social-authority.mjs"
      - "scripts/indexnow.mjs"
      - "scripts/stage-pages-artifact.mjs"
      - "scripts/test-static-public-source-safety.mjs"
      - "assets/js/marketing-attribution.js"
      - "seo/**"
      - "robots.txt"
      - "sitemap*.xml"
      - "*.txt"
      - "package.json"
      - ".github/workflows/seo-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Verify checked-in public source is default-deny
        run: node scripts/test-static-public-source-safety.mjs

      - name: Build public authority system
        run: npm run build:public-only

      - name: Validate SEO, GEO, entities and discovery
        id: seo_validation
        continue-on-error: true
        run: |
          set -o pipefail
          PLATFORM_MODE=PUBLIC_ONLY npm run seo:validate 2>&1 | tee /tmp/seo-authority-validation.log

      - name: Upload SEO validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seo-authority-validation
          path: /tmp/seo-authority-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce SEO validation result
        if: steps.seo_validation.outcome != 'success'
        run: exit 1

      - name: Validate IndexNow without network submission
        run: npm run seo:indexnow:dry-run -- https://novapharmhealthcare.com/

      - name: Run public claims and security validation
        run: |
          npm run audit:claims
          npm run security:scan
          npm run test:owner-corrections:public-only
          npm run validate:domain
          node scripts/test-static-public-source-safety.mjs

      - name: Capture first deployable public artifact
        run: node scripts/stage-pages-artifact.mjs /tmp/novapharm-public-a

      - name: Rebuild the same release mode
        run: npm run build:public-only

      - name: Capture second deployable public artifact
        run: |
          node scripts/test-static-public-source-safety.mjs
          node scripts/stage-pages-artifact.mjs /tmp/novapharm-public-b

      - name: Verify deployable public artifact is reproducible
        run: diff -qr /tmp/novapharm-public-a /tmp/novapharm-public-b
