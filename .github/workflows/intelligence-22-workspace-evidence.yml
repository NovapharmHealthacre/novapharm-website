name: Intelligence 22 workspace evidence contracts

on:
  pull_request:
    paths:
      - 'src/core/intelligence-22-workspace-readiness.mjs'
      - 'src/core/intelligence-unified-capability-evidence.mjs'
      - 'apps/portal/data/intelligence-workspaces.ts'
      - 'scripts/test-intelligence-22-workspace-readiness.mjs'
      - 'scripts/test-intelligence-unified-capability-evidence.mjs'
      - '.github/workflows/intelligence-22-workspace-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gates:
    name: 22 route + six-capability release-denial contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate module syntax
        run: |
          node --check src/core/intelligence-22-workspace-readiness.mjs
          node --check scripts/test-intelligence-22-workspace-readiness.mjs
      - name: Validate every module cannot auto-promote to production
        run: node --test scripts/test-intelligence-22-workspace-readiness.mjs scripts/test-intelligence-unified-capability-evidence.mjs
