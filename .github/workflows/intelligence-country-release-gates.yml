name: Intelligence all countries release evidence and source gates

on:
  pull_request:
    paths:
      - 'docs/intelligence/global-pharma-sources-20261117.json'
      - 'src/core/intelligence-country-release-ledger.mjs'
      - 'src/core/intelligence-global-source-gateway.mjs'
      - 'scripts/test-intelligence-country-release-ledger.mjs'
      - 'scripts/render-intelligence-country-release-ledger.mjs'
      - '.github/workflows/intelligence-country-release-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-countries-gated:
    name: 77 countries, 101 sources, and deny-first production gates
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Syntax-check national ledger and the report renderer
        run: |
          node --check src/core/intelligence-country-release-ledger.mjs
          node --check scripts/test-intelligence-country-release-ledger.mjs
          node --check scripts/render-intelligence-country-release-ledger.mjs
      - name: Verify all 77 national, EU/EEA, Global and 101 source requirements
        run: node --test scripts/test-intelligence-country-release-ledger.mjs
      - name: Generate country evidence report without network or customer publication
        run: |
          mkdir -p artifacts/country-release-ledger
          node scripts/render-intelligence-country-release-ledger.mjs --json > artifacts/country-release-ledger/readiness.json
          node scripts/render-intelligence-country-release-ledger.mjs --markdown > artifacts/country-release-ledger/readiness.md
          node - <<'NODE'
          const fs = require("node:fs");
          const d = JSON.parse(fs.readFileSync("artifacts/country-release-ledger/readiness.json","utf8"));
          if (d.nationalCountries !== 77 || d.totalSources !== 101 ||
              d.verifiedLicensedSources !== 0 || d.verifiedProductionCountries !== 0 ||
              d.countries.length !== 79 || d.sourceRows.some(x => x.canPublish !== false)) {
            throw new Error("Unsafe or incomplete country release evidence");
          }
          NODE
      - name: Archive inspectable evidence; never a customer release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: intelligence-country-release-ledger
          path: artifacts/country-release-ledger/
          if-no-files-found: error
          retention-days: 7
