name: Corporate source-to-sitemap completeness (read only)
on:
  pull_request:
    paths:
      - 'sitemap.xml'
      - 'apps/corporate/data/pages.ts'
      - 'scripts/test-corporate-sitemap-source-parity.mjs'
      - '.github/workflows/corporate-sitemap-source-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Test corporate route and canonical sitemap coverage
        run: node --test scripts/test-corporate-sitemap-source-parity.mjs
