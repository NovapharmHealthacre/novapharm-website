name: Reconcile governed image inventory (isolated branch only)

on:
  push:
    branches:
      - codex/security-dependencies-20261106
      # Generate a review artifact only; the apply job remains on its original branch.
      - codex/corporate-responsive-20261114
    paths:
      - '.github/workflows/reconcile-image-inventory-candidate.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate inventory from original registered assets, no unverified source claims
        run: |
          set -euo pipefail
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          git diff --stat -- audit/generated/image-inventory.json
          mkdir -p candidate
          cp audit/generated/image-inventory.json candidate/image-inventory.json
          printf '%s\n' "$GITHUB_SHA" > candidate/source-sha.txt
          sha256sum candidate/image-inventory.json > candidate/sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audited-image-inventory-candidate
          path: candidate/
          retention-days: 7

  apply:
    needs: generate
    if: github.repository == 'NovapharmHealthacre/novapharm-website' && github.ref == 'refs/heads/codex/security-dependencies-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Require the original branch SHA and no concurrency conflict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/security-dependencies-20261106 | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audited-image-inventory-candidate
          path: ${{ runner.temp }}/novapharm-image-candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Revalidate exact candidate before isolated commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < "$RUNNER_TEMP/novapharm-image-candidate/source-sha.txt")" = "$GITHUB_SHA"
          test -s "$RUNNER_TEMP/novapharm-image-candidate/image-inventory.json"
          sha256sum "$RUNNER_TEMP/novapharm-image-candidate/image-inventory.json"
          cp "$RUNNER_TEMP/novapharm-image-candidate/image-inventory.json" audit/generated/image-inventory.json
          npm ci --ignore-scripts
          npm run images:inventory:validate
          git diff --check
          git add audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Already reconciled; no inventory commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(evidence): reconcile governed image inventory after release changes"
          git push origin HEAD:refs/heads/codex/security-dependencies-20261106
