name: Finalise authoritative corporate asset inventory
on:
  push:
    branches:
      - fix/corporate-inventory-readiness-20261111
    paths:
      - .github/workflows/finalise-corporate-asset-inventory.yml
permissions:
  contents: read
jobs:
  regenerate:
    if: github.repository == 'NovapharmHealthacre/novapharm-website'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Regenerate governed asset ledger from canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "fix/corporate-inventory-readiness-20261111"
          npm ci --ignore-scripts
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          test "$(git diff --name-only)" = "audit/generated/image-inventory.json"
          git add audit/generated/image-inventory.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(evidence): regenerate source inventory without temporary audit references"
          git push origin HEAD:refs/heads/fix/corporate-inventory-readiness-20261111
