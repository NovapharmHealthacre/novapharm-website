name: Intelligence analytics review guard

on:
  pull_request:
    paths:
      - 'infrastructure/aws/novapharm-intelligence-analytics-review.yaml'
      - 'infrastructure/aws/glue_review_candidate_preflight.py'
      - 'infrastructure/aws/tests/test_analytics_review_preflight.py'
      - 'docs/data/evidence/nhsbsa-epd-apixaban-2026-08-candidate.ndjson'
      - 'docs/data/evidence/nhsbsa-epd-publisher-metadata-202608.json'
      - '.github/workflows/intelligence-analytics-review-guard.yml'
      - 'scripts/aws/deploy-intelligence-analytics-review-script.sh'
  push:
    branches: [main]
    paths:
      - 'infrastructure/aws/novapharm-intelligence-analytics-review.yaml'
      - 'infrastructure/aws/glue_review_candidate_preflight.py'
      - 'infrastructure/aws/tests/test_analytics_review_preflight.py'
      - 'docs/data/evidence/nhsbsa-epd-apixaban-2026-08-candidate.ndjson'
      - 'docs/data/evidence/nhsbsa-epd-publisher-metadata-202608.json'
      - '.github/workflows/intelligence-analytics-review-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-candidate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate controlled deployment helper
        run: bash -n scripts/aws/deploy-intelligence-analytics-review-script.sh
      - name: Compile Python preflight and run negative contract tests
        run: |
          python3 -m py_compile infrastructure/aws/glue_review_candidate_preflight.py
          python3 -m unittest discover -s infrastructure/aws/tests -p 'test_analytics_review_preflight.py' -v
