name: SharePoint Graph path boundary
on:
  pull_request:
    paths:
      - 'src/integrations/sharepoint/graph-client.mjs'
      - 'scripts/test-sharepoint-graph-paths.mjs'
      - 'integrations/sharepoint/README.md'
      - '.github/workflows/sharepoint-graph-path-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-graph-path-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node --check src/integrations/sharepoint/graph-client.mjs
      - run: node --test scripts/test-sharepoint-graph-paths.mjs
