name: ESCO 373-SKU price and checkout readiness preparation

on:
  pull_request:
    paths:
      - 'apps/esco-checkout/**'
      - 'infra/aws/esco-products-checkout-production.json'
      - 'scripts/esco-merchant-release-matrix.mjs'
      - 'scripts/esco-merchandising.mjs'
      - 'assets/data/esco-catalogue.json'
      - 'docs/commerce/esco-373-payment-activation.md'
      - '.github/workflows/esco-commercial-release-preparation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Configure Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies for isolated commercial and checkout unit tests
        run: python -m pip install 'boto3>=1.34,<2'
      - name: Generate one commercial source row for each of 373 references
        run: |
          node scripts/esco-merchant-release-matrix.mjs
          python apps/esco-checkout/merchant_release.py --bootstrap
      - name: Verify no unapproved SKU can be charged
        run: |
          python apps/esco-checkout/merchant_release.py --check
          python -m unittest discover -s apps/esco-checkout -p 'test_*.py' -v
      - name: Archive evidence drafting data without triggering live Stripe or SSM changes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esco-373-sale-offer-readiness-draft
          path: |
            docs/commerce/esco-2026-merchant-release-matrix.csv
            docs/commerce/esco-2026-release-evidence-draft.json
          retention-days: 14
          if-no-files-found: error
