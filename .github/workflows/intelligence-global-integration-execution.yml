name: Intelligence global integration execution and Poland NFZ contract
on:
  pull_request:
    paths:
      - 'docs/intelligence/global-integration-execution-20261126.json'
      - 'docs/intelligence/worldwide-jurisdiction-scope-20261126.json'
      - 'scripts/test-intelligence-worldwide-jurisdiction-scope.mjs'
      - 'src/core/intelligence-pl-nfz-dictionary.mjs'
      - 'scripts/test-intelligence-global-integration-execution.mjs'
      - 'apps/portal/components/country-source-coverage.tsx'
      - 'native/novapharm-intelligence-mobile/CountryDirectoryScreen.tsx'
      - 'native/novapharm-intelligence-ios/App/NovaCountryDirectoryView.swift'
      - '.github/workflows/intelligence-global-integration-execution.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node --test scripts/test-intelligence-global-integration-execution.mjs scripts/test-intelligence-worldwide-jurisdiction-scope.mjs
