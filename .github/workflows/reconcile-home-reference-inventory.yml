name: Reconcile approved homepage image inventory

on:
  push:
    branches:
      - fix/home-hero-exact-reference-20261110
    paths:
      - .github/workflows/reconcile-home-reference-inventory.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'NovapharmHealthacre/novapharm-website'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate and validate the governed physical media inventory
        run: |
          set -euo pipefail
          npm run images:inventory
          npm run images:inventory:validate
      - name: Commit generated report only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/generated/image-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(media): regenerate authoritative approved homepage image inventory"
            git push origin HEAD:refs/heads/fix/home-hero-exact-reference-20261110
          fi
