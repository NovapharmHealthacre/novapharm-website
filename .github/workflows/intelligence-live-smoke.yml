name: Verify NovaPharm Intelligence live Technology release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/intelligence-live-smoke.yml'
      - 'src/content/technology-intelligence.html'
      - 'technology/index.html'
      - 'technology/workspaces/**'
      - 'assets/css/intelligence-workspace-embedded.css'
      - 'assets/js/intelligence-workspace-embedded.js'
      - 'assets/css/intelligence-workspace-product.css'
      - 'assets/js/intelligence-workspace-product.js'
      - 'assets/css/technology-intelligence.css'
      - 'assets/js/intelligence-research-launcher.js'
      - 'scripts/apply-corporate-product-discipline.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-intelligence-live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Confirm exact research page, assets and protected-business contact
        shell: bash
        run: |
          set -euo pipefail
          origin="https://novapharmhealthcare.com"
          for attempt in $(seq 1 15); do
            key="intelligence-${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$origin/technology/?$key" -o /tmp/novapharm-technology-live.html || true
            curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$origin/assets/js/intelligence-research-launcher.js?$key" -o /tmp/novapharm-intelligence-live.js || true
            curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$origin/assets/css/technology-intelligence.css?$key" -o /tmp/novapharm-intelligence-live.css || true
            curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$origin/assets/js/intelligence-workspace-embedded.js?$key" -o /tmp/novapharm-workspace-native.js || true
            curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$origin/assets/css/intelligence-workspace-embedded.css?$key" -o /tmp/novapharm-workspace-native.css || true
            curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$origin/contact/?$key" -o /tmp/novapharm-contact-live.html || true
            # Verify the actual new hero image, not just an old text-compatible page.
            curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$origin/assets/media/technology/novapharm-intelligence-hero.avif?$key" -o /tmp/novapharm-intelligence-hero-live.avif || true
            # Scope the retired-label check to the hero. Pricing and other
            # sections may legitimately use the same brand kicker text.
            sed -n '/<section class="npi-hero/,/<section id="intelligence-research"/p' \
              /tmp/novapharm-technology-live.html > /tmp/novapharm-intelligence-hero-markup.html
            if grep -Fq 'class="npi-hero npi-hero--editorial"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'class="npi-hero-logo"><img src="/assets/brand/novapharm-intelligence-approved.svg"' /tmp/novapharm-technology-live.html \
              && ! grep -Fq '<p class="npi-kicker">NOVAPHARM INTELLIGENCE</p>' /tmp/novapharm-intelligence-hero-markup.html \
              && grep -Fq 'id="intelligence-pricing"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'Intelligence. Made simple.' /tmp/novapharm-technology-live.html \
              && grep -Fq 'data-npi-plan="trial"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'data-npi-plan="starter"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'data-npi-plan="professional"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'data-npi-plan="enterprise"' /tmp/novapharm-technology-live.html \
              && test "$(grep -o 'data-npi-plan="' /tmp/novapharm-technology-live.html | wc -l | tr -d '[:space:]')" -eq 4 \
              && grep -Fq 'Request free trial' /tmp/novapharm-technology-live.html \
              && grep -Fq 'Request Professional' /tmp/novapharm-technology-live.html \
              && grep -Fq 'novapharm-intelligence-hero.avif' /tmp/novapharm-intelligence-live.css \
              && test -s /tmp/novapharm-intelligence-hero-live.avif \
              && grep -Fq 'id="intelligence-research"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'data-npi-research-form' /tmp/novapharm-technology-live.html \
              && grep -Fq 'src="/assets/js/intelligence-research-launcher.js"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'Search a medicine' /tmp/novapharm-technology-live.html \
              && grep -Fq 'id="intelligence-workspace-directory"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'id="npi-exp-shell"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'src="/assets/js/intelligence-workspace-embedded.js"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'href="/assets/css/intelligence-workspace-embedded.css"' /tmp/novapharm-technology-live.html \
              && grep -Fq 'function renderSupplyMode(mode)' /tmp/novapharm-workspace-native.js \
              && grep -Fq 'ILLUSTRATIVE PRODUCT EXPERIENCE' /tmp/novapharm-workspace-native.js \
              && grep -Fq 'npi-workspace-live-experience' /tmp/novapharm-workspace-native.css \
              && grep -Fq 'ALL 22 PROFESSIONAL WORKSPACES' /tmp/novapharm-technology-live.html \
              && test "$(grep -o 'data-npi-workspace="' /tmp/novapharm-technology-live.html | wc -l | tr -d '[:space:]')" -eq 22 \
              && grep -Fq 'Protected workspace entry' /tmp/novapharm-technology-live.html \
              && grep -Fq 'Public research is available separately' /tmp/novapharm-technology-live.html \
              && grep -Fq 'No tracking, storage, credential access' /tmp/novapharm-intelligence-live.js \
              && grep -Fq '.npi-research-form' /tmp/novapharm-intelligence-live.css \
              && grep -Fq 'data-live-b2b-enquiry-form' /tmp/novapharm-contact-live.html \
              && ! grep -Fq 'data-email-enquiry-form' /tmp/novapharm-contact-live.html; then
              echo "Live Technology four-plan pricing, research, workspace and AWS-backed Contact passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live Technology and Contact parity not established. Do not claim Intelligence public release verified." >&2
          exit 1
