name: Intelligence customer billing portal contract

on:
  pull_request:
    paths:
      - 'src/core/intelligence-billing-portal.mjs'
      - 'scripts/test-intelligence-billing-portal.mjs'
      - 'src/core/intelligence-live-stripe-catalog.mjs'
      - '.github/workflows/intelligence-billing-portal.yml'

permissions:
  contents: read

jobs:
  verify-billing-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Enforce tenant-owned Stripe Billing Portal session and response
        run: node --test scripts/test-intelligence-billing-portal.mjs
      - name: Preserve immutable live Stripe price and product catalog
        run: node --test scripts/test-intelligence-live-stripe-catalog.mjs
