name: Update Azure dependency lock

on:
  workflow_dispatch:
  push:
    branches:
      - codex/azure-production-platform
    paths:
      - package.json
      - .github/workflows/update-azure-dependency-lock.yml

permissions:
  contents: write

concurrency:
  group: azure-dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve pinned runtime dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Commit the verified lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock Azure production dependencies"
          git push origin HEAD:${{ github.ref_name }}
