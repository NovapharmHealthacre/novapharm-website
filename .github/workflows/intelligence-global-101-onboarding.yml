name: Intelligence all 101 source onboarding coverage

on:
  pull_request:
    paths:
      - 'src/core/intelligence-global-source-onboarding.mjs'
      - 'src/core/intelligence-global-source-gateway.mjs'
      - 'docs/intelligence/global-pharma-sources-20261117.json'
      - 'docs/intelligence/global-101-source-integration-matrix-20261118.md'
      - 'scripts/test-intelligence-global-source-onboarding.mjs'
      - '.github/workflows/intelligence-global-101-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-and-source-rights:
    name: All source candidates mapped; no live access inferred
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Verify syntax and source code mapping
        run: |
          node --check src/core/intelligence-global-source-onboarding.mjs
          node --check scripts/test-intelligence-global-source-onboarding.mjs
      - name: Validate every one of 101 candidate routes and fail-closed status
        run: node --test scripts/test-intelligence-global-source-onboarding.mjs scripts/test-intelligence-global-source-registry.mjs
