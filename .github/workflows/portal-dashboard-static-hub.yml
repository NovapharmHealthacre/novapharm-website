name: Portal static customer hub mobile stability
on:
  pull_request:
    paths:
      - 'apps/portal/components/dashboard.tsx'
      - 'apps/portal/components/customer-commerce-workspace.tsx'
      - 'apps/portal/app/[[...slug]]/page.tsx'
      - 'scripts/test-portal-dashboard-static-hub.mjs'
      - '.github/workflows/portal-dashboard-static-hub.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/components/dashboard.tsx'
      - 'scripts/test-portal-dashboard-static-hub.mjs'
permissions:
  contents: read
jobs:
  authorized-first-paint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node --test scripts/test-portal-dashboard-static-hub.mjs
