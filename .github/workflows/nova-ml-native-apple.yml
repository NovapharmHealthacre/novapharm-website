name: Nova ML native Apple package and denial tests

on:
  pull_request:
    paths:
      - "native/novapharm-intelligence-apple/**"
      - ".github/workflows/nova-ml-native-apple.yml"
  push:
    branches: [main]
    paths:
      - "native/novapharm-intelligence-apple/**"
      - ".github/workflows/nova-ml-native-apple.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-package:
    name: Compile native package and denial tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show runner SDK and Xcode versions
        run: |
          xcodebuild -version
          swift --version
      - name: Compile package and run fail-closed contract tests
        run: swift test --package-path native/novapharm-intelligence-apple
      - name: Explain release boundary
        run: echo "SwiftPM testing does not sign a production app, provision entitlements, license models or verify physical devices."
