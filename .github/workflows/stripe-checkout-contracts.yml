name: Stripe Checkout default-deny contract tests
on:
  pull_request:
    paths:
      - 'src/core/payments/stripe-checkout.mjs'
      - 'scripts/test-stripe-gateway.mjs'
      - '.github/workflows/stripe-checkout-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify Stripe fail-closed contracts without network or secrets
        run: node --test scripts/test-stripe-gateway.mjs
