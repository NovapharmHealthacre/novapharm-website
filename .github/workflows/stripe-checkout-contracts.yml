name: Stripe Checkout default-deny contract tests
on:
  pull_request:
    paths:
      - 'src/core/payments/stripe-checkout.mjs'
      - 'scripts/test-stripe-gateway.mjs'
      - 'src/core/payments/payment-ledger-reference.sql'
      - 'scripts/test-payment-ledger.mjs'
      - 'src/core/payments/stripe-merchant-readiness.mjs'
      - 'scripts/test-stripe-merchant-readiness.mjs'
      - 'src/core/payments/commerce-margin-policy.mjs'
      - 'scripts/test-commerce-margin-policy.mjs'
      - 'src/core/payments/stripe-refund-policy.mjs'
      - 'scripts/test-stripe-refund-policy.mjs'
      - 'scripts/test-commerce-payment-lifecycle.mjs'
      - 'src/core/payments/authorised-checkout-flow.mjs'
      - 'scripts/test-authorised-checkout-flow.mjs'
      - '.github/workflows/stripe-checkout-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify Stripe fail-closed contracts without network or secrets
        run: node --test scripts/test-stripe-gateway.mjs scripts/test-payment-ledger.mjs scripts/test-stripe-merchant-readiness.mjs scripts/test-commerce-margin-policy.mjs scripts/test-stripe-refund-policy.mjs scripts/test-commerce-payment-lifecycle.mjs scripts/test-authorised-checkout-flow.mjs
