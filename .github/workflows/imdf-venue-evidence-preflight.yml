name: IMDF venue evidence preflight

on:
  pull_request:
    paths:
      - "scripts/imdf/**"
      - "docs/maps/imdf-venue-preflight-20261119.md"
      - ".github/workflows/imdf-venue-evidence-preflight.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/imdf/**"
      - "docs/maps/imdf-venue-preflight-20261119.md"
      - ".github/workflows/imdf-venue-evidence-preflight.yml"

permissions:
  contents: read

jobs:
  imdf-source-gate:
    name: IMDF synthetic preflight denial tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Run offline fail-closed venue tests
        run: node --test scripts/imdf/venue-preflight.test.mjs
