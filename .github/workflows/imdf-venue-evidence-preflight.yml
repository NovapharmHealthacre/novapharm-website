name: IMDF venue evidence preflight

on:
  pull_request:
    paths:
      - "scripts/imdf/**"
      - "docs/maps/imdf-venue-preflight-20261119.md"
      - ".github/workflows/imdf-venue-evidence-preflight.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/imdf/**"
      - "docs/maps/imdf-venue-preflight-20261119.md"
      - ".github/workflows/imdf-venue-evidence-preflight.yml"

permissions:
  contents: read

jobs:
  imdf-source-gate:
    name: IMDF synthetic preflight denial tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Run offline fail-closed venue tests
        run: node --test scripts/imdf/venue-preflight.test.mjs
