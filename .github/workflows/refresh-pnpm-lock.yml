name: Refresh pnpm lock
on:
  push:
    branches:
      - knowledge-graph-authority-2026-10-03
permissions:
  contents: write
jobs:
  refresh-pnpm-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: knowledge-graph-authority-2026-10-03
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Regenerate pnpm lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit regenerated pnpm lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm dependency lock [skip ci]"
          git push
