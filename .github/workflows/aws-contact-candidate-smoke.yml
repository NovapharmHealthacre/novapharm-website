name: Verify AWS contact candidate remains safely disabled

on:
  pull_request:
    paths:
      - 'infra/aws/contact-production/**'
      - 'infra/aws/contact-production.json'
      - '.github/workflows/aws-contact-candidate-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployed candidate health and disabled submissions
        env:
          CANDIDATE_API: https://h4dc1e4u57.execute-api.eu-north-1.amazonaws.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --max-time 15 \
            -H 'Cache-Control: no-cache' "$CANDIDATE_API/health" > health.json
          jq -e '.service == "novapharm-contact-intake" and .environment == "production" and .ready == false and .acceptingPublicSubmissions == false' health.json
          status=$(curl --silent --show-error --max-time 15 -o rejection.json -w '%{http_code}' \
            -X POST "$CANDIDATE_API/contact" -H 'Origin: https://novapharmhealthcare.com' \
            -H 'Content-Type: application/json' -H 'X-Novapharm-Intake: v1' --data '{}')
          test "$status" = '503'
          jq -e '.error == "Secure business enquiry intake is not yet activated"' rejection.json
          echo 'Verified: AWS candidate endpoint online, public intake still disabled. No customer submission was sent.'
