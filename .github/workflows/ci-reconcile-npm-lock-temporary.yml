name: Temporary npm lockfile reconciliation (read-only)
on:
  pull_request:
    paths:
      - ".github/workflows/ci-reconcile-npm-lock-temporary.yml"
permissions:
  contents: read
concurrency:
  group: lock-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generate:
    if: github.event.pull_request.number == 1331
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Canonically resolve checked-in npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify immutable lockfile installs
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Emit exact machine-reconcilable lockfile diff
        shell: bash
        run: |
          echo 'BEGIN_NP_NPM_LOCK_DIFF'
          git diff --no-ext-diff --unified=3 -- package-lock.json
          echo 'END_NP_NPM_LOCK_DIFF'
