name: Intelligence private source-rights signature acceptance
on:
  pull_request:
    paths:
      - 'src/core/intelligence-private-rights-signature.mjs'
      - 'scripts/test-intelligence-private-rights-signature.mjs'
      - 'docs/intelligence/PRIVATE_SOURCE_RIGHTS_SIGNATURE_ACCEPTANCE_20261114.md'
      - '.github/workflows/intelligence-private-source-rights-signature.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/intelligence-private-rights-signature.mjs'
      - 'scripts/test-intelligence-private-rights-signature.mjs'
      - '.github/workflows/intelligence-private-source-rights-signature.yml'
permissions:
  contents: read
jobs:
  independent-rights-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Deny unsigned, stale, revoked or self-attested private source grants
        run: node --test scripts/test-intelligence-private-rights-signature.mjs
