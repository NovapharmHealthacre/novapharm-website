name: WMS commerce product master
on:
  pull_request:
    paths:
      - 'src/core/wms-commerce-product-master.mjs'
      - 'scripts/test-wms-commerce-product-master.mjs'
      - 'src/content/approved-consumer-catalogue.json'
      - 'src/content/connective-consumer-research.json'
      - 'assets/data/nutraxin-retail-catalogue.json'
      - 'assets/data/esco-catalogue.json'
      - '.github/workflows/wms-commerce-product-master.yml'
permissions:
  contents: read
jobs:
  catalogue-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node scripts/test-wms-commerce-product-master.mjs
