name: Intelligence isolated private network foundation

on:
  pull_request:
    paths:
      - 'infra/aws/intelligence-isolated-vpc-foundation.json'
      - 'scripts/test-intelligence-private-network.mjs'
      - '.github/workflows/intelligence-private-network-foundation.yml'

permissions:
  contents: read

jobs:
  safe-network-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Prove no NAT, billable compute, public service or private default route
        run: node --test scripts/test-intelligence-private-network.mjs
      - name: Preserve enterprise source-rights and release gates
        run: npm run intelligence:requirements:validate
