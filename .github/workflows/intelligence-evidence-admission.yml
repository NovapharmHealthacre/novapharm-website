name: Intelligence evidence admission
on:
  pull_request:
    paths:
      - src/core/medicine-evidence-admission.mjs
      - scripts/test-medicine-evidence-admission.mjs
      - .github/workflows/intelligence-evidence-admission.yml
      - docs/intelligence/EVIDENCE_G1_ADMISSION.md
  push:
    branches: [main]
    paths:
      - src/core/medicine-evidence-admission.mjs
      - scripts/test-medicine-evidence-admission.mjs
      - .github/workflows/intelligence-evidence-admission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check node runtime
        run: node --version
      - name: Run evidence admission regression suite
        run: node --test scripts/test-medicine-evidence-admission.mjs
