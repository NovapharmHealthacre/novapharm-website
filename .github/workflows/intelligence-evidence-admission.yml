name: Intelligence evidence admission
on:
  pull_request:
    paths:
      - 'src/core/medicine-evidence-admission.mjs'
      - 'src/core/medicine-evidence-atomic-admission.mjs'
      - 'scripts/test-medicine-evidence-admission.mjs'
      - 'scripts/test-medicine-evidence-atomic-admission.mjs'
      - '.github/workflows/intelligence-evidence-admission.yml'
      - 'docs/intelligence/EVIDENCE_G1_ADMISSION.md'
      - 'docs/intelligence/PRIVATE_MEDICINE_ADMISSION_RELEASE_GATE_20261113.md'
  push:
    branches: [main]
    paths:
      - 'src/core/medicine-evidence-admission.mjs'
      - 'src/core/medicine-evidence-atomic-admission.mjs'
      - 'scripts/test-medicine-evidence-admission.mjs'
      - 'scripts/test-medicine-evidence-atomic-admission.mjs'
      - '.github/workflows/intelligence-evidence-admission.yml'
      - 'docs/intelligence/EVIDENCE_G1_ADMISSION.md'
      - 'docs/intelligence/PRIVATE_MEDICINE_ADMISSION_RELEASE_GATE_20261113.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Verify G1 source candidate and G2 private atomic admission contracts
        run: node --test scripts/test-medicine-evidence-admission.mjs scripts/test-medicine-evidence-atomic-admission.mjs
