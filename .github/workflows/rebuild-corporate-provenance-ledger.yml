name: Rebuild corporate source-rights ledger on candidate branch
on:
  push:
    branches:
      - fix/corporate-inventory-readiness-20261111
    paths:
      - .github/workflows/rebuild-corporate-provenance-ledger.yml
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Regenerate and check authoritative evidence with existing gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "fix/corporate-inventory-readiness-20261111"
          npm ci --ignore-scripts
          npm run images:inventory
          npm run images:inventory:validate
          npm run post-pr53:validate
          git diff --check
          test "$(git diff --name-only)" = "audit/generated/image-inventory.json"
          git add audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Evidence ledger already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(evidence): reconcile approved generated-image source lineage"
          git push origin HEAD:refs/heads/fix/corporate-inventory-readiness-20261111
