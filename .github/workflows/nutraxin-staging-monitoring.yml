name: Nutraxin customer staging monitoring contract
on:
  pull_request:
    paths:
      - 'infra/aws/nutraxin-customer-staging-monitoring.json'
      - 'scripts/aws/nutraxin-staging-monitoring.test.mjs'
      - '.github/workflows/nutraxin-staging-monitoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Enforce staging-only alarm safety
        run: node --test scripts/aws/nutraxin-staging-monitoring.test.mjs
