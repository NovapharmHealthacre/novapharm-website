name: Reconcile integrated brand image evidence (source-only)

on:
  push:
    branches:
      - integrate/brand-corporate-identity-20261123
    paths:
      - '.github/workflows/reconcile-integrated-brand-image-inventory.yml'

permissions:
  contents: read

concurrency:
  group: integrated-brand-image-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-exact-head:
    if: github.repository == 'NovapharmHealthacre/novapharm-website' && github.actor == 'NovapharmHealthacre'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out exact integrated review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integrate/brand-corporate-identity-20261123
          persist-credentials: true
          fetch-depth: 1
      - name: Fail closed on stale source, branch, or foreign repository
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "NovapharmHealthacre/novapharm-website"
          test "$GITHUB_REF" = "refs/heads/integrate/brand-corporate-identity-20261123"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/integrate/brand-corporate-identity-20261123 | cut -f1)" = "$GITHUB_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Regenerate only the governed source inventory
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          git add -- audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Governed image inventory already matches exact source; no commit."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "audit/generated/image-inventory.json"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/integrate/brand-corporate-identity-20261123 | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(evidence): regenerate integrated branding image inventory from exact source"
          git push origin HEAD:refs/heads/integrate/brand-corporate-identity-20261123
