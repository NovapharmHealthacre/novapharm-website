name: Reconcile Intelligence pricing image inventory on feature branch

on:
  push:
    branches:
      - feat/intelligence-pricing-public-20261109
    paths:
      - '.github/workflows/intelligence-pricing-inventory-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  authoritative-inventory:
    if: github.repository == 'NovapharmHealthacre/novapharm-website' && github.ref == 'refs/heads/feat/intelligence-pricing-public-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          ref: feat/intelligence-pricing-public-20261109
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependency graph without mutable upgrades
        run: npm ci --ignore-scripts
      - name: Recalculate full image provenance using the canonical audited generator
        run: npm run images:inventory
      - name: Commit only regenerated inventory when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- audit/generated/image-inventory.json; then
            echo "Image inventory was already current."
            exit 0
          fi
          git status --short
          unexpected=$(git diff --name-only -- . ':(exclude)audit/generated/image-inventory.json')
          if [ -n "$unexpected" ]; then
            echo "::error::Inventory process changed unexpected tracked paths: $unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audit/generated/image-inventory.json
          git commit -m "chore(intelligence): regenerate authoritative media usage inventory"
          git push origin HEAD:feat/intelligence-pricing-public-20261109
          echo "Rebuilt deterministic image inventory on feature branch. Release PR checks will rerun at new SHA."
