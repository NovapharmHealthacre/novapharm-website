name: Intelligence subscriptions and tenancy fail-closed contract

on:
  pull_request:
    paths:
      - 'src/core/intelligence-subscription-entitlements.mjs'
      - 'src/core/intelligence-customer-access.mjs'
      - 'infra/aws/intelligence-customer-authorizer.py'
      - 'scripts/build-intelligence-customer-authorizer-template.mjs'
      - 'scripts/test-intelligence-customer-authorizer-template.mjs'
      - 'scripts/test_intelligence_customer_authorizer.py'
      - 'scripts/test-intelligence-customer-access.mjs'
      - 'infra/aws/intelligence-customer-access-ledger-production.json'
      - 'scripts/test-intelligence-subscription-entitlements.mjs'
      - 'src/core/intelligence-billing-events.mjs'
      - 'scripts/test-intelligence-billing-events.mjs'
      - 'package.json'
      - '.github/workflows/intelligence-subscription-boundary.yml'

permissions:
  contents: read

jobs:
  verify-entitlements:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify revocable sessions, tenant isolation and approved seats
        run: node --test scripts/test-intelligence-customer-access.mjs
      - name: Reproduce reviewed least-privilege private authorizer infrastructure
        run: node --test scripts/test-intelligence-customer-authorizer-template.mjs
      - name: Verify the DynamoDB private production authorizer denies bypasses
        run: python3 -m unittest scripts/test_intelligence_customer_authorizer.py
      - name: Verify denied-by-default subscription access and same-tenant MFA
        run: node --test scripts/test-intelligence-subscription-entitlements.mjs
      - name: Assert signed Billing webhook idempotency, tenant binding and no premature grants
        run: node --test scripts/test-intelligence-billing-events.mjs
      - name: Preserve exact medicine and clinical evidence contracts
        run: npm run test:medicines-intelligence
      - name: Verify the enterprise release ledger remains gated
        run: npm run intelligence:requirements:validate
