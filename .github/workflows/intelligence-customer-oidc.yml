name: Intelligence production customer OIDC identity boundary

on:
  pull_request:
    paths:
      - 'src/core/intelligence-customer-oidc.mjs'
      - 'src/core/intelligence-founder-totp-enrolment.mjs'
      - 'src/core/intelligence-founder-managed-mfa-compat.mjs'
      - 'src/core/intelligence-founder-managed-mfa-compat.d.mts'
      - 'src/core/intelligence-customer-oidc.d.mts'
      - 'apps/portal/app/auth/callback/route.ts'
      - 'apps/portal/app/auth/mfa/setup/route.ts'
      - 'scripts/test-intelligence-customer-oidc.mjs'
      - 'scripts/test-intelligence-founder-totp-enrolment.mjs'
      - 'scripts/test-intelligence-founder-managed-mfa-compat.mjs'
      - 'apps/portal/test/intelligence-customer-oidc-web.test.ts'
      - '.github/workflows/intelligence-customer-oidc.yml'

permissions:
  contents: read

jobs:
  verify-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify PKCE, HMAC transaction, signed Cognito claims and denial of tenant access
        run: |
          node --check src/core/intelligence-customer-oidc.mjs
          node --check src/core/intelligence-founder-totp-enrolment.mjs
          node --check src/core/intelligence-founder-managed-mfa-compat.mjs
          node --test scripts/test-intelligence-customer-oidc.mjs scripts/test-intelligence-founder-totp-enrolment.mjs scripts/test-intelligence-founder-managed-mfa-compat.mjs
      - name: Preserve enterprise release evidence
        run: npm run intelligence:requirements:validate
