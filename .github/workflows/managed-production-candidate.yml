name: Managed production candidate (suspended until AWS acceptance)

on:
  workflow_run:
    workflows: ["Production readiness"]
    types: [completed]

permissions:
  contents: read

jobs:
  migration-hold:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, '[managed-production-candidate]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record migration cutover hold, without dispatching Azure or AWS
        run: |
          echo "::notice::Automatic managed deployment is suspended during NovaPharm's Azure-to-AWS migration."
          echo "Use the reviewed manual AWS staging workflow after project, cost and security approvals."
          echo "No infrastructure, DNS, application credentials or production content changed."
