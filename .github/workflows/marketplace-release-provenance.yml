name: Marketplace final release source provenance

on:
  pull_request:
    paths:
      - scripts/marketplace-release-provenance.mjs
      - scripts/stamp-public-release-provenance.mjs
      - scripts/test-marketplace-release-provenance.mjs
      - scripts/build-site.mjs
      - .github/workflows/marketplace-release-provenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace-final-provenance:
    name: Validate final post-build Marketplace source SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate source and execute idempotent stamping tests
        run: |
          node --check scripts/stamp-public-release-provenance.mjs
          node --test scripts/test-marketplace-release-provenance.mjs
