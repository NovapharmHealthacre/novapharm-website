name: Intelligence isolated production image candidate

on:
  pull_request:
    paths:
      - 'deployment/aws/Dockerfile.intelligence'
      - 'scripts/test-intelligence-production-image-candidate.mjs'
      - '.github/workflows/intelligence-production-image-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Enforce private candidate and source-labelled no-secret image contract
        run: node --test scripts/test-intelligence-production-image-candidate.mjs
      - name: Build complete source-identified Next.js runtime without publishing
        run: |
          set -euo pipefail
          docker build --pull --file deployment/aws/Dockerfile.intelligence \
            --build-arg SOURCE_SHA="$GITHUB_SHA" \
            --tag novapharm-intelligence:private-candidate .
          test "$(docker image inspect novapharm-intelligence:private-candidate --format '{{index .Config.Labels "novapharm.release-gate"}}')" = "production-candidate-not-approved"
          test "$(docker image inspect novapharm-intelligence:private-candidate --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          echo 'Candidate built and labelled; NOT pushed to ECR and no production service activated.'
