name: Intelligence FDA NDC quarantine graph
on:
  pull_request:
    paths:
      - 'src/core/intelligence-openfda-ndc-quarantine-graph.mjs'
      - 'scripts/test-intelligence-openfda-ndc-quarantine-graph.mjs'
      - '.github/workflows/intelligence-openfda-ndc-quarantine-graph.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/intelligence-openfda-ndc-quarantine-graph.mjs'
      - 'scripts/test-intelligence-openfda-ndc-quarantine-graph.mjs'
      - '.github/workflows/intelligence-openfda-ndc-quarantine-graph.yml'
permissions:
  contents: read
jobs:
  quarantine-product-pack-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node --test scripts/test-intelligence-openfda-ndc-quarantine-graph.mjs
