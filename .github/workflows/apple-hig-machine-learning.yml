name: Apple HIG machine learning and Nova ML boundaries

on:
  pull_request:
    paths:
      - "apps/portal/data/nova-ml-modules.ts"
      - "apps/portal/data/routes.ts"
      - "apps/portal/components/nova-ml-workspaces.tsx"
      - "apps/portal/components/nova-ml-workspaces.module.css"
      - "apps/portal/components/medicines-intelligence.tsx"
      - "native/novapharm-intelligence-apple/**"
      - "docs/design/novapharm-apple-machine-learning-adaptation-20261116.md"
      - "scripts/test-nova-ml-apple-adaptation.mjs"
      - ".github/workflows/apple-hig-machine-learning.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "apps/portal/data/nova-ml-modules.ts"
      - "apps/portal/data/routes.ts"
      - "apps/portal/components/nova-ml-workspaces.tsx"
      - "apps/portal/components/nova-ml-workspaces.module.css"
      - "apps/portal/components/medicines-intelligence.tsx"
      - "native/novapharm-intelligence-apple/**"
      - "docs/design/novapharm-apple-machine-learning-adaptation-20261116.md"
      - "scripts/test-nova-ml-apple-adaptation.mjs"
      - ".github/workflows/apple-hig-machine-learning.yml"

permissions:
  contents: read

jobs:
  verify-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify Nova ML source, protected routes and no false activation
        run: node --test scripts/test-nova-ml-apple-adaptation.mjs
      - name: Record native test limitation
        run: echo "Apple Swift frameworks require separate macOS/Xcode/device validation; this Linux job does not certify native build or deployment."
