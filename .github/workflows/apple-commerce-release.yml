name: Apple IAP brand and commerce prelaunch hold
on:
  pull_request:
    paths:
      - "config/apple-commerce-release.json"
      - "config/apple-marketing-release.json"
      - "config/intelligence/owner-production-constraints.json"
      - "scripts/test-apple-commerce-release.mjs"
      - "scripts/test-apple-commerce-classification.mjs"
      - "src/core/apple-commerce-classification.mjs"
      - ".github/workflows/apple-commerce-release.yml"
  push:
    branches: [main]
    paths:
      - "config/apple-commerce-release.json"
      - "config/apple-marketing-release.json"
      - "config/intelligence/owner-production-constraints.json"
      - "scripts/test-apple-commerce-release.mjs"
      - ".github/workflows/apple-commerce-release.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify fail-closed Apple commerce and brand policy
        run: node scripts/test-apple-commerce-release.mjs && node --test scripts/test-apple-commerce-classification.mjs
