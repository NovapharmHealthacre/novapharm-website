name: NOVA governed model egress contract

on:
  pull_request:
    paths:
      - 'src/core/ai/provider-openai-zdr.mjs'
      - 'src/core/ai/redaction-service.mjs'
      - 'scripts/test-nova-openai-zdr.mjs'
      - 'src/core/ai/nova-governed-medicine-answer.mjs'
      - 'scripts/test-nova-governed-medicine-answer.mjs'
      - 'package.json'
      - '.github/workflows/intelligence-nova-egress-contract.yml'

permissions:
  contents: read

# PR-only supersession prevents stale commits competing for runner slots.
# Each main push and manual dispatch has a unique group: no cancellation there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controlled-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Assert source rights, no secrets, zero unexpected provider calls and no storage
        run: npm run test:internal-ai
      - name: Verify production NOVA and source rights remain gated
        run: npm run intelligence:requirements:validate
