name: Connective brand catalogue identity discovery
on:
  pull_request:
    paths:
      - "scripts/discover-connective-candidates.py"
      - ".github/workflows/connective-brand-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Discover public supplier product references
        run: python3 scripts/discover-connective-candidates.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connective-brand-discovery
          path: review-output/connective-discovery/
          retention-days: 7
          if-no-files-found: error
