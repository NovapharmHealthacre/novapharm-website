name: Phoenix security remediation candidate (no merge or deployment)

on:
  push:
    branches:
      - codex/phoenix-security-remediation-20261106
    paths:
      - .github/workflows/phoenix-remediate-deps.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phoenix-dependency-remediation
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'NovapharmHealthacre/novapharm-website' && github.ref == 'refs/heads/codex/phoenix-security-remediation-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Apply exact production dependency repairs
        run: |
          set -euo pipefail
          node scripts/security/refresh-production-deps.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          # Resolve remaining transitive advisory versions without force or major-version jumps.
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts --no-fund
      - name: Record real dependency audit and enforce release boundary
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/phoenix-dependency-audit.log
      - name: Commit patched source manifests and resolved exact lockfile to isolated candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/corporate/package.json apps/founder/package.json apps/portal/package.json apps/status/package.json apps/technology/package.json
          if git diff --cached --quiet; then
            echo "No changes needed; no commit created."
          else
            git commit -m "fix(security): upgrade vulnerable production dependencies and lockfile"
            git push origin HEAD:codex/phoenix-security-remediation-20261106
          fi
      - name: Verify application and regression tests
        run: npm run check
      - name: Preserve dependency audit even on failed audit or tests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phoenix-production-dependency-audit
          path: /tmp/phoenix-dependency-audit.log
          if-no-files-found: warn
          retention-days: 7
