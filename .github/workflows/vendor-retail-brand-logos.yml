name: Vendor reviewed brand marks for retail grid

on:
  pull_request:
    paths:
      - docs/retail/brand-logo-source-register-20261127.json
      - .github/workflows/vendor-retail-brand-logos.yml
      - scripts/vendor-retail-brand-logos.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-original-assets:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/official-brand-logo-grid-bdb3a07'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true
      - name: Copy original sources only
        run: python3 scripts/vendor-retail-brand-logos.py
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Validate decoded originals and refresh image inventory
        run: |
          npm ci --ignore-scripts
          node --input-type=module -e 'import sharp from "sharp";import fs from "node:fs";for(const file of fs.readdirSync("assets/media/brands").filter(x=>/\.(png|jpg)$/.test(x))){const img=sharp("assets/media/brands/"+file);const meta=await img.metadata();if(!meta.width||!meta.height||meta.width<20||meta.height<20||meta.width>4096||meta.height>4096)throw Error("Invalid dimensions: "+file);await img.raw().toBuffer()}'
          npm run images:inventory
      - name: Commit eight locally hosted marks into this PR branch
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/brands/ docs/retail/brand-logo-source-register-20261127.json audit/generated/image-inventory.json
          git diff --cached --quiet && exit 0
          git commit -m "Vendor verified eight original retail brand marks"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
