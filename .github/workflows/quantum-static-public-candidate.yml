name: Quantum static public Pages candidate safety
on:
  pull_request:
    paths:
      - 'quantum-research/index.html'
      - 'assets/css/quantum-research.css'
      - 'scripts/test-quantum-static-public-candidate.mjs'
      - 'scripts/stage-pages-artifact.mjs'
      - 'scripts/finalize-public-rtl.mjs'
      - 'scripts/stamp-public-release-provenance.mjs'
      - 'docs/intelligence/quantum-research-program-v1.json'
      - '.github/workflows/quantum-static-public-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node --test scripts/test-quantum-static-public-candidate.mjs
      - run: node --check scripts/stage-pages-artifact.mjs
      - run: node --check scripts/stamp-public-release-provenance.mjs
