name: MongoDB Atlas release truth contract

on:
  pull_request:
    paths:
      - 'src/data/atlas-release-truth.mjs'
      - 'scripts/test-atlas-release-truth.mjs'
      - '.github/workflows/mongodb-atlas-release-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assess-atlas-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate fail-closed Atlas readiness contract
        run: |
          node --check src/data/atlas-release-truth.mjs
          node --test scripts/test-atlas-release-truth.mjs
