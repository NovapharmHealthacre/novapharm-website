name: MongoDB Atlas release truth contract

on:
  pull_request:
    paths:
      - 'src/data/atlas-release-truth.mjs'
      - 'scripts/test-atlas-release-truth.mjs'
      - '.github/workflows/mongodb-atlas-release-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assess-atlas-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate fail-closed Atlas readiness contract
        run: |
          node --check src/data/atlas-release-truth.mjs
          node --test scripts/test-atlas-release-truth.mjs
