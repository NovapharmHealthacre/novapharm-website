name: Intelligence NHSBSA full-source private proof

on:
  pull_request:
    paths:
      - 'src/core/intelligence-epd-private-full-row-qa-proof.mjs'
      - 'scripts/test-intelligence-epd-private-full-row-qa-proof.mjs'
      - '.github/workflows/intelligence-epd-private-full-row-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-proof:
    name: Private full-row source QA consistency and no-promotion contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate source proof syntax
        run: |
          node --check src/core/intelligence-epd-private-full-row-qa-proof.mjs
          node --check scripts/test-intelligence-epd-private-full-row-qa-proof.mjs
      - name: Verify exact Aug 2026 NHSBSA private archive and row QA contracts
        run: node --test scripts/test-intelligence-epd-private-full-row-qa-proof.mjs
