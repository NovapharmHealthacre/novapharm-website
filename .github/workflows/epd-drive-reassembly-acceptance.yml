name: Governed NHSBSA EPD Drive reassembly acceptance

on:
  pull_request:
    paths:
      - 'tooling/python/reassemble_verified_epd_drive_parts.py'
      - 'tooling/python/test_reassemble_verified_epd_drive_parts.py'
      - 'tooling/python/verify_epd_zip_archive.py'
      - '.github/workflows/epd-drive-reassembly-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'tooling/python/reassemble_verified_epd_drive_parts.py'
      - 'tooling/python/test_reassemble_verified_epd_drive_parts.py'
      - 'tooling/python/verify_epd_zip_archive.py'
      - '.github/workflows/epd-drive-reassembly-acceptance.yml'

permissions:
  contents: read

jobs:
  offline-private-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify syntax and fail-closed private reassembly with synthetic bytes
        run: |
          python3 -m py_compile tooling/python/reassemble_verified_epd_drive_parts.py
          python3 -m unittest discover -s tooling/python -p 'test_reassemble_verified_epd_drive_parts.py' -v
      - name: Define the acceptance boundary
        run: |
          echo 'Synthetic transport integrity tests only.'
          echo 'No Drive source bytes transferred, AWS configured, Atlas data admitted, rights approved, or production released.'
