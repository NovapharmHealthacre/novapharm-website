name: One-time About image provenance reconciliation

on:
  push:
    branches: [design/about-approved-editorial-20261110]
    paths:
      - .github/workflows/about-image-inventory.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate and validate the exact image inventory
        run: |
          set -euo pipefail
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
      - name: Record evidence on approved design branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "design/about-approved-editorial-20261110"
          git add audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(media): reconcile approved About photo inventory"
          git push origin HEAD:refs/heads/design/about-approved-editorial-20261110
