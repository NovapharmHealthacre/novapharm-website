name: Intelligence source snapshot quarantine

on:
  pull_request:
    paths:
      - 'src/core/intelligence-source-snapshot-quarantine.mjs'
      - 'scripts/test-intelligence-source-snapshot-quarantine.mjs'
      - '.github/workflows/intelligence-source-snapshot-quarantine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-quarantine:
    name: Validate immutable sample manifests and denial of data publication
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Syntax and fail-closed tests
        run: |
          node --check src/core/intelligence-source-snapshot-quarantine.mjs
          node --check scripts/test-intelligence-source-snapshot-quarantine.mjs
          node --test scripts/test-intelligence-source-snapshot-quarantine.mjs
