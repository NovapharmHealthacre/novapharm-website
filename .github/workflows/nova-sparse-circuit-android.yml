name: NovaPharm Android sparse-circuit research build

on:
  pull_request:
    paths:
      - "native/novapharm-intelligence-android/**"
      - ".github/workflows/nova-sparse-circuit-android.yml"
  push:
    branches: [main]
    paths:
      - "native/novapharm-intelligence-android/**"
      - ".github/workflows/nova-sparse-circuit-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-research:
    name: Build offline Android research shell and denial tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          gradle-version: "8.9"
      - name: Check Android SDK availability
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Build debug-only research shell and run security denial unit tests
        working-directory: native/novapharm-intelligence-android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Preserve debug APK integrity receipt for private device QA
        working-directory: native/novapharm-intelligence-android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
          test -s app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload non-production Android debug APK and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-android-research-debug-${{ github.sha }}
          path: |
            native/novapharm-intelligence-android/app/build/outputs/apk/debug/app-debug.apk
            native/novapharm-intelligence-android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Reaffirm release boundary
        run: echo "CI debug APK is not a release-signed production NovaPharm app, commercial release or connected model service."
