name: NovaPharm Android sparse-circuit research build

on:
  pull_request:
    paths:
      - "native/novapharm-intelligence-android/**"
      - ".github/workflows/nova-sparse-circuit-android.yml"
  push:
    branches: [main]
    paths:
      - "native/novapharm-intelligence-android/**"
      - ".github/workflows/nova-sparse-circuit-android.yml"

permissions:
  contents: read

jobs:
  android-research:
    name: Build offline Android research shell and denial tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          gradle-version: "8.9"
      - name: Check Android SDK availability
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Build debug-only research shell and run security denial unit tests
        working-directory: native/novapharm-intelligence-android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Reaffirm release boundary
        run: echo "CI debug APK is not a signed production NovaPharm app, commercial release or connected model service."
