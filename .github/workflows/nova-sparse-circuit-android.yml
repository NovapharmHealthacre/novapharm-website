name: NovaPharm Android sparse-circuit research build

on:
  pull_request:
    paths:
      - "native/novapharm-intelligence-android/**"
      - ".github/workflows/nova-sparse-circuit-android.yml"
  push:
    branches: [main]
    paths:
      - "native/novapharm-intelligence-android/**"
      - ".github/workflows/nova-sparse-circuit-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-research:
    name: Build offline Android research shell and denial tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # allow exact source head vs. tested PR-merge parent verification
      - name: Record tested source and checkout provenance
        env:
          NOVAPHARM_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          test "$checkout_sha" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            set -- $(git show -s --format=%P HEAD)
            if [ "$#" -ne 2 ] || [ "$2" != "$NOVAPHARM_PR_HEAD_SHA" ]; then
              echo "::error::Pull-request source SHA does not match tested merge commit"
              exit 1
            fi
          else
            test "$checkout_sha" = "$NOVAPHARM_PR_HEAD_SHA"
          fi
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'pr_head_sha=%s\n' "$NOVAPHARM_PR_HEAD_SHA"
            printf 'tested_checkout_sha=%s\n' "$checkout_sha"
            printf 'tested_tree_sha=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'artifact_class=android-debug-only\n'
            printf 'production_release=not_authorized\n'
          } > "$RUNNER_TEMP/novapharm-android-test-provenance.txt"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.9"
      - name: Check Android SDK and build-tool availability
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35"
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0"
          fi
      - name: Build research shell and run denial unit tests
        working-directory: native/novapharm-intelligence-android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Inspect and checksum private debug APK
        run: |
          set -euo pipefail
          apk="native/novapharm-intelligence-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/novapharm-apk-entries.txt"
          grep -Fx "AndroidManifest.xml" "$RUNNER_TEMP/novapharm-apk-entries.txt"
          grep -Fx "classes.dex" "$RUNNER_TEMP/novapharm-apk-entries.txt"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/novapharm-apk-badging.txt"
          grep -F "package: name='com.novapharm.intelligence.research'" "$RUNNER_TEMP/novapharm-apk-badging.txt"
          "$aapt" dump permissions "$apk" > "$RUNNER_TEMP/novapharm-apk-permissions.txt"
          # This read-only offline research shell intentionally declares NO
          # Android permissions, not merely none from a sensitive shortlist.
          # Inspect the compiled APK, since manifest-merging can add permissions
          # even when the source AndroidManifest.xml declares none.
          if grep -E 'uses-permission' "$RUNNER_TEMP/novapharm-apk-permissions.txt"; then
            echo "::error::Unexpected permission in compiled offline research APK"
            exit 1
          fi
          sha256sum "$apk" > "native/novapharm-intelligence-android/app/build/outputs/apk/debug/app-debug.sha256"
      - name: Upload debug APK only from private repositories
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-android-research-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            native/novapharm-intelligence-android/app/build/outputs/apk/debug/app-debug.apk
            native/novapharm-intelligence-android/app/build/outputs/apk/debug/app-debug.sha256
            ${{ runner.temp }}/novapharm-android-test-provenance.txt
          if-no-files-found: error
          retention-days: 7
      - name: Do not publish debug APK from public repository
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::notice::Public repository: APK artifact upload suppressed. Use approved private QA storage."
      - name: Reaffirm debug release boundary
        run: echo "Research debug APK only. Not a release-signed production app, Play Store release or connected medicine service."
