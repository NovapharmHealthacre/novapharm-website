name: Nutraxin branch image inventory reconciliation (isolated)
on:
  push:
    branches:
      - growth/nutraxin-19sku-search-service-20261123
    paths:
      - '.github/workflows/nutraxin-image-inventory-reconcile.yml'
      - 'legal/returns/index.html'
      - 'products/nutraxin/**'
      - 'scripts/generate-nutraxin-shopping.mjs'
      - 'scripts/apply-corporate-product-discipline.mjs'
      - 'assets/data/nutraxin-uk-search-intents.json'

permissions:
  contents: read

concurrency:
  group: nutraxin-image-reconcile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'NovapharmHealthacre/novapharm-website' && github.ref == 'refs/heads/growth/nutraxin-19sku-search-service-20261123' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout exact Nutraxin draft source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: growth/nutraxin-19sku-search-service-20261123
          fetch-depth: 1
          persist-credentials: true
      - name: Reject stale or cross-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/growth/nutraxin-19sku-search-service-20261123"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/growth/nutraxin-19sku-search-service-20261123 | cut -f1)" = "$GITHUB_SHA"
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Regenerate source-derived image inventory
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          git diff --stat -- audit/generated/image-inventory.json
      - name: Commit only the governed inventory to the isolated draft
        shell: bash
        run: |
          set -euo pipefail
          git add -- audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Inventory already current."
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/growth/nutraxin-19sku-search-service-20261123 | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(nutraxin): reconcile source-derived image inventory"
          git push origin HEAD:refs/heads/growth/nutraxin-19sku-search-service-20261123
