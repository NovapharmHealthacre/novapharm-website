name: ChatGPT UK retail feed policy gate

on:
  pull_request:
    paths:
      - .github/workflows/chatgpt-uk-feed.yml
      - scripts/build-chatgpt-uk-feed.mjs
      - scripts/test-chatgpt-uk-feed.mjs
      - scripts/stage-pages-artifact.mjs
      - src/content/approved-consumer-catalogue.json
      - src/content/chatgpt-uk-verified-offers.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify policy-gated ChatGPT feed
        run: |
          node --check scripts/build-chatgpt-uk-feed.mjs
          node --check scripts/test-chatgpt-uk-feed.mjs
          node --test scripts/test-chatgpt-uk-feed.mjs
          node scripts/build-chatgpt-uk-feed.mjs
