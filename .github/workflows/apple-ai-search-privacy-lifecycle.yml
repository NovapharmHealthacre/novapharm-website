name: Apple AI search privacy and lifecycle acceptance

on:
  pull_request:
    paths:
      - "src/ai/search-controller.mjs"
      - "src/ai/privacy-guard.mjs"
      - "scripts/test-apple-ai-search-lifecycle.mjs"
      - "scripts/test-apple-ai-search-behavior.mjs"
      - "docs/design/apple-ai-generative-ml-privacy-audit-20261119.md"
      - ".github/workflows/apple-ai-search-privacy-lifecycle.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Syntax and Apple privacy lifecycle regression
        run: |
          node --check src/ai/search-controller.mjs
          node --test scripts/test-apple-ai-search-lifecycle.mjs scripts/test-apple-ai-search-behavior.mjs
          node scripts/test-ai-policy.mjs
          node scripts/test-ai-privacy.mjs
