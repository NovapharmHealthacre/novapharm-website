name: AWS managed public image candidate source contract
on:
  pull_request:
    paths:
      - deployment/aws/Dockerfile.managed-public
      - deployment/aws/buildspec-managed-public-candidates.yml
      - scripts/test-managed-public-aws-candidates.mjs
      - docs/programme/aws-managed-public-image-candidates.md
      - .github/workflows/aws-managed-public-candidate-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify nonproduction AWS managed-app build boundary
        run: node --test scripts/test-managed-public-aws-candidates.mjs
