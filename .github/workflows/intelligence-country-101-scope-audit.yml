name: Intelligence 101 distinct country research-scope audit (non-publishable)

on:
  pull_request:
    paths:
      - 'docs/intelligence/global-pharma-sources-20261117.json'
      - 'docs/intelligence/country-101-scope-proposal-20261118.json'
      - 'docs/intelligence/country-101-scope-proposal-20261118.md'
      - 'scripts/test-intelligence-country-101-scope-proposal.mjs'
      - 'src/core/intelligence-country-101-proposed-ledger.mjs'
      - 'scripts/test-intelligence-country-101-proposed-ledger.mjs'
      - 'scripts/render-intelligence-country-101-proposed-ledger.mjs'
      - 'scripts/aws/contact-release-routing.test.mjs'
      - '.github/workflows/dispatch-approved-aws-contact-release.yml'
      - '.github/workflows/publish-aws-contact-production.yml'
      - '.github/workflows/intelligence-country-101-scope-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proposal-evidence-only:
    name: Validate 77 existing + 24 proposed country scopes without activation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Syntax and negative-test country/source distinction
        run: |
          node --check src/core/intelligence-country-101-proposed-ledger.mjs
          node --check scripts/test-intelligence-country-101-proposed-ledger.mjs
          node --check scripts/render-intelligence-country-101-proposed-ledger.mjs
          node --check scripts/test-intelligence-country-101-scope-proposal.mjs
          node --check scripts/aws/contact-release-routing.test.mjs
          node --test scripts/test-intelligence-country-101-scope-proposal.mjs scripts/test-intelligence-country-101-proposed-ledger.mjs scripts/aws/contact-release-routing.test.mjs
          node scripts/render-intelligence-country-101-proposed-ledger.mjs --json > /tmp/npi-101-country-proposed-ledger.json
          node scripts/render-intelligence-country-101-proposed-ledger.mjs --markdown > /tmp/npi-101-country-proposed-ledger.md
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const x=JSON.parse(readFileSync("/tmp/npi-101-country-proposed-ledger.json","utf8")); if(x.distinctNationalCountries!==101||x.verifiedCustomerLiveCountries!==0||x.nationalCountriesWithNoRegisteredDataSource!==24) process.exit(1);'
