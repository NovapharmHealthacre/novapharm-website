name: Production readiness

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: novapharm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Enforce no-email production publication contract
        run: node --test scripts/test-no-email-release-guard.mjs
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies and preserve evidence
        run: |
          mkdir -p /tmp/production-audit
          set +e
          npm audit --omit=dev --audit-level=high --json > /tmp/production-audit/npm-audit.json 2> /tmp/production-audit/npm-audit-stderr.log
          audit_exit=$?
          set -e
          printf 'npm audit exit code: %s\n' "$audit_exit" > /tmp/production-audit/exit-code.txt
          if [ ! -s /tmp/production-audit/npm-audit.json ] && [ "$audit_exit" -eq 0 ]; then
            echo "::error::Production audit returned an empty report"
            exit 1
          fi
          if [ "$audit_exit" -ne 0 ]; then
            echo "::error::Production npm audit failed (exit code $audit_exit); release blocked"
          fi
          exit "$audit_exit"
      - name: Upload production dependency audit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-dependency-audit
          path: /tmp/production-audit/
          if-no-files-found: warn
          retention-days: 7
      - name: Run production readiness suite
        id: readiness
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/production-readiness.log
      - name: Upload readiness diagnostics
        if: always() && steps.readiness.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-readiness-log
          path: /tmp/production-readiness.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce readiness result
        if: steps.readiness.outcome != 'success'
        run: exit 1
      - name: Build and boot-test six isolated Azure artifacts
        run: npm run azure:package && npm run azure:test-artifacts
