name: Intelligence enterprise source-readiness evidence

on:
  pull_request:
    paths:
      - 'src/core/intelligence-enterprise-readiness.mjs'
      - 'scripts/audit-intelligence-enterprise-readiness.mjs'
      - 'scripts/test-intelligence-enterprise-readiness.mjs'
      - 'docs/intelligence/global-pharma-sources-20261117.json'
      - 'config/intelligence/owner-production-constraints.json'
      - 'docs/ai-model-register.json'
      - '.github/workflows/intelligence-enterprise-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-readiness-evidence:
    name: Assert honest source/country readiness evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Validate source audit syntax and fail-closed tests
        run: |
          node --check src/core/intelligence-enterprise-readiness.mjs
          node --check scripts/audit-intelligence-enterprise-readiness.mjs
          node --test scripts/test-intelligence-enterprise-readiness.mjs
      - name: Generate source-only evidence without claiming release completion
        run: node scripts/audit-intelligence-enterprise-readiness.mjs --write-artifact > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intelligence-source-readiness-${{ github.sha }}
          path: artifacts/intelligence-enterprise-readiness.json
          if-no-files-found: error
          retention-days: 30
