name: Intelligence Lambda monitoring baseline

on:
  pull_request:
    paths:
      - 'infra/aws/intelligence-lambda-observability.json'
      - 'scripts/test-intelligence-lambda-observability.mjs'
      - '.github/workflows/intelligence-lambda-observability.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/intelligence-lambda-observability.json'
      - 'scripts/test-intelligence-lambda-observability.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify exact monitoring contract
        run: node --test scripts/test-intelligence-lambda-observability.mjs
