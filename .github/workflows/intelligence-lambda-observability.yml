name: Intelligence Lambda monitoring baseline

on:
  pull_request:
    paths:
      - 'infra/aws/intelligence-lambda-observability.json'
      - 'scripts/test-intelligence-lambda-observability.mjs'
      - '.github/workflows/intelligence-lambda-observability.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/intelligence-lambda-observability.json'
      - 'scripts/test-intelligence-lambda-observability.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Verify exact monitoring contract
        run: node --test scripts/test-intelligence-lambda-observability.mjs
