name: Stage 392-product Commerce + order-tracking restoration safely

on:
  pull_request:
    paths:
      - scripts/stage-safe-commerce-restoration.py
      - .github/workflows/stage-safe-commerce-restoration.yml
  push:
    branches: [main]
    paths:
      - scripts/stage-safe-commerce-restoration.py
      - .github/workflows/stage-safe-commerce-restoration.yml

permissions:
  contents: write

concurrency:
  group: novapharm-scoped-commerce-staging
  cancel-in-progress: false

jobs:
  stage-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Build approved source including combined product index and reference-only tracker
        run: |
          npm ci --ignore-scripts
          npm run build:public-only
          node scripts/stage-pages-artifact.mjs _site
      - name: Read current public production tree independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: published
          persist-credentials: ${{ github.event_name == 'push' }}
      - name: Reject private/order data and prevent all existing public file replacements
        run: python3 scripts/stage-safe-commerce-restoration.py
      - name: Archive sanitized staging audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commerce-392-scoped-restoration-${{ github.sha }}
          path: artifacts/commerce-restoration/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit to NON-LIVE candidate branch only after reviewed main merge
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          name="release/staged-commerce-$(git rev-parse --short=12 HEAD)-$GITHUB_RUN_ID"
          test "$(git -C published branch --show-current)" = "gh-pages"
          git -C published switch -c "$name"
          git -C published config user.name "NovaPharm Commerce Restoration Staging"
          git -C published config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C published add --all
          git -C published diff --cached --name-only > /tmp/commerce-changed
          test -s /tmp/commerce-changed
          while IFS= read -r f; do
            case "$f" in
              products/marketplace/index.html|products/track/index.html|assets/data/commerce-marketplace.json|assets/js/commerce-marketplace.js|assets/js/commerce-order-track.js|assets/css/commerce-marketplace.css|assets/css/commerce-order-track.css) ;;
              *) echo "::error::Unapproved public-site modification: $f"; exit 1 ;;
            esac
          done < /tmp/commerce-changed
          git -C published commit -m 'candidate: scoped 392-product discovery and reference-only order tracking'
          git -C published push origin "HEAD:refs/heads/$name"
          echo "STAGED_COMMERCE_ONLY $name. Live site unchanged."
