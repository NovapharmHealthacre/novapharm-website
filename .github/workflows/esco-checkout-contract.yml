name: ESCO protected Stripe checkout contracts
on:
  pull_request:
    paths:
      - 'apps/esco-checkout/**'
      - 'infra/aws/esco-products-checkout-production.json'
      - 'assets/js/esco-bag.js'
      - 'scripts/apply-esco-catalogue.mjs'
      - 'scripts/test-esco-catalogue.mjs'
      - '.github/workflows/esco-checkout-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  esco-payment-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@4d0d45307e7c59b7cdb235f01671bb6c1a98f8a0
        with:
          python-version: '3.12'
      - name: Install AWS SDK only for isolated unit tests
        run: python3 -m pip install 'boto3>=1.34,<2'
      - name: Check checkout and webhook syntax
        run: python3 -m py_compile apps/esco-checkout/index.py
      - name: Verify fail-closed checkout, signature, price and legal controls
        run: python3 -m unittest discover -s apps/esco-checkout -p test_checkout.py -v
      - name: Verify checkout IaC is separate from Nutraxin
        run: |
          python3 - <<'PY'
          import json,pathlib
          src=pathlib.Path('apps/esco-checkout/index.py').read_text()
          infra=json.loads(pathlib.Path('infra/aws/esco-products-checkout-production.json').read_text())
          assert infra['Resources']['CheckoutLambda']['Properties']['Code']['ZipFile']==src
          assert 'novapharm-production-nutraxin-payment-ledger' not in json.dumps(infra)
          assert 'sk_live_' not in src and 'rk_live_' not in src and 'whsec_' not in src.replace('"whsec_"','')
          assert 'automatic_tax[enabled]' in src and 'payment_method_types' not in src
          assert 'checkout.session.async_payment_succeeded' in src
          assert 'parse_signature' in src and 'ConditionExpression' in src
          assert 'approved_skus' in src and 'actual_variable_cost_pence' in src
          print('ESCO isolated template and payment fail-closed contract accepted')
          PY
