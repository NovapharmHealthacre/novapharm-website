name: Intelligence isolated Stripe Billing webhook

on:
  pull_request:
    paths:
      - 'deployment/aws/intelligence_billing_webhook.py'
      - 'infra/aws/intelligence-stripe-subscription-webhook.json'
      - 'scripts/test_intelligence_billing_webhook.py'
      - '.github/workflows/intelligence-stripe-webhook.yml'

permissions:
  contents: read

jobs:
  verify-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate IaC JSON and Python source
        run: |
          python -m json.tool infra/aws/intelligence-stripe-subscription-webhook.json >/dev/null
          python -m py_compile deployment/aws/intelligence_billing_webhook.py
      - name: Test signature validation, idempotency and no-access boundary
        run: python scripts/test_intelligence_billing_webhook.py
      - name: Preserve Intelligence requirements
        run: npm run intelligence:requirements:validate
