name: Nutraxin products-only Stripe Checkout API and storefront acceptance
on:
  pull_request:
    paths:
      - "apps/nutraxin-products-checkout/**"
      - "infra/aws/nutraxin-products-checkout-api.json"
      - "assets/js/nutraxin-retail-store.js"
      - "assets/data/nutraxin-retail-catalogue.json"
      - "scripts/test-nutraxin-retail-store.mjs"
      - ".github/workflows/nutraxin-products-checkout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-products-only-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Compile guest checkout Lambda
        run: python3 -m py_compile apps/nutraxin-products-checkout/index.py
      - name: Check guest Checkout and order status security
        run: python3 -m unittest discover -s apps/nutraxin-products-checkout -p 'test_public_checkout.py' -v
      - name: Check all 19 products, price and public Bag
        run: node --test scripts/test-nutraxin-retail-store.mjs
      - name: Verify AWS template has precise CORS and no browser-side Stripe secrets
        run: |
          python3 - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path("infra/aws/nutraxin-products-checkout-api.json").read_text())
          env=d["Resources"]["ShopLambda"]["Properties"]["Environment"]["Variables"]
          assert d["Resources"]["ShopLambda"]["Properties"]["Code"]["ZipFile"] == pathlib.Path("apps/nutraxin-products-checkout/index.py").read_text()
          assert env["PRODUCTION_CHECKOUT_FUNCTION"]=="novapharm-production-nutraxin-approved-checkout"
          origins=d["Resources"]["ShopApi"]["Properties"]["CorsConfiguration"]["AllowOrigins"]
          assert origins==["https://novapharmhealthcare.com","https://www.novapharmhealthcare.com"]
          role=json.dumps(d["Resources"]["ShopRole"])
          assert "secretsmanager:GetSecretValue" not in role
          assert "lambda:InvokeFunction" in role and "ssm:GetParameter" in role
          assert d["Resources"]["ShopStage"]["Properties"]["DefaultRouteSettings"]["ThrottlingRateLimit"]<=5
          js=pathlib.Path("assets/js/nutraxin-retail-store.js").read_text()
          assert "portal.novapharmhealthcare.com" not in js
          assert "sk_live_" not in js and "rk_live_" not in js and "whsec_" not in js
          PY
