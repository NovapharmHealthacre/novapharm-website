name: Nutraxin products-only Stripe Checkout API and storefront acceptance
on:
  pull_request:
    paths:
      - "apps/nutraxin-products-checkout/**"
      - "apps/nutraxin-payments/gift_card_contract.py"
      - "apps/nutraxin-payments/test_gift_card_contract.py"
      - "apps/nutraxin-payments/gift_card_ledger.py"
      - "apps/nutraxin-payments/test_gift_card_ledger.py"
      - "assets/css/nutraxin-retail-store.css"
      - "infra/aws/nutraxin-products-checkout-api.json"
      - "assets/js/nutraxin-retail-store.js"
      - "assets/data/nutraxin-retail-catalogue.json"
      - "scripts/test-nutraxin-retail-store.mjs"
      - "scripts/test-nutraxin-consumer-account.mjs"
      - "infra/aws/nutraxin-consumer-identity-production.json"
      - "assets/js/nutraxin-consumer-account.js"
      - "assets/data/nutraxin-consumer-auth.json"
      - "products/nutraxin/account/index.html"
      - ".github/workflows/nutraxin-products-checkout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-products-only-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Compile guest checkout Lambda
        run: python3 -m py_compile apps/nutraxin-products-checkout/index.py
      - name: Check guest Checkout and order status security
        run: python3 -m unittest discover -s apps/nutraxin-products-checkout -p 'test_public_checkout.py' -v
      - name: Verify offline gift card balance and tender contract
        run: python3 -m unittest discover -s apps/nutraxin-payments -p "test_gift_card*.py" -v
      - name: Check all 19 products, price and public Bag
        run: |
          node --test scripts/test-nutraxin-retail-store.mjs
          node --test scripts/test-nutraxin-consumer-account.mjs
      - name: Confirm hosted Stripe returns directly to Products
        run: |
          python3 -m unittest discover -s apps/nutraxin-payments -p 'test_approved_checkout.py' -v
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path("apps/nutraxin-payments/approved_checkout.py").read_text()
          assert 'SUCCESS_ORIGIN = "https://novapharmhealthcare.com"' in p
          assert '/products/nutraxin/bag/?checkout=return' in p
          assert '/products/nutraxin/bag/?checkout=cancelled' in p
          # Both channels are valid. Portal returns are permitted ONLY for the
          # existing server-selected PORTAL_RETAIL path; public guest returns
          # must remain pinned to the Products Bag on the corporate site.
          assert 'PORTAL_ORIGIN = "https://portal.novapharmhealthcare.com"' in p
          assert 'if order.get("checkoutChannel") == "PORTAL_RETAIL":' in p
          assert 'redirect_base = PORTAL_ORIGIN + "/portal/products/"' in p
          assert 'success_url = SUCCESS_ORIGIN + "/products/nutraxin/bag/?checkout=return' in p
          assert 'cancel_url = SUCCESS_ORIGIN + "/products/nutraxin/bag/?checkout=cancelled"' in p
          site=pathlib.Path("src/content/nutraxin-showcase.html").read_text()
          assert "portal.novapharmhealthcare.com" not in site
          PY
      - name: Verify AWS template has precise CORS and no browser-side Stripe secrets
        run: |
          python3 - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path("infra/aws/nutraxin-products-checkout-api.json").read_text())
          env=d["Resources"]["ShopLambda"]["Properties"]["Environment"]["Variables"]
          assert d["Resources"]["ShopLambda"]["Properties"]["Code"]["ZipFile"] == pathlib.Path("apps/nutraxin-products-checkout/index.py").read_text()
          assert env["PRODUCTION_CHECKOUT_FUNCTION"]=="novapharm-production-nutraxin-approved-checkout"
          origins=d["Resources"]["ShopApi"]["Properties"]["CorsConfiguration"]["AllowOrigins"]
          assert origins==["https://novapharmhealthcare.com","https://www.novapharmhealthcare.com"]
          role=json.dumps(d["Resources"]["ShopRole"])
          assert "secretsmanager:GetSecretValue" not in role
          assert "lambda:InvokeFunction" in role and "ssm:GetParameter" in role
          assert d["Resources"]["ShopStage"]["Properties"]["DefaultRouteSettings"]["ThrottlingRateLimit"]<=5
          js=pathlib.Path("assets/js/nutraxin-retail-store.js").read_text()
          assert "portal.novapharmhealthcare.com" not in js
          assert "sk_live_" not in js and "rk_live_" not in js and "whsec_" not in js
          PY
