name: Cognito staging proof security contract
on:
  push:
    branches:
      - codex/cognito-staging-verify-fail-closed-20261107
  pull_request:
    paths:
      - apps/portal/**
      - .github/workflows/portal-cognito-staging-proof.yml
permissions:
  contents: read
jobs:
  verify-fail-closed-identity-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install immutable dependencies
        run: npm ci --ignore-scripts
      - name: Run Cognito negative cryptographic tests first
        run: node --test apps/portal/test/cognito-staging-auth.test.mjs
      - name: Validate entire portal type safety, lint, contracts, tests, and build
        run: npm run check --workspace=@novapharm/portal
      - name: Confirm default-off public portal verification flag and no privileged session
        run: |
          grep -q 'COGNITO_STAGING_VERIFICATION_ENABLED !== "true"' apps/portal/lib/cognito-staging-auth.mjs
          ! grep -Eq 'np_session|x-ms-client-principal' apps/portal/app/auth/callback/route.ts
          ! grep -Eq 'np_session|x-ms-client-principal' apps/portal/app/auth/start/route.ts
