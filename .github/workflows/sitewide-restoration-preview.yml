name: Preview owner-approved sitewide public restoration

on:
  pull_request:
    paths:
      - .github/workflows/sitewide-restoration-preview.yml
      - scripts/compare-sitewide-restoration-preview.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - name: Check out exact owner-approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify public source safety and install locked dependencies
        run: |
          node scripts/test-static-public-source-safety.mjs
          npm ci --ignore-scripts
      - name: Build approved public site without deploying
        run: |
          npm run build:public-only
          node scripts/stage-pages-artifact.mjs _site
          npm run validate:domain
          node scripts/check-links.mjs _site
      - name: Check out existing live Pages branch for read-only comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: published
          persist-credentials: false
      - name: Produce per-page restoration manifest while preserving customer/commerce flows
        run: python3 scripts/compare-sitewide-restoration-preview.py
      - name: Upload release manifest even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitewide-restoration-preview-${{ github.sha }}
          path: artifacts/restore-preview/manifest.json
          if-no-files-found: warn
          retention-days: 14

# This workflow has contents:read and no Pages, AWS, DNS or customer write permissions.
