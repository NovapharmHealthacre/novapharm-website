name: Repair tracked image inventory evidence (candidate branch only)

on:
  push:
    branches:
      - codex/contact-real-intake-sns-20261107
    paths:
      - .github/workflows/repair-image-inventory-evidence.yml

permissions:
  contents: write

jobs:
  regenerate-authoritative-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/contact-real-intake-sns-20261107
          persist-credentials: true
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild registered media report without editing source assets or licences
        run: |
          npm run images:inventory
          git diff --check
          git diff --numstat -- audit/generated/image-inventory.json
          npm run images:inventory:validate
      - name: Commit only generated auditable report on candidate branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/contact-real-intake-sns-20261107"
          git add -- audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Inventory already current"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "audit/generated/image-inventory.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(evidence): regenerate tracked image inventory with immutable provenance"
          git push origin HEAD:codex/contact-real-intake-sns-20261107
