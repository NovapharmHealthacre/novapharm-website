name: Finance public data foundation
on:
  pull_request:
    paths:
      - 'src/core/finance-*.mjs'
      - 'scripts/*finance*.mjs'
      - '.github/workflows/finance-public-data.yml'
permissions:
  contents: read
jobs:
  finance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/test-finance-public-data.mjs scripts/test-finance-inhouse-analytics.mjs
