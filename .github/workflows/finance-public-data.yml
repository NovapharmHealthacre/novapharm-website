name: Finance public data foundation
on:
  pull_request:
    paths:
      - 'src/core/finance-*.mjs'
      - 'scripts/*finance*.mjs'
      - '.github/workflows/finance-public-data.yml'
permissions:
  contents: read
jobs:
  finance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node --test scripts/test-finance-public-data.mjs scripts/test-finance-inhouse-analytics.mjs
