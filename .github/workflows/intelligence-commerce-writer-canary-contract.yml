name: Intelligence isolated commerce writer canary contract

on:
  pull_request:
    paths:
      - 'infra/aws/intelligence-commerce-writer-canary-staging.json'
      - 'scripts/test-intelligence-commerce-writer-canary-staging.mjs'
      - '.github/workflows/intelligence-commerce-writer-canary-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-private-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate explicit least-privilege candidate
        run: node --test scripts/test-intelligence-commerce-writer-canary-staging.mjs
      - name: Validate embedded Python syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          template=json.loads(Path("infra/aws/intelligence-commerce-writer-canary-staging.json").read_text())
          code=template["Resources"]["PrivateWriterCanary"]["Properties"]["Code"]["ZipFile"]
          compile(code, "index.py", "exec")
          PY
