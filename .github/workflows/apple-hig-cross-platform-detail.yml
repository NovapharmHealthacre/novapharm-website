name: Apple HIG 172-topic traceability and cross-platform detail
on:
  pull_request:
    paths:
      - 'docs/design/apple-hig-172-topic-acceptance-register.json'
      - 'docs/design/apple-hig-172-topic-adoption-20261118.md'
      - 'apps/portal/app/globals.css'
      - 'native/novapharm-intelligence-mobile/MultimodalReviewScreen.tsx'
      - 'scripts/test-apple-hig-full-catalogue-and-cross-platform.mjs'
      - 'docs/design/apple-hig-attachment-evidence-20261118.json'
      - 'docs/design/apple-hig-source-and-attachment-audit-20261118.md'
      - 'scripts/test-apple-hig-attachment-audit.mjs'
      - '.github/workflows/apple-hig-cross-platform-detail.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-contracts:
    name: HIG 172 topics, portal target sizes and mobile readable forms
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node --check scripts/test-apple-hig-full-catalogue-and-cross-platform.mjs
      - run: node --test scripts/test-apple-hig-full-catalogue-and-cross-platform.mjs
      - run: node --check scripts/test-apple-hig-attachment-audit.mjs
      - run: node --test scripts/test-apple-hig-attachment-audit.mjs
