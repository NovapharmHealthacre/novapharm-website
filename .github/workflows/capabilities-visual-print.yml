name: Capabilities desktop mobile and A4 print acceptance
on:
  pull_request:
    paths:
      - ".github/workflows/capabilities-visual-print.yml"
      - "scripts/test-capabilities-visual-print.mjs"
      - "scripts/apply-capabilities-editorial.mjs"
      - "src/content/capabilities-editorial.html"
      - "assets/css/capabilities-editorial.css"
      - "capabilities/index.html"
  push:
    branches: [main]
    paths:
      - ".github/workflows/capabilities-visual-print.yml"
      - "scripts/test-capabilities-visual-print.mjs"
      - "scripts/apply-capabilities-editorial.mjs"
      - "src/content/capabilities-editorial.html"
      - "assets/css/capabilities-editorial.css"
      - "capabilities/index.html"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      # Ubuntu 24.04 has the supported Playwright WebKit dependency packages.
      # ubuntu-latest moved to a newer release and apt downloads timed out.
      - name: Install supported Chromium and WebKit dependencies
        run: npx playwright install --with-deps chromium webkit
      - run: npm run build:public-only
      - name: Start local static server
        run: |
          python3 -m http.server 4310 --bind 127.0.0.1 > /tmp/capabilities-static.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4310/capabilities/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/capabilities-static.log
          echo 'Static server did not become ready' >&2
          exit 1
      - name: Assert Chromium/WebKit layouts and capture A4 evidence
        run: node scripts/test-capabilities-visual-print.mjs
      - name: Preserve screenshots PDF and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capabilities-visual-print-${{ github.sha }}
          path: |
            artifacts/capabilities-visual-print
            /tmp/capabilities-static.log
          retention-days: 14
          if-no-files-found: warn
