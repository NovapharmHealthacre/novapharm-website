name: Finalize approved leadership portraits

on:
  push:
    branches:
      - chore/update-leadership-headshots-cso
    paths:
      - .github/workflows/materialize-leadership-portraits.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/update-leadership-headshots-cso
          fetch-depth: 0

      - name: Align portrait references and asset register
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          replacements = {
              "/assets/vishalchakravarty.jpeg": "/assets/vishalchakravarty.png",
              "/assets/prabhakarvitthallahare.jpeg": "/assets/prabhakarvitthallahare.png",
              "/assets/girishshantilalachliya.jpeg": "/assets/girishshantilalachliya.png",
          }
          text_files = [
              Path("src/content/site-content.mjs"),
              Path("apps/corporate/data/site.ts"),
              Path("packages/content/src/index.ts"),
              Path("scripts/apply-owner-corrections.mjs"),
          ]
          for path in text_files:
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")

          register_path = Path("creative-assets/asset-register.json")
          register = json.loads(register_path.read_text(encoding="utf-8"))
          updates = {
              "assets/vishalchakravarty.jpeg": {
                  "path": "assets/vishalchakravarty.png",
                  "source": "owner-supplied authoritative master Vishal Chakravarty.png",
                  "sourceMasterSha256": "34935cd045cb08bd991099d9e16f58ea4e2ec13ecda17d04fd50bb001dc5c70f",
                  "acquisitionDate": "2026-08-17",
                  "dimensions": "1200x1200",
                  "optimisedVariants": [],
                  "pageUsage": ["leadership index", "Vishal Chakravarty profile", "CRO senior judgement"],
                  "altText": "Vishal Chakravarty, Chief Executive Officer of NovaPharm Healthcare",
              },
              "assets/prabhakarvitthallahare.jpeg": {
                  "path": "assets/prabhakarvitthallahare.png",
                  "source": "owner-supplied authoritative master Prabhkar Lahare.png",
                  "sourceMasterSha256": "88e23ba2d98b29a40b61f639e01cd42d2390b345a0867e9a175a0c248f623241",
                  "acquisitionDate": "2026-08-17",
                  "dimensions": "960x1200",
                  "optimisedVariants": [],
                  "pageUsage": ["leadership index", "Prabhakar Vitthal Lahare profile", "CRO senior judgement"],
                  "altText": "Prabhakar Vitthal Lahare, Chief Operating Officer of NovaPharm Healthcare",
              },
              "assets/girishshantilalachliya.jpeg": {
                  "path": "assets/girishshantilalachliya.png",
                  "source": "owner-supplied authoritative master Dr Girish.png",
                  "sourceMasterSha256": "b47256019242b7c9f9b425e6f719e3db0056caee88b73ffba041f12d48d25201",
                  "acquisitionDate": "2026-08-17",
                  "dimensions": "960x1200",
                  "optimisedVariants": [],
                  "pageUsage": ["leadership index", "Dr Girish Shantilal Achliya profile", "CRO senior judgement"],
                  "altText": "Dr Girish Shantilal Achliya, Chief Scientific Officer of NovaPharm Healthcare",
              },
          }
          found = set()
          for asset in register.get("assets", []):
              old_path = asset.get("path")
              if old_path not in updates:
                  continue
              update = updates[old_path]
              asset.update(update)
              asset["assetSha256"] = hashlib.sha256(Path(update["path"]).read_bytes()).hexdigest()
              asset["generated"] = False
              asset["caption"] = None
              asset["technicalStatus"] = "owner-approved authoritative portrait resized with Adobe to declared web presentation dimensions; PNG"
              asset["ownerApproval"] = "approved"
              found.add(old_path)
          missing = set(updates) - found
          if missing:
              raise SystemExit(f"Leadership asset register entries not found: {sorted(missing)}")
          register["reviewed"] = "2026-08-17"
          register_path.write_text(json.dumps(register, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate canonical leadership titles
        run: node scripts/programme/validate-leadership-titles.mjs

      - name: Commit final source alignment and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-leadership-portraits.yml
          git add src/content/site-content.mjs apps/corporate/data/site.ts packages/content/src/index.ts scripts/apply-owner-corrections.mjs creative-assets/asset-register.json
          git commit -m 'Finalize leadership portrait and CSO updates'
          git push origin HEAD:chore/update-leadership-headshots-cso
