name: Intelligence ECR Lambda-image retention contract
on:
  pull_request:
    paths:
      - 'infra/aws/intelligence-ecr-protected-lifecycle-policy.json'
      - 'scripts/test-intelligence-ecr-lambda-retention.mjs'
      - '.github/workflows/intelligence-ecr-image-retention.yml'
      - 'docs/intelligence/ECR_LAMBDA_IMAGE_RETENTION_20261113.md'
  push:
    branches: [main]
    paths:
      - 'infra/aws/intelligence-ecr-protected-lifecycle-policy.json'
      - 'scripts/test-intelligence-ecr-lambda-retention.mjs'
      - '.github/workflows/intelligence-ecr-image-retention.yml'
permissions:
  contents: read
jobs:
  verify-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node --test scripts/test-intelligence-ecr-lambda-retention.mjs
