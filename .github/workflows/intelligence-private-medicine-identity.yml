name: Intelligence first medicine private identity gate

on:
  pull_request:
    paths:
      - 'src/data/atlas-private-medicine-identity-lookup.mjs'
      - 'scripts/test-atlas-private-medicine-identity-lookup.mjs'
      - '.github/workflows/intelligence-private-medicine-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-identity:
    name: Private medicine exact-code tenant, rights and audit contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node --check src/data/atlas-private-medicine-identity-lookup.mjs
      - run: node --test scripts/test-atlas-private-medicine-identity-lookup.mjs
