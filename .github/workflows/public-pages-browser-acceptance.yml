name: Public Pages Chromium and WebKit acceptance

on:
  pull_request:
    paths:
      - .github/workflows/public-pages-browser-acceptance.yml
      - assets/css/**
      - legal/**
      - assets/js/cookie-consent.js
      - assets/js/rtl-localization.js
      - scripts/test-apple-locale-footer-browser.mjs
      - assets/js/consent-analytics.js
      - assets/js/commerce-marketplace.js
      - scripts/test-marketplace-stock-dom-stability.mjs
      - assets/media/**
      - assets/*.png
      - index.html
      - leadership/**
      - regulatory-services/**
      - services/**
      - oncology/**
      - cro/**
      - technology/**
      - apps/corporate/data/site.ts
      - packages/content/src/index.ts
      - src/content/site-content.mjs
      - creative-assets/asset-register.json
      - scripts/build-site.mjs
      - scripts/build-pages.mjs
      - scripts/apply-pages-presentation-parity.mjs
      - scripts/programme/validate-leadership-titles.mjs
      - scripts/test-owner-corrections.mjs
      - scripts/test-public-pages-browser.mjs
      - scripts/test-intelligence-accessibility-browser.mjs
      - assets/js/intelligence-workspace-*.js
      - scripts/test-public-sitemap-geometry.mjs
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/public-pages-browser-acceptance.yml
      - assets/css/**
      - legal/**
      - assets/js/cookie-consent.js
      - assets/js/rtl-localization.js
      - scripts/test-apple-locale-footer-browser.mjs
      - assets/js/consent-analytics.js
      - assets/js/commerce-marketplace.js
      - scripts/test-marketplace-stock-dom-stability.mjs
      - assets/media/**
      - assets/*.png
      - index.html
      - leadership/**
      - regulatory-services/**
      - services/**
      - oncology/**
      - cro/**
      - technology/**
      - apps/corporate/data/site.ts
      - packages/content/src/index.ts
      - src/content/site-content.mjs
      - creative-assets/asset-register.json
      - scripts/build-site.mjs
      - scripts/build-pages.mjs
      - scripts/apply-pages-presentation-parity.mjs
      - scripts/programme/validate-leadership-titles.mjs
      - scripts/test-owner-corrections.mjs
      - scripts/test-public-pages-browser.mjs
      - scripts/test-intelligence-accessibility-browser.mjs
      - assets/js/intelligence-workspace-*.js
      - scripts/test-public-sitemap-geometry.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-public-estate:
    runs-on: ubuntu-24.04
    # Match the locked Playwright 1.61.1 release and avoid slow public Ubuntu apt mirrors.
    # Keep the real Chromium/WebKit and all subsequent accessibility/visual assertions.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out exact public release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Trust exact checked-out Git workspace in browser image
        shell: bash
        run: |
          test -n "$GITHUB_WORKSPACE"
          test -d "$GITHUB_WORKSPACE/.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Marketplace stock DOM and image audit regression
        run: node --test scripts/test-marketplace-stock-dom-stability.mjs
      # Image contains native browser system dependencies; no apt install or cache needed.
      # Fail the job if the image and package-lock browser revisions drift.
      - name: Assert locked Chromium and WebKit binaries are present
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const pw = require("playwright");
          const version = require("playwright/package.json").version;
          if (version !== "1.61.1") throw new Error("Unexpected Playwright version: " + version);
          for (const browser of [pw.chromium, pw.webkit]) {
            if (!fs.existsSync(browser.executablePath())) {
              throw new Error("Missing locked " + browser.name() + " executable: " + browser.executablePath());
            }
          }
          NODE
      - name: Build safe public-only estate
        run: npm run build:public-only
      - name: Serve generated public estate
        run: |
          python3 -m http.server 4310 --bind 127.0.0.1 > /tmp/novapharm-public-server.log 2>&1 &
          echo $! > /tmp/novapharm-public-server.pid
      - name: Audit every public sitemap route and commerce shell geometry
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
          PUBLIC_PAGES_BROWSER_ARTIFACT_ROOT: artifacts/public-pages-browser
        run: node scripts/test-public-sitemap-geometry.mjs
      - name: Verify unboxed footer language picker on Chromium and WebKit at 320px, 390px and desktop
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
        run: node scripts/test-apple-locale-footer-browser.mjs
      - name: Render layout, image and accessibility acceptance
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
          PUBLIC_PAGES_BROWSER_ARTIFACT_ROOT: artifacts/public-pages-browser
        run: node scripts/test-public-pages-browser.mjs
      - name: Verify Intelligence preview keyboard, chart and screen-reader contract
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
          PUBLIC_PAGES_BROWSER_ARTIFACT_ROOT: artifacts/public-pages-browser
        run: node scripts/test-intelligence-accessibility-browser.mjs
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-pages-browser-${{ github.sha }}
          path: |
            artifacts/public-pages-browser
            /tmp/novapharm-public-server.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/novapharm-public-server.pid ]; then
            kill "$(cat /tmp/novapharm-public-server.pid)" || true
          fi
