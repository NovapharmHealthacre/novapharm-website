name: Public Pages Chromium and WebKit acceptance

on:
  pull_request:
    paths:
      - .github/workflows/public-pages-browser-acceptance.yml
      - assets/css/**
      - assets/media/**
      - assets/*.png
      - index.html
      - leadership/**
      - regulatory-services/**
      - services/**
      - oncology/**
      - cro/**
      - technology/**
      - apps/corporate/data/site.ts
      - packages/content/src/index.ts
      - src/content/site-content.mjs
      - creative-assets/asset-register.json
      - scripts/build-site.mjs
      - scripts/build-pages.mjs
      - scripts/apply-pages-presentation-parity.mjs
      - scripts/programme/validate-leadership-titles.mjs
      - scripts/test-owner-corrections.mjs
      - scripts/test-public-pages-browser.mjs
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/public-pages-browser-acceptance.yml
      - assets/css/**
      - assets/media/**
      - assets/*.png
      - index.html
      - leadership/**
      - regulatory-services/**
      - services/**
      - oncology/**
      - cro/**
      - technology/**
      - apps/corporate/data/site.ts
      - packages/content/src/index.ts
      - src/content/site-content.mjs
      - creative-assets/asset-register.json
      - scripts/build-site.mjs
      - scripts/build-pages.mjs
      - scripts/apply-pages-presentation-parity.mjs
      - scripts/programme/validate-leadership-titles.mjs
      - scripts/test-owner-corrections.mjs
      - scripts/test-public-pages-browser.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-public-estate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact public release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build safe public-only estate
        run: npm run build:public-only
      - name: Serve generated public estate
        run: |
          python3 -m http.server 4310 --bind 127.0.0.1 > /tmp/novapharm-public-server.log 2>&1 &
          echo $! > /tmp/novapharm-public-server.pid
      - name: Render layout, image and accessibility acceptance
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
          PUBLIC_PAGES_BROWSER_ARTIFACT_ROOT: artifacts/public-pages-browser
        run: node scripts/test-public-pages-browser.mjs
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-pages-browser-${{ github.sha }}
          path: |
            artifacts/public-pages-browser
            /tmp/novapharm-public-server.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/novapharm-public-server.pid ]; then
            kill "$(cat /tmp/novapharm-public-server.pid)" || true
          fi
