name: Public Pages Chromium and WebKit acceptance

on:
  pull_request:
    paths:
      - .github/workflows/public-pages-browser-acceptance.yml
      - scripts/ci/public-pages-static-server.mjs
      - assets/css/**
      - legal/**
      - assets/js/cookie-consent.js
      - assets/js/rtl-localization.js
      - scripts/test-apple-locale-footer-browser.mjs
      - assets/js/consent-analytics.js
      - assets/js/commerce-marketplace.js
      - scripts/test-marketplace-stock-dom-stability.mjs
      - assets/media/**
      - assets/*.png
      - index.html
      - leadership/**
      - regulatory-services/**
      - services/**
      - oncology/**
      - cro/**
      - technology/**
      - apps/corporate/data/site.ts
      - packages/content/src/index.ts
      - src/content/site-content.mjs
      - creative-assets/asset-register.json
      - scripts/build-site.mjs
      - scripts/build-pages.mjs
      - scripts/apply-pages-presentation-parity.mjs
      - scripts/programme/validate-leadership-titles.mjs
      - scripts/test-owner-corrections.mjs
      - scripts/test-public-pages-browser.mjs
      - scripts/activate-contact-intake.mjs
      - scripts/managed-contact-layout.mjs
      - scripts/test-managed-contact-layout-browser.mjs
      - scripts/test-intelligence-accessibility-browser.mjs
      - assets/js/intelligence-workspace-*.js
      - scripts/test-public-sitemap-geometry.mjs
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/public-pages-browser-acceptance.yml
      - scripts/ci/public-pages-static-server.mjs
      - assets/css/**
      - legal/**
      - assets/js/cookie-consent.js
      - assets/js/rtl-localization.js
      - scripts/test-apple-locale-footer-browser.mjs
      - assets/js/consent-analytics.js
      - assets/js/commerce-marketplace.js
      - scripts/test-marketplace-stock-dom-stability.mjs
      - assets/media/**
      - assets/*.png
      - index.html
      - leadership/**
      - regulatory-services/**
      - services/**
      - oncology/**
      - cro/**
      - technology/**
      - apps/corporate/data/site.ts
      - packages/content/src/index.ts
      - src/content/site-content.mjs
      - creative-assets/asset-register.json
      - scripts/build-site.mjs
      - scripts/build-pages.mjs
      - scripts/apply-pages-presentation-parity.mjs
      - scripts/programme/validate-leadership-titles.mjs
      - scripts/test-owner-corrections.mjs
      - scripts/test-public-pages-browser.mjs
      - scripts/activate-contact-intake.mjs
      - scripts/managed-contact-layout.mjs
      - scripts/test-managed-contact-layout-browser.mjs
      - scripts/test-intelligence-accessibility-browser.mjs
      - assets/js/intelligence-workspace-*.js
      - scripts/test-public-sitemap-geometry.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

# PR-only supersession prevents stale commits competing for runner slots.
# Each main push and manual dispatch has a unique group: no cancellation there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rendered-public-estate:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --shm-size=1gb
    timeout-minutes: 25
    steps:
      - name: Check out exact public release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Trust exact checkout for release provenance
        run: |
          test -d "$GITHUB_WORKSPACE/.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Marketplace stock DOM and image audit regression
        run: node --test scripts/test-marketplace-stock-dom-stability.mjs
      - name: Validate locked Playwright and both bundled browsers
        run: |
          node -e "const fs=require('node:fs'); const p=require('playwright/package.json'); const b=require('playwright'); if(p.version!=='1.61.1') process.exit(1); for(const engine of [b.chromium,b.webkit]) { const file=engine.executablePath(); if(!fs.existsSync(file)) {console.error('Missing browser '+file); process.exit(1);} }"
      - name: Build safe public-only estate
        run: npm run build:public-only
      - name: Serve generated public estate
        run: |
          node scripts/ci/public-pages-static-server.mjs --bind 127.0.0.1 > /tmp/novapharm-public-server.log 2>&1 &
          echo $! > /tmp/novapharm-public-server.pid
      - name: Verify rendered managed Contact (isolated local fixture, Chromium and WebKit)
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
          PUBLIC_PAGES_BROWSER_ARTIFACT_ROOT: artifacts/public-pages-browser
        run: node scripts/test-managed-contact-layout-browser.mjs
      - name: Audit every public sitemap route and commerce shell geometry
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
          PUBLIC_PAGES_BROWSER_ARTIFACT_ROOT: artifacts/public-pages-browser
        run: node scripts/test-public-sitemap-geometry.mjs
      - name: Verify all 19 Nutraxin detail pages on Chromium and WebKit (desktop, tablet, mobile, print)
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
          PUBLIC_PAGES_BROWSER_ARTIFACT_ROOT: artifacts/public-pages-browser
        run: node scripts/test-nutraxin-product-layout-browser.mjs
      - name: Verify unboxed footer language picker on Chromium and WebKit at 320px, 390px and desktop
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
        run: node scripts/test-apple-locale-footer-browser.mjs
      - name: Render layout, image and accessibility acceptance
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
          PUBLIC_PAGES_BROWSER_ARTIFACT_ROOT: artifacts/public-pages-browser
        run: node scripts/test-public-pages-browser.mjs
      - name: Verify Intelligence preview keyboard, chart and screen-reader contract
        env:
          PUBLIC_PAGES_BASE_URL: http://127.0.0.1:4310
          PUBLIC_PAGES_BROWSER_ARTIFACT_ROOT: artifacts/public-pages-browser
        run: node scripts/test-intelligence-accessibility-browser.mjs
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-pages-browser-${{ github.sha }}
          path: |
            artifacts/public-pages-browser
            /tmp/novapharm-public-server.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/novapharm-public-server.pid ]; then
            kill "$(cat /tmp/novapharm-public-server.pid)" || true
          fi
