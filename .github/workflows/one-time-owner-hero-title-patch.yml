name: One-time owner hero title patch

on:
  push:
    branches:
      - chatgpt/hero-title-medicine
    paths:
      - .github/workflows/one-time-owner-hero-title-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated patch branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chatgpt/hero-title-medicine
          fetch-depth: 0

      - name: Apply exact owner-approved hero title
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "Pharmaceutical supply, built around evidence."
          new = "Medicine. Where it needs to be"
          targets = {
              Path("scripts/apply-pages-presentation-parity.mjs"): 2,
              Path(".github/workflows/pages-live-publish.yml"): 4,
          }

          for path, expected_count in targets.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f"Refusing to patch {path}: expected {expected_count} exact occurrences of {old!r}, found {count}."
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          hero_source = Path("scripts/apply-pages-presentation-parity.mjs").read_text(encoding="utf-8")
          if "<h1>Medicine. Where it needs to be</h1>" not in hero_source:
              raise SystemExit("The production homepage hero did not receive the exact approved title.")
          PY

      - name: Commit only the intended production-source and deployment-check changes
        run: |
          git config user.name "ChatGPT website maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply-pages-presentation-parity.mjs .github/workflows/pages-live-publish.yml
          git rm --force .github/workflows/one-time-owner-hero-title-patch.yml
          git diff --cached --check
          git commit -m "Update homepage hero to Medicine. Where it needs to be"
          git push origin HEAD:chatgpt/hero-title-medicine
