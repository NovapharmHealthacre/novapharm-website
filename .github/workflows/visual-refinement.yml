name: Premium visual refinement validation

on:
  pull_request:
    paths:
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/**"
      - "services/**"
      - "regulatory-services/**"
      - "cro/**"
      - "oncology/**"
      - "partner-with-us/**"
      - "technology/**"
      - "leadership/**"
      - "legal/**"
      - "contact/**"
      - "account-application/**"
      - "portal/**"
      - "index.html"
      - "sitemap*.xml"
      - "robots.txt"
      - "package.json"
      - ".github/workflows/visual-refinement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novapharm-visual-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact source under review
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Verify checked-in legacy Pages source is default-deny
        run: node scripts/test-static-public-source-safety.mjs

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Build the deterministic public-only visual release
        run: npm run build:public-only

      - name: Validate the public implementation
        run: |
          npm run visual:validate
          npm run visual:modules
          npm run test:owner-corrections:public-only

      - name: Re-verify generated public-only trust boundaries
        run: node scripts/test-static-public-source-safety.mjs
