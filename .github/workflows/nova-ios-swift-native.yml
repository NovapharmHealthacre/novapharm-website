name: NovaPharm native Swift iOS source and unsigned simulator build

on:
  pull_request:
    paths:
      - "native/novapharm-intelligence-ios/**"
      - "scripts/test-novapharm-native-ios-source-parity.mjs"
      - "apps/portal/data/intelligence-workspaces.ts"
      - "config/intelligence/owner-production-constraints.json"
      - ".github/workflows/nova-ios-swift-native.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-native-ios:
    name: Native Swift Testing and unsigned iOS Simulator compilation
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify catalogue parity and fail-closed production controls
        run: node --test scripts/test-novapharm-native-ios-source-parity.mjs
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Swift Testing on native catalogue and security boundaries
        run: swift test --package-path native/novapharm-intelligence-ios
      - name: Generate the Xcode project from reviewed source
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd native/novapharm-intelligence-ios
          xcodegen generate
          xcodebuild -list -project NovaPharmNative.xcodeproj
      - name: Build unsigned native SwiftUI iOS simulator app
        run: |
          set -eu
          cd native/novapharm-intelligence-ios
          xcodebuild -project NovaPharmNative.xcodeproj \
            -scheme NovaPharmNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/novapharm-swift-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive simulator build and record checksum
        run: |
          set -eu
          app="$RUNNER_TEMP/novapharm-swift-derived/Build/Products/Debug-iphonesimulator/NovaPharmNative.app"
          test -d "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/NovaPharmNative-iOS-Simulator.zip"
          shasum -a 256 "$RUNNER_TEMP/NovaPharmNative-iOS-Simulator.zip" | tee "$RUNNER_TEMP/NovaPharmNative-iOS-Simulator.sha256"
      - name: Boot iPhone Simulator, install and launch unsigned native app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/novapharm-swift-derived/Build/Products/Debug-iphonesimulator/NovaPharmNative.app"
          test -d "$app"
          device="$(xcrun simctl list -j devices available | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; phones=[d for devices in data.values() for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]; print(phones[0]["udid"] if phones else "")')"
          test -n "$device" || { echo "::error::No available iPhone Simulator; do not claim runtime verification"; exit 1; }
          printf '%s\n' "Simulator UDID: $device" | tee "$RUNNER_TEMP/novapharm-ios-simulator-device.txt"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.example.NovaPharmNativePreview | tee "$RUNNER_TEMP/novapharm-ios-launch-receipt.txt"
          sleep 3
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/novapharm-ios-simulator-light.png"
          xcrun simctl ui "$device" appearance dark
          sleep 3
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/novapharm-ios-simulator-dark.png"
          test -s "$RUNNER_TEMP/novapharm-ios-launch-receipt.txt"
          test -s "$RUNNER_TEMP/novapharm-ios-simulator-light.png"
          test -s "$RUNNER_TEMP/novapharm-ios-simulator-dark.png"
          xcrun simctl terminate "$device" com.example.NovaPharmNativePreview || true
      - name: Run native UI navigation, country and SwiftData persistence tests on iPhone Simulator
        run: |
          set -euo pipefail
          device="$(sed -n 's/^Simulator UDID: //p' "$RUNNER_TEMP/novapharm-ios-simulator-device.txt")"
          test -n "$device"
          cd native/novapharm-intelligence-ios
          xcodebuild test \
            -project NovaPharmNative.xcodeproj \
            -scheme NovaPharmNative \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/novapharm-swift-derived" \
            -resultBundlePath "$RUNNER_TEMP/NovaPharmNative-UITests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:NovaPharmNativeUITests/NovaPharmNativeUITests \
            CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/NovaPharmNative-UITests.xcresult" \
            --format json > "$RUNNER_TEMP/novapharm-native-uitest-summary.json"
      - name: Run Apple accessibility audits and largest Dynamic Type UI tests
        run: |
          set -euo pipefail
          device="$(sed -n 's/^Simulator UDID: //p' "$RUNNER_TEMP/novapharm-ios-simulator-device.txt")"
          test -n "$device"
          xcrun simctl ui "$device" content_size accessibility-extra-extra-extra-large
          xcrun simctl ui "$device" content_size | tee "$RUNNER_TEMP/novapharm-ios-accessibility-text-size.txt"
          xcrun simctl launch "$device" com.example.NovaPharmNativePreview
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/novapharm-ios-accessibility-large-text.png"
          xcrun simctl terminate "$device" com.example.NovaPharmNativePreview
          cd native/novapharm-intelligence-ios
          xcodebuild test \
            -project NovaPharmNative.xcodeproj \
            -scheme NovaPharmNative \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/novapharm-swift-derived" \
            -resultBundlePath "$RUNNER_TEMP/NovaPharmNative-Accessibility.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:NovaPharmNativeUITests/NovaPharmAccessibilityUITests \
            CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/NovaPharmNative-Accessibility.xcresult" \
            --format json > "$RUNNER_TEMP/novapharm-native-accessibility-summary.json"
      - name: Independently boot and launch an iPad Simulator
        if: always() # iPad evidence must still be captured when preceding accessibility tests fail
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/novapharm-swift-derived/Build/Products/Debug-iphonesimulator/NovaPharmNative.app"
          ipad="$(xcrun simctl list -j devices available | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[i for devices in d.values() for i in devices if i.get("isAvailable") and i.get("name","").startswith("iPad")]; print(a[0]["udid"] if a else "")')"
          test -n "$ipad" || { echo "::error::No iPad Simulator available; iPad acceptance remains blocked"; exit 1; }
          xcrun simctl boot "$ipad" || true
          xcrun simctl bootstatus "$ipad" -b
          xcrun simctl install "$ipad" "$app"
          xcrun simctl ui "$ipad" appearance light
          xcrun simctl launch "$ipad" com.example.NovaPharmNativePreview | tee "$RUNNER_TEMP/novapharm-ipad-launch-receipt.txt"
          sleep 3
          xcrun simctl io "$ipad" screenshot "$RUNNER_TEMP/novapharm-ipad-simulator.png"
          test -s "$RUNNER_TEMP/novapharm-ipad-launch-receipt.txt"
          test -s "$RUNNER_TEMP/novapharm-ipad-simulator.png"
          xcrun simctl terminate "$ipad" com.example.NovaPharmNativePreview || true
      - name: Collect native XCTest summaries on success or failure
        if: always()
        run: |
          for entry in "NovaPharmNative-UITests.xcresult:novapharm-native-uitest-summary.json" "NovaPharmNative-Accessibility.xcresult:novapharm-native-accessibility-summary.json"; do
            bundle="${entry%%:*}"
            output="${entry#*:}"
            if [ -d "$RUNNER_TEMP/$bundle" ]; then
              xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$bundle" --format json | tee "$RUNNER_TEMP/$output" || true
            fi
          done
      - name: Upload Apple accessibility and iPad evidence in private repositories only
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-swift-accessibility-ipad-${{ github.sha }}
          path: |
            ${{ runner.temp }}/NovaPharmNative-Accessibility.xcresult
            ${{ runner.temp }}/novapharm-native-accessibility-summary.json
            ${{ runner.temp }}/novapharm-ios-accessibility-text-size.txt
            ${{ runner.temp }}/novapharm-ios-accessibility-large-text.png
            ${{ runner.temp }}/novapharm-ipad-launch-receipt.txt
            ${{ runner.temp }}/novapharm-ipad-simulator.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload native UI test evidence in private repositories only
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-swift-native-uitest-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/NovaPharmNative-UITests.xcresult
            ${{ runner.temp }}/novapharm-native-uitest-summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload non-distributable iOS Simulator artifact in private repositories only
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novapharm-swift-ios-simulator-${{ github.sha }}
          path: |
            ${{ runner.temp }}/NovaPharmNative-iOS-Simulator.zip
            ${{ runner.temp }}/NovaPharmNative-iOS-Simulator.sha256
            ${{ runner.temp }}/novapharm-ios-simulator-device.txt
            ${{ runner.temp }}/novapharm-ios-launch-receipt.txt
            ${{ runner.temp }}/novapharm-ios-simulator-light.png
            ${{ runner.temp }}/novapharm-ios-simulator-dark.png
          if-no-files-found: error
          retention-days: 7
      - name: Protect private app previews on public GitHub
        if: ${{ !github.event.repository.private }}
        run: echo "::notice::Public repository: private Simulator binaries, screenshots, and XCResult uploads are suppressed. Functional test status remains in CI logs."
