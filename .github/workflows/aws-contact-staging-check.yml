name: AWS synthetic contact staging contract and live endpoint check

on:
  pull_request:
    paths:
      - 'infra/aws/contact-synthetic/**'
      - 'infra/aws/contact-synthetic-staging.yaml'
      - 'scripts/aws/validate-contact-staging.mjs'
      - 'scripts/aws/contact-staging.test.mjs'
      - 'scripts/aws/validate-portal-aws-identity.mjs'
      - 'integrations/mongodb-atlas/**'
      - '.github/workflows/aws-contact-staging-check.yml'
  push:
    branches: [codex/aws-contact-portal-acceptance-20261106]
    paths:
      - 'infra/aws/contact-synthetic/**'
      - 'infra/aws/contact-synthetic-staging.yaml'
      - 'scripts/aws/validate-contact-staging.mjs'
      - 'scripts/aws/contact-staging.test.mjs'
      - 'scripts/aws/validate-portal-aws-identity.mjs'
      - 'integrations/mongodb-atlas/**'
      - '.github/workflows/aws-contact-staging-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Syntax, template parity and synthetic-only security unit tests
        run: |
          node --check infra/aws/contact-synthetic/index.js
          node scripts/aws/validate-contact-staging.mjs
          node --test scripts/aws/contact-staging.test.mjs
          node scripts/aws/validate-portal-aws-identity.mjs
          node --test integrations/mongodb-atlas/staging-contact-store.test.mjs
          node --test integrations/mongodb-atlas/staging-schema.test.mjs
      - name: Confirm deployed AWS staging health is NOT published as a live service
        shell: bash
        run: |
          set -euo pipefail
          origin="https://y2sa7gga5i.execute-api.eu-north-1.amazonaws.com"
          curl --fail --silent --show-error --max-time 15 "$origin/health" > /tmp/novapharm-contact-health.json
          node -e '
            const d = require("/tmp/novapharm-contact-health.json");
            if (d.service !== "novapharm-contact-staging" || d.live !== false ||
                d.acceptingPublicSubmissions !== false || d.emailSendingEnabled !== false) {
              throw new Error("Staging service must not claim production acceptance");
            }
            console.log("AWS staging health responds and explicitly denies production status");
          '
          status=$(curl --silent --show-error --max-time 15 --output /tmp/unauthorized.json --write-out '%{http_code}' \
            -X POST "$origin/contact" -H 'Content-Type: application/json' \
            -H 'Origin: https://novapharmhealthcare.com' --data '{}')
          test "$status" = 403
          echo "AWS staging HTTPS API rejected anonymous form submission"
