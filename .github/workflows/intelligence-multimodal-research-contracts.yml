name: Intelligence multimodal research contracts

on:
  pull_request:
    paths:
      - 'src/core/intelligence-multimodal-evidence-review.*'
      - 'scripts/test-intelligence-multimodal-evidence-review.mjs'
      - 'apps/portal/components/multimodal-review-panel.tsx'
      - 'apps/portal/components/nova-ml-workspaces.tsx'
      - 'native/novapharm-intelligence-mobile/**'
      - 'docs/intelligence/multimodal-neurons-adaptation-20261118.md'
      - '.github/workflows/intelligence-multimodal-research-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-multimodal-boundary:
    name: Multimodal conflict, refusal and no-publish contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify syntax
        run: |
          node --check src/core/intelligence-multimodal-evidence-review.mjs
          node --check scripts/test-intelligence-multimodal-evidence-review.mjs
          node --check native/novapharm-intelligence-mobile/tests/mobile-contract.test.mjs
      - name: Run negative-case and cross-platform source contracts
        run: |
          node --test scripts/test-intelligence-multimodal-evidence-review.mjs
          node --test native/novapharm-intelligence-mobile/tests/mobile-contract.test.mjs
