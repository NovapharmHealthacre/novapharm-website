name: Intelligence multimodal research contracts

on:
  pull_request:
    paths:
      - 'src/core/intelligence-multimodal-evidence-review.*'
      - 'src/core/intelligence-multimodal-workspace-policy.mjs'
      - 'src/core/intelligence-multimodal-research-basis.*'
      - 'src/core/intelligence-multimodal-threat-evaluation.mjs'
      - 'src/core/intelligence-multimodal-benchmark-metadata.mjs'
      - 'src/core/intelligence-global-canonical-candidates.mjs'
      - 'src/core/intelligence-22-workspace-readiness.mjs'
      - 'scripts/test-intelligence-multimodal-evidence-review.mjs'
      - 'scripts/test-intelligence-multimodal-workspace-policy.mjs'
      - 'scripts/test-intelligence-multimodal-research-basis.mjs'
      - 'scripts/test-intelligence-multimodal-benchmark-metadata.mjs'
      - 'scripts/test-intelligence-global-canonical-candidates.mjs'
      - 'scripts/test-intelligence-22-workspace-readiness.mjs'
      - 'apps/portal/components/multimodal-review-panel.tsx'
      - 'apps/portal/components/nova-ml-workspaces.tsx'
      - 'native/novapharm-intelligence-mobile/**'
      - 'docs/intelligence/multimodal-neurons-adaptation-20261118.md'
      - 'docs/intelligence/multimodal-22-reference-engineering-matrix-20261118.md'
      - 'docs/ai-risk-register.md'
      - 'docs/ai-system-card.md'
      - '.github/workflows/intelligence-multimodal-research-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-multimodal-boundary:
    name: Multimodal conflict, refusal and no-publish contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify syntax
        run: |
          node --check src/core/intelligence-multimodal-evidence-review.mjs
          node --check src/core/intelligence-multimodal-workspace-policy.mjs
          node --check src/core/intelligence-multimodal-research-basis.mjs
          node --check src/core/intelligence-multimodal-threat-evaluation.mjs
          node --check src/core/intelligence-multimodal-benchmark-metadata.mjs
          node --check scripts/test-intelligence-multimodal-benchmark-metadata.mjs
          node --check scripts/test-intelligence-multimodal-research-basis.mjs
          node --check scripts/test-intelligence-multimodal-workspace-policy.mjs
          node --check scripts/test-intelligence-multimodal-evidence-review.mjs
          node --check native/novapharm-intelligence-mobile/tests/mobile-contract.test.mjs
      - name: Run negative-case and cross-platform source contracts
        run: |
          node --test scripts/test-intelligence-multimodal-evidence-review.mjs
          node --test scripts/test-intelligence-multimodal-workspace-policy.mjs
          node --test scripts/test-intelligence-multimodal-research-basis.mjs
          node --test scripts/test-intelligence-multimodal-benchmark-metadata.mjs
          node --test scripts/test-intelligence-global-canonical-candidates.mjs
          node --test scripts/test-intelligence-22-workspace-readiness.mjs
          node --test native/novapharm-intelligence-mobile/tests/mobile-contract.test.mjs
