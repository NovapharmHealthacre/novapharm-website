name: Entra P1 and Atlas staging integration contract
on:
  pull_request:
    paths:
      - 'src/data/atlas-evidence-staging.mjs'
      - 'src/core/intelligence-evidence-graph.mjs'
      - 'scripts/test-intelligence-evidence-graph.mjs'
      - 'infra/aws/entra-atlas-staging-readiness.json'
      - 'scripts/aws/entra-atlas-staging.test.mjs'
      - 'docs/deployments/entra-atlas-staging-20261108.md'
      - '.github/workflows/entra-atlas-staging-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-entra-atlas-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify no cross-workspace Atlas access and no production Entra sessions
        run: |
          node --check src/data/atlas-evidence-staging.mjs
          node --check src/core/intelligence-evidence-graph.mjs
          node --test scripts/aws/entra-atlas-staging.test.mjs scripts/test-intelligence-evidence-graph.mjs
