name: Quantum research source-only verification
on:
  pull_request:
    paths:
      - 'src/core/intelligence-quantum-research.mjs'
      - 'scripts/test-intelligence-quantum-research.mjs'
      - 'scripts/test-intelligence-quantum-cross-platform.mjs'
      - 'scripts/research/quantum-bell-pilot.py'
      - 'scripts/research/quantum-h2-benchmark.py'
      - 'scripts/research/quantum-bell-reference.py'
      - 'scripts/research/test-quantum-bell-reference.py'
      - 'scripts/research/test-quantum-h2-benchmark.py'
      - 'docs/intelligence/quantum-research-program-v1.json'
      - '.github/workflows/intelligence-quantum-research.yml'
      - 'native/novapharm-intelligence-mobile/**'
      - 'apps/portal/components/science-research-workspace.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quantum-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test scripts/test-intelligence-quantum-research.mjs scripts/test-intelligence-quantum-cross-platform.mjs
      - run: python -m py_compile scripts/research/quantum-bell-pilot.py
      - run: python scripts/research/quantum-bell-pilot.py --help
      - run: python -m py_compile scripts/research/quantum-h2-benchmark.py scripts/research/test-quantum-h2-benchmark.py
      - run: python scripts/research/test-quantum-h2-benchmark.py -v
      - run: python scripts/research/quantum-h2-benchmark.py
      - run: python -m py_compile scripts/research/quantum-bell-reference.py scripts/research/test-quantum-bell-reference.py
      - run: python scripts/research/test-quantum-bell-reference.py -v
      - run: python scripts/research/quantum-bell-reference.py --shots 512 --seed 42
