name: Intelligence enterprise governed read acceptance

on:
  pull_request:
    paths:
      - "src/core/intelligence-enterprise-governed-read.mjs"
      - "scripts/test-intelligence-enterprise-governed-read.mjs"
      - "scripts/test-intelligence-enterprise-atlas-read-adapter.mjs"
      - "src/data/intelligence-enterprise-atlas-read-adapter.mjs"
      - "src/core/intelligence-enterprise-vendor-probes.mjs"
      - "scripts/test-intelligence-enterprise-vendor-probes.mjs"
      - "src/core/intelligence-enterprise-vendor-http.mjs"
      - "scripts/test-intelligence-enterprise-vendor-http.mjs"
      - "src/core/intelligence-enterprise-evidence-views.mjs"
      - "scripts/test-intelligence-enterprise-evidence-views.mjs"
      - ".github/workflows/intelligence-enterprise-governed-read.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-read-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate enterprise research source and test syntax
        run: |
          node --check src/core/intelligence-enterprise-governed-read.mjs
          node --check src/data/intelligence-enterprise-atlas-read-adapter.mjs
          node --check scripts/test-intelligence-enterprise-governed-read.mjs
          node --check scripts/test-intelligence-enterprise-atlas-read-adapter.mjs
          node --check src/core/intelligence-enterprise-vendor-probes.mjs
          node --check scripts/test-intelligence-enterprise-vendor-probes.mjs
          node --check src/core/intelligence-enterprise-vendor-http.mjs
          node --check scripts/test-intelligence-enterprise-vendor-http.mjs
          node --check src/core/intelligence-enterprise-evidence-views.mjs
          node --check scripts/test-intelligence-enterprise-evidence-views.mjs
      - name: Verify rights, tenancy, audit, revocation and no native-vendor activation
        run: npm run test:enterprise-integrations
