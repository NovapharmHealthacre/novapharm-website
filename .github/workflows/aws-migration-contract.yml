name: AWS region-locked migration contract

on:
  pull_request:
    paths:
      - "infra/aws/**"
      - "scripts/aws/**"
      - "src/data/**"
      - "src/storage/**"
      - "src/core/entra-identity.mjs"
      - ".github/workflows/aws-migration-contract.yml"
      - ".github/workflows/managed-production-candidate.yml"
      - "docs/programme/aws-migration/**"
  push:
    branches: [main]
    paths:
      - "infra/aws/**"
      - "scripts/aws/**"
      - "src/data/**"
      - "src/storage/**"
      - "src/core/entra-identity.mjs"
      - ".github/workflows/aws-migration-contract.yml"
      - ".github/workflows/managed-production-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate AWS foundation and fail-closed boundaries
        run: |
          node --check src/data/providers/aws-rds-sql.mjs
          node --check src/storage/providers/disabled-document-store.mjs
          node --check scripts/aws/validate-migration-foundation.mjs
          node scripts/aws/validate-migration-foundation.mjs
      - name: Validate CloudFormation template structure
        run: |
          aws --version
          aws cloudformation validate-template --template-body file://infra/aws/foundation.json --region eu-north-1
