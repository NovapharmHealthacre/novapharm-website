name: Reconcile image inventory for accessibility PR
on:
  push:
    branches: [fix/technology-purpose-heading-contrast-20261107]
    paths:
      - .github/workflows/reconcile-image-inventory-pr118.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify exact branch head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate and validate governed inventory
        run: |
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
      - name: Commit only validated inventory to PR branch
        run: |
          set -euo pipefail
          git add audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Inventory already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git ls-remote origin refs/heads/fix/technology-purpose-heading-contrast-20261107 | cut -f1)" = "$GITHUB_SHA"
          git commit -m "fix(evidence): regenerate validated image inventory for accessibility release"
          git push origin HEAD:refs/heads/fix/technology-purpose-heading-contrast-20261107
# Reconcile merged-main image inventory at c3131fc1e3077c6e66732ffded2b2f4d9b3fec90
