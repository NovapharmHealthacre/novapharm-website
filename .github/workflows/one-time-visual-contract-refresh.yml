name: One-time visual contract refresh

on:
  push:
    branches:
      - chore/update-leadership-headshots-cso
    paths:
      - .github/workflows/one-time-visual-contract-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out leadership release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chore/update-leadership-headshots-cso
          fetch-depth: 0

      - name: Refresh owner-approved visual contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/test-visual-contracts.mjs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'assert.match(home, /Pharmaceutical supply, built around evidence\\./);': 'assert.match(home, /Medicine\\. Where it needs to be/);',
              'assert.match(cro, /prabhakarvitthallahare\\.jpeg/);': 'assert.match(cro, /prabhakarvitthallahare\\.png/);',
              'for (const portrait of ["vishalchakravarty.jpeg", "prabhakarvitthallahare.jpeg", "girishshantilalachliya.jpeg"]) assert.match(leadership, new RegExp(portrait));': 'for (const portrait of ["vishalchakravarty.png", "prabhakarvitthallahare.png", "girishshantilalachliya.png"]) assert.match(leadership, new RegExp(portrait));',
              '"cro", "oncology", "apple-pharma-public", "owner-corrections"': '"cro", "oncology", "apple-pharma-public", "leadership-apple", "owner-corrections"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit refreshed contracts
        run: |
          git config user.name "ChatGPT website maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-visual-contracts.mjs
          git diff --cached --check
          git commit -m "Refresh visual contracts for approved hero and portraits"
          git push origin HEAD:chore/update-leadership-headshots-cso
