name: RWMS commerce product master
on:
  pull_request:
    paths:
      - 'src/core/rwms-commerce-product-master.mjs'
      - 'scripts/test-rwms-commerce-product-master.mjs'
      - 'src/content/approved-consumer-catalogue.json'
      - 'src/content/connective-consumer-research.json'
      - 'assets/data/nutraxin-retail-catalogue.json'
      - 'assets/data/esco-catalogue.json'
      - '.github/workflows/rwms-commerce-product-master.yml'
permissions:
  contents: read
jobs:
  catalogue-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-rwms-commerce-product-master.mjs
