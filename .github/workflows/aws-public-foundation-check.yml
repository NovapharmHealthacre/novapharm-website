name: AWS public-only foundation guardrails

on:
  pull_request:
    paths:
      - 'infra/aws/**'
      - 'scripts/aws/**'
      - '.github/workflows/aws-public-foundation-check.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/**'
      - 'scripts/aws/**'
      - '.github/workflows/aws-public-foundation-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Assert public-only AWS template security boundaries
        run: node scripts/aws/validate-public-foundation.mjs
