name: Verify public ESCO search and Bag in Chromium and WebKit

on:
  pull_request:
    paths:
      - scripts/test-live-esco-bag-browser.mjs
      - .github/workflows/test-live-esco-bag-browser.yml
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 5"

permissions:
  contents: read

jobs:
  esco-live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked test dependencies and Chromium/WebKit engines
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Exercise live catalogue search, local Bag and public-safe prices, no payments
        run: node scripts/test-live-esco-bag-browser.mjs
      - name: Keep browser acceptance results without user data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esco-live-bag-browser
          path: artifacts/site-restoration/live-esco-bag-browser.json
          if-no-files-found: warn
          retention-days: 14
