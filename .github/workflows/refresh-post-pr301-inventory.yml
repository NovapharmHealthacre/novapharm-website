name: Reconcile post-merge image inventory (temporary)
on:
  push:
    branches:
      - fix/image-inventory-post-pr301-main-20261110
    paths:
      - .github/workflows/refresh-post-pr301-inventory.yml
permissions:
  contents: write
jobs:
  update-audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/image-inventory-post-pr301-main-20261110
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies with scripts disabled
        run: npm ci --ignore-scripts
      - name: Reconcile factual audited image inventory
        shell: bash
        run: |
          set -euo pipefail
          npm run images:inventory
          npm run images:inventory:validate
          test -s audit/generated/image-inventory.json
          node - <<'JS'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit/generated/image-inventory.json','utf8'));
          if (!Array.isArray(report.assets) || report.assets.length < 100) process.exit(1);
          if (report.assets.some(a => !a.path || !a.sha256)) process.exit(1);
          console.log(JSON.stringify({assetCount:report.summary.trackedAssetCount,provenance:report.summary.byProvenanceStatus}));
          JS
          modified="$(git diff --name-only)"
          if [ -n "$modified" ] && [ "$modified" != "audit/generated/image-inventory.json" ]; then
            echo "::error::Unexpected modification $modified"
            exit 1
          fi
      - name: Commit only regenerated audit on this branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- audit/generated/image-inventory.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audit/generated/image-inventory.json
          test "$(git diff --cached --name-only)" = "audit/generated/image-inventory.json"
          git commit -m 'chore(audit): reconcile image inventory after PR #301 merge'
          git push origin HEAD:fix/image-inventory-post-pr301-main-20261110
