name: Review-only image inventory reconciliation

on:
  push:
    branches:
      - codex/governed-native-8k-artwork-20261106
    paths:
      - .github/workflows/phoenix-refresh-image-inventory.yml

permissions:
  contents: write

jobs:
  image-ledger:
    if: github.repository == 'NovapharmHealthacre/novapharm-website' && github.ref == 'refs/heads/codex/governed-native-8k-artwork-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact workspace dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recompute governed image asset ledger from physical repository assets
        run: |
          set -euo pipefail
          npm run images:inventory
          npm run images:inventory:validate
          node -e "const r=require('./audit/generated/image-inventory.json'); if(!r.summary || !Array.isArray(r.assets)) process.exit(1); console.log(JSON.stringify(r.summary,null,2));"
      - name: Commit only regenerated evidence inventory for human review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Image inventory already current."
          else
            git diff --cached --stat
            git commit -m "audit(images): refresh physical asset inventory without granting new approvals"
            git push origin HEAD:codex/governed-native-8k-artwork-20261106
          fi
