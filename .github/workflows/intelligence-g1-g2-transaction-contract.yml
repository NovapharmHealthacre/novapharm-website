name: Intelligence G1 G2 transaction identity contract
on:
  pull_request:
    paths:
      - 'src/core/medicine-evidence-admission.mjs'
      - 'src/data/atlas-medicine-g2-atomic-store.mjs'
      - 'scripts/test-atlas-medicine-g2-atomic-store.mjs'
      - 'scripts/test-intelligence-g1-g2-handoff.mjs'
      - '.github/workflows/intelligence-g1-g2-transaction-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/medicine-evidence-admission.mjs'
      - 'src/data/atlas-medicine-g2-atomic-store.mjs'
      - 'scripts/test-atlas-medicine-g2-atomic-store.mjs'
      - 'scripts/test-intelligence-g1-g2-handoff.mjs'
      - '.github/workflows/intelligence-g1-g2-transaction-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-transaction-fences:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify G1-to-G2 identity and transactional schema fences
        run: |
          node --check src/data/atlas-medicine-g2-atomic-store.mjs
          node --test \
            scripts/test-intelligence-g1-g2-handoff.mjs \
            scripts/test-atlas-medicine-g2-atomic-store.mjs \
            scripts/test-medicine-evidence-admission.mjs \
            scripts/test-atlas-g2-unique-index-migration.mjs
      - name: No actual data release
        run: |
          echo "Synthetic zero-credential source contracts only."
          echo "No Atlas writes, source rights grants, medicine publication, or customer access."
