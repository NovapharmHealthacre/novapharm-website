name: Intelligence Science research preview contracts

on:
  pull_request:
    paths:
      - 'docs/intelligence/science-research-capabilities-20261118.json'
      - 'docs/intelligence/openai-science-methods-20261118.json'
      - 'docs/intelligence/openai-science-integration-20261118.md'
      - 'src/core/intelligence-science-research-contract.mjs'
      - 'src/core/intelligence-science-research-principles.mjs'
      - 'src/core/intelligence-science-methodology.mjs'
      - 'src/core/intelligence-science-evidence-dossier.mjs'
      - 'src/core/intelligence-22-workspace-readiness.mjs'
      - 'src/core/intelligence-release-readiness.mjs'
      - 'scripts/test-intelligence-readiness.mjs'
      - 'scripts/test-intelligence-22-workspace-readiness.mjs'
      - 'apps/portal/data/routes.ts'
      - 'apps/portal/components/medicines-intelligence.tsx'
      - 'apps/portal/components/science-research-workspace.tsx'
      - 'apps/portal/components/science-research-workspace.module.css'
      - 'native/novapharm-intelligence-mobile/**'
      - 'scripts/test-intelligence-science-research.mjs'
      - 'scripts/test-intelligence-science-methodology.mjs'
      - 'scripts/test-intelligence-science-evidence-dossier.mjs'
      - '.github/workflows/intelligence-science-research-contracts.yml'
  workflow_dispatch:

# Discard obsolete Science checks when another commit is pushed to this PR.
# This reduces queue churn while preserving the latest exact-head run.
concurrency:
  group: science-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  science-contracts:
    name: Fail-closed Science web and iOS Android preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Check module syntax and validate science data
        run: |
          node --check src/core/intelligence-science-research-contract.mjs
          node --check src/core/intelligence-science-research-principles.mjs
          node --check src/core/intelligence-science-methodology.mjs
          node --check src/core/intelligence-science-evidence-dossier.mjs
          node --check scripts/test-intelligence-science-evidence-dossier.mjs
          node --check scripts/test-intelligence-science-methodology.mjs
          node --check src/core/intelligence-22-workspace-readiness.mjs
          node --check scripts/test-intelligence-science-research.mjs
          node -e "const x=require('./docs/intelligence/science-research-capabilities-20261118.json');if(x.workflows.length!==6)process.exit(1)"
          node -e "const x=require('./docs/intelligence/openai-science-methods-20261118.json');if(x.methods.length!==9||x.scientificMethodologyCount!==7)process.exit(1)"
      - name: Run scientific research contracts
        run: node --test scripts/test-intelligence-science-research.mjs scripts/test-intelligence-22-workspace-readiness.mjs scripts/test-intelligence-science-methodology.mjs scripts/test-intelligence-science-evidence-dossier.mjs
