name: Intelligence Science research preview contracts

on:
  pull_request:
    paths:
      - 'docs/intelligence/science-research-capabilities-20261118.json'
      - 'docs/intelligence/openai-science-integration-20261118.md'
      - 'src/core/intelligence-science-research-contract.mjs'
      - 'apps/portal/data/routes.ts'
      - 'apps/portal/components/medicines-intelligence.tsx'
      - 'apps/portal/components/science-research-workspace.tsx'
      - 'apps/portal/components/science-research-workspace.module.css'
      - 'native/novapharm-intelligence-mobile/**'
      - 'scripts/test-intelligence-science-research.mjs'
      - '.github/workflows/intelligence-science-research-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science-contracts:
    name: Fail-closed Science web and iOS Android preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Check module syntax and validate science data
        run: |
          node --check src/core/intelligence-science-research-contract.mjs
          node --check scripts/test-intelligence-science-research.mjs
          node -e "const x=require('./docs/intelligence/science-research-capabilities-20261118.json');if(x.workflows.length!==6)process.exit(1)"
      - name: Run scientific research contracts
        run: node --test scripts/test-intelligence-science-research.mjs
