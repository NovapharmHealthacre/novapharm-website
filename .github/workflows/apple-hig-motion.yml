name: Apple HIG Motion web contract
on:
  pull_request:
    paths:
      # Validate reproducibility for every shared CSS source change.
      - "assets/css/**"
      - "assets/css/motion.css"
      - "assets/css/novapharm-hig-motion.css"
      - "assets/css/novapharm.css"
      - "assets/css/novapharm.bundle.css"
      - "assets/js/novapharm.js"
      - "apps/**/app/layout.tsx"
      - "scripts/build-css-bundle.mjs"
      - "scripts/test-apple-hig-motion.mjs"
      - ".github/workflows/apple-hig-motion.yml"
  push:
    branches: [main]
    paths:
      - "assets/css/**"
      - "assets/css/motion.css"
      - "assets/css/novapharm-hig-motion.css"
      - "assets/css/novapharm.bundle.css"
      - "assets/js/novapharm.js"
      - "scripts/test-apple-hig-motion.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify motion accessibility and integration
        run: node scripts/test-apple-hig-motion.mjs
      - name: Verify canonical Pages CSS is reproducible
        run: |
          node scripts/build-css-bundle.mjs
          git diff --exit-code -- assets/css/novapharm.bundle.css
