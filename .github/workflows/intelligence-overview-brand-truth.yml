name: Protected Intelligence overview brand and metric truth
on:
  pull_request:
    paths:
      - 'apps/portal/components/medicines-intelligence*'
      - 'apps/portal/lib/intelligence-overview-metric.*'
      - 'scripts/test-intelligence-overview-brand-truth.mjs'
      - '.github/workflows/intelligence-overview-brand-truth.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node --test scripts/test-intelligence-overview-brand-truth.mjs
