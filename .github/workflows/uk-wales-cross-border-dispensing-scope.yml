name: UK Wales cross-border dispensing source-scope non-admission

on:
  pull_request:
    paths:
      - 'src/core/uk-wales-dispensing-cross-border-scope.mjs'
      - 'scripts/test-uk-wales-dispensing-cross-border-scope.mjs'
      - 'docs/data/uk-wales-cross-border-dispensing-scope.md'
      - '.github/workflows/uk-wales-cross-border-dispensing-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: __GITHUB_WORKFLOW__-__GITHUB_REF__
  cancel-in-progress: true

jobs:
  source-scope-and-overlap-denial:
    name: UK Welsh and English dispensing attribution guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Syntax-check read-only source-scope validator
        run: |
          node --check src/core/uk-wales-dispensing-cross-border-scope.mjs
          node --check scripts/test-uk-wales-dispensing-cross-border-scope.mjs
      - name: Exercise source-only negative and positive acceptance
        run: node --test scripts/test-uk-wales-dispensing-cross-border-scope.mjs
