name: Intelligence live private-evidence gate contract

on:
  pull_request:
    paths:
      - '.github/workflows/intelligence-private-production-gate.yml'
      - '.github/workflows/intelligence-private-live-evidence-contract.yml'
      - 'scripts/test-intelligence-private-production-gate.mjs'

permissions:
  contents: read

jobs:
  private-api-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify explicit live HTTPS, noindex, no-store and all three private API denials
        run: node --test scripts/test-intelligence-private-production-gate.mjs
      - name: Preserve source-rights and enterprise readiness gates
        run: npm run intelligence:requirements:validate
