name: PR123 isolated image-inventory reconciliation

on:
  push:
    branches: [feat/intelligence-official-brand-real-ons-boundaries-20261107]
    paths: [.github/workflows/pr123-image-inventory.yml]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'NovapharmHealthacre/novapharm-website'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out this exact feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Generate authoritative inventory, validate and commit to PR branch only
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          git add audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo 'No inventory differences'
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/intelligence-official-brand-real-ons-boundaries-20261107 | cut -f1)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(intelligence): update governed image inventory for approved logo and preview"
          git push origin HEAD:refs/heads/feat/intelligence-official-brand-real-ons-boundaries-20261107
