name: Intelligence private service endpoint cost and isolation contract
on:
  pull_request:
    paths:
      - 'infra/aws/intelligence-private-interface-endpoints.json'
      - 'scripts/test-intelligence-private-interface-endpoints.mjs'
      - '.github/workflows/intelligence-private-interface-endpoints.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/intelligence-private-interface-endpoints.json'
      - 'scripts/test-intelligence-private-interface-endpoints.mjs'
      - '.github/workflows/intelligence-private-interface-endpoints.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test scripts/test-intelligence-private-interface-endpoints.mjs
