name: Verify private Medicines Terminal production activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/intelligence-private-production-gate.yml'
  workflow_dispatch:
  schedule:
    # Daily no-credential live ingress smoke; never deploys or enables customer release.
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  verify-private-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve dedicated Intelligence HTTPS ingress without touching Nutraxin
        shell: bash
        run: |
          set -euo pipefail
          portal="https://intelligence.novapharmhealthcare.com"
          host="intelligence.novapharmhealthcare.com"
          if ! getent ahostsv4 "$host" >/tmp/novapharm-private-addresses.txt; then
            echo "::error::Private production DNS has not resolved from the acceptance runner. G0 deployment blocked."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 20 --connect-timeout 8 \
            -D /tmp/novapharm-private-headers -o /tmp/novapharm-private-index \
            -w '%{http_code}' "$portal/" || true)
          if ! [[ "$status" =~ ^(200|302|303|307|308)$ ]]; then
            echo "::error::Private Medicines Terminal is not serving a valid HTTPS application response (HTTP $status)."
            exit 1
          fi
          if grep -Eqi 'NUTRAXIN / CUSTOMER ACCOUNT|Welcome to Nutraxin' /tmp/novapharm-private-index; then
            echo "::error::Intelligence ingress is serving the separate Nutraxin account; refusing cross-product release."
            exit 1
          fi
          if ! tr -d '\r' </tmp/novapharm-private-headers | grep -qi '^x-robots-tag:.*noindex'; then
            echo "::error::Private Medicines Terminal response does not declare X-Robots-Tag: noindex."
            exit 1
          fi
          echo "Private HTTPS ingress responded with a protected noindex page (HTTP $status)."

      - name: Reject unauthenticated live FDA, clinical trials and intelligence readiness requests
        shell: bash
        run: |
          set -euo pipefail
          origin="https://intelligence.novapharmhealthcare.com"
          for route in \
            '/gateway/v1/intelligence/regulatory/us/fda-labels?drug=apixaban' \
            '/gateway/v1/intelligence/evidence/us/clinical-trials?intervention=apixaban' \
            '/gateway/v1/intelligence/readiness'; do
            status=$(curl --silent --show-error --max-time 20 --connect-timeout 8 \
              -D /tmp/novapharm-private-api-headers -o /tmp/novapharm-private-api-response \
              -w '%{http_code}' "$origin$route" || true)
            if [ "$status" = "200" ]; then
              echo "::error::Unauthenticated Intelligence API returned HTTP 200; potential exposure must be reviewed."
              exit 1
            fi
            if ! [[ "$status" =~ ^(401|403)$ ]]; then
              echo "::error::Intelligence API must return explicit HTTP 401 or 403 to an unauthenticated request; found HTTP $status. Production binding not accepted."
              exit 1
            fi
            if ! tr -d '\r' </tmp/novapharm-private-api-headers | grep -qi '^cache-control:.*no-store'; then
              # API Gateway's own AWS_IAM 403 is generated BEFORE any Lambda
              # response headers can run. A 403 is not heuristically cacheable
              # by default. Permit ONLY its constant, bounded JSON denial.
              # App-origin 401/403 responses still require no-store.
              if [ "$status" != "403" ] \
                || ! tr -d '\r' </tmp/novapharm-private-api-headers | grep -qi '^content-type:.*application/json' \
                || ! grep -qx '{"message":"Forbidden"}' /tmp/novapharm-private-api-response \
                || [ "$(wc -c </tmp/novapharm-private-api-response)" -gt 64 ]; then
                echo "::error::Private Intelligence API needs no-store or a tightly verified native IAM 403."
                exit 1
              fi
              echo "Only the fixed API Gateway IAM denial was accepted without an application Cache-Control header."
            fi
          done
          echo "Unauthenticated private API boundaries and no-store caching verified."

      - name: Verify exact public health and Cognito paths without redirecting into protected fallback
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://intelligence.novapharmhealthcare.com"

          # Do not follow redirects. A 308 on the canonical HTTP API route
          # would fall into the AWS_IAM catch-all and break real login.
          health_status=$(curl --silent --show-error --max-time 20 --connect-timeout 8 \
            -D /tmp/npi-health-headers -o /tmp/npi-health-body \
            -w '%{http_code}' "$base_url/healthz" || true)
          if [ "$health_status" != "200" ] || ! grep -qx 'ok' /tmp/npi-health-body; then
            echo "::error::Canonical /healthz is not HTTP 200 with the liveness payload; found HTTP $health_status."
            exit 1
          fi
          if ! tr -d '\r' </tmp/npi-health-headers | grep -qi '^cache-control:.*no-store'; then
            echo "::error::Health must disable caching."
            exit 1
          fi

          start_status=$(curl --silent --show-error --max-time 20 --connect-timeout 8 \
            -D /tmp/npi-auth-start-headers -o /tmp/npi-auth-start-body \
            -w '%{http_code}' "$base_url/auth/customer/start" || true)
          if [ "$start_status" != "302" ]; then
            echo "::error::Canonical Cognito start did not return HTTP 302 (found $start_status)."
            exit 1
          fi
          if ! tr -d '\r' </tmp/npi-auth-start-headers | grep -Eqi '^location: https://novapharm-intelligence-production-eun1\.auth\.eu-north-1\.amazoncognito\.com/oauth2/authorize\?'; then
            echo "::error::Cognito start must redirect only to the pinned hosted UI."
            exit 1
          fi
          if ! tr -d '\r' </tmp/npi-auth-start-headers | grep -Eqi '^set-cookie: __Host-npi_oidc_tx=.*;[[:space:]]*Secure'; then
            # Cookie attributes may be reordered, so inspect the same header as a whole.
            if ! tr -d '\r' </tmp/npi-auth-start-headers | grep -Ei '^set-cookie: __Host-npi_oidc_tx=' | grep -Eqi 'secure'; then
              echo "::error::Cognito PKCE transaction cookie is not Secure."
              exit 1
            fi
          fi
          if ! tr -d '\r' </tmp/npi-auth-start-headers | grep -Ei '^set-cookie: __Host-npi_oidc_tx=' | grep -Eqi 'httponly'; then
            echo "::error::Cognito PKCE transaction cookie is not HttpOnly."
            exit 1
          fi

          callback_status=$(curl --silent --show-error --max-time 20 --connect-timeout 8 \
            -D /tmp/npi-auth-callback-headers -o /tmp/npi-auth-callback-body \
            -w '%{http_code}' "$base_url/auth/callback" || true)
          if [ "$callback_status" != "401" ]; then
            echo "::error::Unsigned Cognito callback must deny HTTP 401, found $callback_status."
            exit 1
          fi
          if ! tr -d '\r' </tmp/npi-auth-callback-headers | grep -qi '^cache-control:.*no-store'; then
            echo "::error::Cognito callback must disable caching."
            exit 1
          fi
          echo "Canonical health and customer identity public route smoke passed; medicine/customer application acceptance remains separate."

      - name: Record scope of proof
        run: |
          echo "HTTPS + unauthenticated boundaries verified only."
          echo "Production acceptance still requires a credentialed board session, tenant isolation, accepted real source data, NOVA model rights, forecast backtests, observability and rollback."
