name: Intelligence secondary global API contract tests

on:
  pull_request:
    paths:
      - 'src/core/intelligence-global-secondary-source-gateway.mjs'
      - 'src/core/intelligence-singapore-hsa-bulk-candidate.mjs'
      - 'scripts/test-intelligence-singapore-hsa-bulk-candidate.mjs'
      - 'scripts/test-intelligence-global-secondary-source-gateway.mjs'
      - 'src/core/intelligence-global-evidence-contract.mjs'
      - 'docs/intelligence/global-pharma-sources-20261117.json'
      - 'docs/intelligence/global-secondary-source-api-contracts-20261118.md'
      - '.github/workflows/intelligence-global-secondary-source-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secondary-source-safety:
    name: Singapore HSA and UK NHSBSA catalogue contracts, deny-first verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate gateway syntax and all synthetic negative tests
        run: |
          node --check src/core/intelligence-global-secondary-source-gateway.mjs
          node --check src/core/intelligence-singapore-hsa-bulk-candidate.mjs
          node --check scripts/test-intelligence-global-secondary-source-gateway.mjs
          node --test scripts/test-intelligence-global-secondary-source-gateway.mjs
          node --test scripts/test-intelligence-singapore-hsa-bulk-candidate.mjs
