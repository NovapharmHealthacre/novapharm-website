name: Prepare safe editorial restoration candidate

on:
  pull_request:
    paths:
      - scripts/stage-safe-editorial-restoration.py
      - .github/workflows/stage-safe-editorial-restoration.yml
  push:
    branches: [main]
    paths:
      - scripts/stage-safe-editorial-restoration.py
      - .github/workflows/stage-safe-editorial-restoration.yml

permissions:
  contents: write

concurrency:
  group: novapharm-scoped-editorial-candidate
  cancel-in-progress: false

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact owner-approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Build public-only candidate and verify source safety
        run: |
          node scripts/test-static-public-source-safety.mjs
          npm ci --ignore-scripts
          npm run build:public-only
          node scripts/stage-pages-artifact.mjs _site
          npm run validate:domain
          node scripts/check-links.mjs _site
      - name: Checkout published Pages source independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: published
          persist-credentials: ${{ github.event_name == 'push' }}
      - name: Stage reviewed editorial pages without changing customer or commerce
        run: python3 scripts/stage-safe-editorial-restoration.py
      - name: Upload candidate manifest whether or not staging passes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoped-editorial-candidate-${{ github.sha }}
          path: artifacts/editorial-candidate/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Push an isolated NON-LIVE candidate branch for independent review
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          name="release/staged-editorial-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          test "$(git -C published branch --show-current)" = "gh-pages" || {
            echo "::error::Not based on the current gh-pages source"; exit 1;
          }
          git -C published switch -c "$name"
          git -C published config user.name 'NovaPharm Restoration Staging'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add --all
          git -C published diff --cached --name-only > /tmp/editorial-changed-paths
          while IFS= read -r f; do
            case "$f" in
              index.html|contact/*|portal/*|account-application/*|products/*|shopping/*|legal/*|_next/*|CNAME|robots.txt|sitemap*)
                echo "::error::Protected route is in candidate changes: $f"; exit 1;;
            esac
          done < /tmp/editorial-changed-paths
          test -s /tmp/editorial-changed-paths
          git -C published commit -m "candidate(public): staged current approved editorial designs; no customer or commerce changes"
          git -C published push origin "HEAD:refs/heads/$name"
          echo "STAGING_BRANCH=$name"
          echo "STAGING_COMMIT=$(git -C published rev-parse HEAD)"
          echo "CANDIDATE ONLY. gh-pages and the live website remain untouched."
