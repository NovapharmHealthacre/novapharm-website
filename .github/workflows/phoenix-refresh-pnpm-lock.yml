name: Phoenix pnpm lockfile reconciliation (no deployment)

on:
  push:
    branches:
      - codex/phoenix-security-remediation-20261106
    paths:
      - .github/workflows/phoenix-refresh-pnpm-lock.yml
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'NovapharmHealthacre/novapharm-website' && github.ref == 'refs/heads/codex/phoenix-security-remediation-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - name: Resolve and freeze the pnpm workspace graph
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Audit pnpm production graph
        shell: bash
        run: |
          set -euo pipefail
          pnpm audit --prod --audit-level high 2>&1 | tee /tmp/pnpm-production-audit.log
      - name: Commit verified lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm lockfile already matches the manifest."
          else
            git commit -m "fix(security): synchronize reviewed pnpm production lockfile"
            git push origin HEAD:codex/phoenix-security-remediation-20261106
          fi
      - name: Preserve pnpm audit log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phoenix-pnpm-audit
          path: /tmp/pnpm-production-audit.log
          if-no-files-found: warn
          retention-days: 7
