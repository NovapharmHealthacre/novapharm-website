name: Inspect Next.js pre-render artifacts for GitHub Pages publication
# Re-test native anchors after RSC prefetch removal
on:
  push:
    branches: [ops/next-pages-publication-candidate-20261107]
    paths:
      - .github/workflows/inspect-next-pages-candidate.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build exact public Next.js application
        run: npm run build --workspace @novapharm/corporate
      - name: Inspect generated static and route content
        shell: bash
        run: |
          set -euo pipefail
          echo "Next routes and HTML candidates:"
          find apps/corporate/.next/server/app -type f -name '*.html' | sort | head -80
          echo "Next static assets:"
          find apps/corporate/.next/static -type f | wc -l
          node - <<'NODE'
          const fs = require('fs');
          const path = 'apps/corporate/.next/prerender-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path,'utf8'));
          const routes=Object.keys(manifest.routes||{});
          console.log(JSON.stringify({manifestVersion:manifest.version,routeCount:routes.length,firstRoutes:routes.slice(0,70),dynamic: Object.keys(manifest.dynamicRoutes||{})},null,2));
          const htmlPath='apps/corporate/.next/server/app/index.html';
          if(fs.existsSync(htmlPath)){
            const html=fs.readFileSync(htmlPath,'utf8');
            console.log(JSON.stringify({rootHTML:true,bytes:html.length,containsEditorial:html.includes('npd-apple-hero'),containsNOVA:html.includes('NOVA'),hasNextScripts:html.includes('_next/static/')},null,2));
          } else console.log('Root HTML not present at expected path');
          NODE
          test -s apps/corporate/.next/prerender-manifest.json
      - name: Serve Next standalone and snapshot two public routes
        shell: bash
        run: |
          set -euo pipefail
          cd apps/corporate
          PORT=3177 HOSTNAME=127.0.0.1 PUBLIC_INDEXABLE=true npm run start >/tmp/novapharm-next-live.log 2>&1 &
          echo $! >/tmp/novapharm-next.pid
          cd ../..
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3177/; then break; fi
            sleep 2
          done
          mkdir -p /tmp/novapharm-next-snapshot/_next/static /tmp/novapharm-next-snapshot/contact
          cp -a apps/corporate/.next/static/. /tmp/novapharm-next-snapshot/_next/static/
          cp -a apps/corporate/public/. /tmp/novapharm-next-snapshot/
          curl -fsSL http://127.0.0.1:3177/ -o /tmp/novapharm-next-snapshot/index.html
          curl -fsSL http://127.0.0.1:3177/contact/ -o /tmp/novapharm-next-snapshot/contact/index.html
          test -s /tmp/novapharm-next-snapshot/index.html
          grep -Fq 'npd-apple-hero' /tmp/novapharm-next-snapshot/index.html
          grep -Fq 'npd-apple-nova-art' /tmp/novapharm-next-snapshot/index.html
          ! grep -Fq 'data-login-form' /tmp/novapharm-next-snapshot/index.html
          python3 -m http.server 3188 --directory /tmp/novapharm-next-snapshot --bind 127.0.0.1 >/tmp/novapharm-static.log 2>&1 &
          echo $! >/tmp/novapharm-static.pid
      - name: Browser-test extracted GitHub Pages candidate
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({headless:true});
            const page = await b.newPage({viewport:{width:390,height:844}});
            const errors = [];
            const failedResources = [];
            page.on('pageerror',error=>errors.push(error.message));
            page.on('response',response=>{if(response.status()>=400)failedResources.push(response.status()+' '+response.url())});
            page.on('requestfailed',request=>failedResources.push('network '+request.url()+' '+(request.failure()?.errorText||'')));
            page.on('console',message=>{if(message.type()==='error')errors.push(message.text())});
            const response=await page.goto('http://127.0.0.1:3188/',{waitUntil:'networkidle',timeout:30000});
            await page.waitForTimeout(1500);
            const data=await page.evaluate(()=>({
              heading:document.querySelector('h1')?.textContent,
              editorial:!!document.querySelector('.npd-apple-hero'),
              nova:!!document.querySelector('.npd-apple-nova-art'),
              cssLoaded:getComputedStyle(document.querySelector('.npd-apple-hero')).backgroundColor,
              overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1,
              brokenImages:[...document.images].filter(x=>x.complete && x.naturalWidth===0).map(x=>x.currentSrc)
            }));
            console.log(JSON.stringify({status:response?.status(),data,errors,failedResources},null,2));
            await b.close();
            if(response?.status()!==200 || !data.editorial || !data.nova || data.overflow || data.brokenImages.length || errors.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Preserve candidate metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-pages-publication-probe
          path: |
            /tmp/novapharm-next-live.log
            /tmp/novapharm-static.log
          retention-days: 3
