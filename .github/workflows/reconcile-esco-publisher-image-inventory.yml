name: Reconcile ESCO publisher branch image inventory

on:
  push:
    branches: [fix/pages-monotonic-approved-release-20261110]
    paths:
      - '.github/workflows/reconcile-esco-publisher-image-inventory.yml'

permissions:
  contents: write

jobs:
  regenerate-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact source to be reconciled
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Recalculate original image facts and verify strict provenance
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run images:inventory
          npm run images:inventory:validate
          git diff --check
          git diff --stat -- audit/generated/image-inventory.json
      - name: Commit only validated inventory to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/fix/pages-monotonic-approved-release-20261110 | cut -f1)" = "$GITHUB_SHA"
          git add -- audit/generated/image-inventory.json
          if git diff --cached --quiet; then
            echo "Image inventory already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(evidence): reconcile governed media inventory for release gate"
          git push origin HEAD:refs/heads/fix/pages-monotonic-approved-release-20261110
