name: UK medicines four-nation private archive integrity (offline)

on:
  pull_request:
    paths:
      - 'src/core/uk-national-source-archive-preflight.mjs'
      - 'src/core/uk-four-nation-backfill-candidate.mjs'
      - 'src/core/uk-private-backfill-file-batch.mjs'
      - 'src/core/uk-devolved-csv-quality.mjs'
      - 'src/core/uk-wales-gp-zip-inventory.mjs'
      - 'src/core/uk-medicine-metric-comparability.mjs'
      - 'scripts/data/verify-uk-national-source-archive.mjs'
      - 'scripts/test-uk-national-source-archive-preflight.mjs'
      - 'scripts/test-uk-four-nation-backfill-candidate.mjs'
      - 'scripts/test-uk-private-backfill-file-batch.mjs'
      - 'scripts/data/verify-uk-private-backfill-file-batch.mjs'
      - 'scripts/test-uk-devolved-csv-quality.mjs'
      - 'scripts/test-uk-wales-gp-zip-inventory.mjs'
      - 'scripts/test-uk-medicine-metric-comparability.mjs'
      - 'docs/data/uk-national-source-archive-preflight.md'
      - '.github/workflows/uk-national-source-archive-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-private-archive-boundaries:
    name: UK four-nation archival integrity and non-admission contract
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check source and CLI syntax
        run: |
          node --check src/core/uk-national-source-archive-preflight.mjs
          node --check src/core/uk-four-nation-backfill-candidate.mjs
          node --check src/core/uk-private-backfill-file-batch.mjs
          node --check src/core/uk-devolved-csv-quality.mjs
          node --check src/core/uk-wales-gp-zip-inventory.mjs
          node --check src/core/uk-medicine-metric-comparability.mjs
          node --check scripts/data/verify-uk-national-source-archive.mjs
          node --check scripts/test-uk-national-source-archive-preflight.mjs
          node --check scripts/test-uk-four-nation-backfill-candidate.mjs
          node --check scripts/test-uk-private-backfill-file-batch.mjs
          node --check scripts/data/verify-uk-private-backfill-file-batch.mjs
          node --check scripts/test-uk-devolved-csv-quality.mjs
          node --check scripts/test-uk-wales-gp-zip-inventory.mjs
          node --check scripts/test-uk-medicine-metric-comparability.mjs
      - name: Run strictly offline negative and positive integrity tests
        run: node --test scripts/test-uk-national-source-archive-preflight.mjs scripts/test-uk-devolved-csv-quality.mjs scripts/test-uk-medicine-metric-comparability.mjs scripts/test-uk-wales-gp-zip-inventory.mjs scripts/test-uk-four-nation-backfill-candidate.mjs scripts/test-uk-private-backfill-file-batch.mjs
