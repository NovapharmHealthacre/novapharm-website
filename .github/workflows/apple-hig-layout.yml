name: Apple HIG Layout Contract
on:
  pull_request:
    paths:
      - "assets/css/apple-hig-layout.css"
      - "assets/css/novapharm.css"
      - "assets/css/novapharm.bundle.css"
      - "scripts/build-css-bundle.mjs"
      - "scripts/test-apple-layout-contract.mjs"
      - "scripts/test-apple-layout-organization.mjs"
      - "scripts/test-apple-rtl-contract.mjs"
      - "scripts/test-apple-rtl-public-artifact.mjs"
      - "scripts/finalize-public-rtl.mjs"
      - "scripts/build-site.mjs"
      - "scripts/stage-pages-artifact.mjs"
      - "assets/css/rtl-localization.css"
      - "assets/js/rtl-localization.js"
      - "assets/js/novapharm.js"
      - "apps/corporate/components/site-header.tsx"
      - "apps/corporate/components/mobile-navigation.tsx"
      - "apps/corporate/components/site-footer.tsx"
      - "apps/technology/components/arrow-link.tsx"
      - "apps/portal/components/dashboard.tsx"
      - "apps/portal/components/portal-client.tsx"
      - "apps/portal/app/**/page.tsx"
      - "src/core/interface-locale.ts"
      - "src/components/interface-locale-switcher.tsx"
      - "scripts/build-public-pages.mjs"
      - "packages/design-system/src/**"
      - "apps/portal/components/wms-prototype-workspace-map.tsx"
      - "packages/design-system/test/**"
      - "apps/status/app/page.tsx"
      - "apps/status/app/globals.css"
      - "docs/design/apple-hig-layout-organization-20261116.md"
      - "docs/design/apple-layout-source-matrix-20261116.md"
      - "apps/**/app/layout.tsx"
      - "packages/portal-contracts/src/module-catalog.json"
      - ".github/workflows/apple-hig-layout.yml"
  workflow_dispatch:
jobs:
  layout-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Verify shared layout contract and 54-module shell coverage
        run: node --test scripts/test-apple-layout-contract.mjs scripts/test-apple-layout-organization.mjs scripts/test-apple-rtl-contract.mjs scripts/test-apple-rtl-public-artifact.mjs
      - name: Rebuild canonical public stylesheet
        run: node scripts/build-css-bundle.mjs
      - name: Verify published CSS is reproducible
        run: git diff --exit-code -- assets/css/novapharm.bundle.css
