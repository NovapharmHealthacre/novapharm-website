name: Read-only SEO Pages release preflight
on:
  pull_request:
    paths:
      - ".github/workflows/nutraxin-seo-pages-preflight.yml"
      - "scripts/verify-seo-pages-release-preflight.mjs"
      - "scripts/test-seo-pages-release-preflight.mjs"
      - "scripts/generate-nutraxin-shopping.mjs"
      - "scripts/stage-pages-artifact.mjs"
      - "src/seo/**"
      - "shopping/nutraxin-uk.tsv"
      - "products/nutraxin/**"
      - "contact/**"
      - "assets/js/contact-production.js"
      - "scripts/activate-contact-intake.mjs"
      - "config/intelligence/owner-production-constraints.json"
      - "robots.txt"
      - "llms.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify contact-preserving release scenarios
        run: node --test scripts/test-seo-pages-release-preflight.mjs
      - name: Install reproducible dependencies
        run: npm ci --ignore-scripts
      - name: Build a NON-PUBLISHED public candidate
        run: |
          npm run build:public-only
          node scripts/stage-pages-artifact.mjs _site
      - name: Prove public-only candidate is blocked from downgrading contact
        run: |
          node scripts/verify-seo-pages-release-preflight.mjs _site
          cp audit/generated/nutraxin-seo-release-preflight.json audit/generated/nutraxin-seo-release-preflight-public-only.json
      - name: Test contact-preserving candidate in isolated CI artifact (never deploy)
        env:
          NOVAPHARM_CONTACT_RELEASE_ACCEPTED: "yes"
          NOVAPHARM_CONTACT_API_ORIGIN: https://h4dc1e4u57.execute-api.eu-north-1.amazonaws.com
          NOVAPHARM_CONTACT_ARTIFACT_ROOT: _site
        run: |
          node scripts/activate-contact-intake.mjs
          node scripts/verify-seo-pages-release-preflight.mjs _site
          cp audit/generated/nutraxin-seo-release-preflight.json audit/generated/nutraxin-seo-release-preflight-contact-preserving.json
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seo-pages-readonly-preflight
          path: audit/generated/nutraxin-seo-release-preflight*.json
          if-no-files-found: warn
          retention-days: 7

# No pages:write, deployments:write, OIDC, workflow dispatch or deployment step.
# A passing check can report that production remains held by governance.
