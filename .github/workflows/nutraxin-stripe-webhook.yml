name: Nutraxin signed Stripe webhook and ledger security
on:
  pull_request:
    paths:
      - "apps/nutraxin-payments/**"
      - "infra/aws/nutraxin-stripe-webhook-production.json"
      - ".github/workflows/nutraxin-stripe-webhook.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-webhook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and check signed webhook invariants
        run: |
          python3 -m py_compile apps/nutraxin-payments/stripe_webhook.py
          python3 -m unittest discover -s apps/nutraxin-payments -p 'test_*.py' -v
