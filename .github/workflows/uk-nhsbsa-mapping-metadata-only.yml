name: UK NHSBSA BNF–SNOMED source discovery and no-record-read gate

on:
  pull_request:
    paths:
      - 'packages/medicines-intelligence/src/source-registry.ts'
      - 'packages/medicines-intelligence/src/resource-discovery.ts'
      - 'packages/medicines-intelligence/test/source-contracts.test.ts'
      - 'scripts/data/discover-medicines-sources.ts'
      - '.github/workflows/uk-nhsbsa-mapping-metadata-only.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: NHSBSA source mapping metadata-only contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify NHSBSA source discovery and mapping period contracts without publisher requests
        run: |
          node --experimental-strip-types --test packages/medicines-intelligence/test/source-contracts.test.ts
      - name: Assert metadata-only source never issues a DataStore row probe
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { shouldProbeCkanDatastore, registryEntry } from './packages/medicines-intelligence/src/index.ts';
          const discovery = readFileSync('scripts/data/discover-medicines-sources.ts','utf8');
          const source = registryEntry('nhsbsa.bnf-snomed-map');
          assert.equal(source.accessMethod, 'ckan_action_api');
          assert.equal(source.latestResourceId, null);
          assert.equal(source.lastSuccessfullyIngestedAt, null);
          assert.equal(shouldProbeCkanDatastore(source), false);
          assert.match(discovery, /if \\(advertised && latest && mayProbeRows\\) \\{/u);
          assert.match(discovery, /not_probed_rights_pending/u);
          console.log('Official CKAN metadata-only source; no publisher rows, Atlas, AWS or customer publication.');
          NODE
