name: AWS live hardening contract
on:
  pull_request:
    paths:
      - 'infra/aws/*.json'
      - 'infra/aws/policies/*.json'
      - 'infra/aws/contact-synthetic-staging.yaml'
      - 'scripts/aws/production-hardening-contract.test.mjs'
      - '.github/workflows/aws-live-hardening-contract.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned
      - name: Verify source-level AWS production controls
        run: node --test scripts/aws/production-hardening-contract.test.mjs
