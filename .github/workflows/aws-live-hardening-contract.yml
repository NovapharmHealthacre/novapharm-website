name: AWS live hardening contract
on:
  pull_request:
    paths:
      - 'infra/aws/*.json'
      - 'infra/aws/policies/*.json'
      - 'infra/aws/contact-synthetic-staging.yaml'
      - 'scripts/aws/production-hardening-contract.test.mjs'
      - '.github/workflows/aws-live-hardening-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned
      - name: Verify source-level AWS production controls
        run: node --test scripts/aws/production-hardening-contract.test.mjs
