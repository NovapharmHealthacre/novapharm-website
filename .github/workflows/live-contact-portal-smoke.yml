name: Live contact, portal and AWS staging public read-only probes

on:
  push:
    branches: [codex/aws-contact-portal-acceptance-20261106]
    paths:
      - scripts/aws/probe-live-public-readonly.sh
      - .github/workflows/live-contact-portal-smoke.yml
  pull_request:
    paths:
      - scripts/aws/probe-live-public-readonly.sh
      - .github/workflows/live-contact-portal-smoke.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bash -n scripts/aws/probe-live-public-readonly.sh
      - name: Inspect public HTTP status and capture factual report
        run: bash scripts/aws/probe-live-public-readonly.sh
      - name: Preserve status metadata without response body or credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contact-portal-live-read-only-evidence
          path: |
            activation/status.tsv
            activation/summary.json
          retention-days: 14
          if-no-files-found: warn
