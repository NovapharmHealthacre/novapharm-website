name: Medicines forecasting chronology and leakage contract

on:
  pull_request:
    paths:
      - 'packages/medicines-intelligence/src/forecasting.ts'
      - 'packages/medicines-intelligence/test/forecasting.test.ts'
      - '.github/workflows/intelligence-forecast-chronology.yml'

permissions:
  contents: read

jobs:
  baseline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact pinned dependencies
        run: npm ci
      - name: Verify numerical forecast backtests, intervals and strict monthly chronology
        run: npm run test --workspace=@novapharm/medicines-intelligence
      - name: Verify source model TypeScript contracts
        run: npm run typecheck --workspace=@novapharm/medicines-intelligence
      - name: Keep production status and owner-controlled licensing gates unchanged
        run: npm run intelligence:requirements:validate
