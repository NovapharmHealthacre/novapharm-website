name: Intelligence image-inventory reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/intelligence-image-inventory-reconciliation.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.number == 175 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/intelligence-public-research-entry-20261109' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate the authoritative asset inventory without altering sources
        run: npm run images:inventory
      - name: Review scope and commit only regenerated inventory
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- audit/generated/image-inventory.json; then
            echo "Image inventory already current"
            exit 0
          fi
          git status --short
          git add -- audit/generated/image-inventory.json
          if [ "$(git diff --cached --name-only)" != "audit/generated/image-inventory.json" ]; then
            echo "::error::Unexpected changed files; refusing write"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(media): reconcile generated inventory with current tracked assets"
          # Other approved PR changes may land while image decoding runs.
          # Rebase only this one-file generated commit; never force push.
          for attempt in 1 2 3; do
            git fetch origin refs/heads/feat/intelligence-public-research-entry-20261109:refs/remotes/origin/feat/intelligence-public-research-entry-20261109
            git rebase refs/remotes/origin/feat/intelligence-public-research-entry-20261109
            if git push origin HEAD:refs/heads/feat/intelligence-public-research-entry-20261109; then
              exit 0
            fi
          done
          echo "::error::Could not safely publish reconciled inventory"
          exit 1
