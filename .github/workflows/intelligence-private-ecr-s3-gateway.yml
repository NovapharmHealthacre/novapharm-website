name: NovaPharm Intelligence private ECR S3 gateway contract
on:
  pull_request:
    paths:
      - 'infra/aws/intelligence-ecr-s3-gateway.json'
      - 'scripts/test-intelligence-ecr-s3-gateway.mjs'
      - '.github/workflows/intelligence-private-ecr-s3-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/intelligence-ecr-s3-gateway.json'
      - 'scripts/test-intelligence-ecr-s3-gateway.mjs'
      - '.github/workflows/intelligence-private-ecr-s3-gateway.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node --test scripts/test-intelligence-ecr-s3-gateway.mjs
