name: Audit all published images against gh-pages bytes

on:
  pull_request:
    paths:
      - scripts/audit-published-images-parity.mjs
      - scripts/test-published-images-parity.mjs
      - .github/workflows/all-published-images-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-parity:
    name: Read-only all published 833-image SHA-256 audit
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact audit PR head only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source-tree
          persist-credentials: false
      - name: Checkout published Pages branch without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: published-tree
          persist-credentials: false
      - name: Use pinned Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate exact-match, scope, and failure-boundary regression tests
        run: node --test source-tree/scripts/test-published-images-parity.mjs
      - name: Compare every published brand/media image (no writes or POST)
        run: node source-tree/scripts/audit-published-images-parity.mjs
        env:
          PUBLISHED_TREE: published-tree
      - name: Preserve per-image SHA and mismatch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-published-images-parity-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/site-restoration/gh-pages-live-image-parity.json
          if-no-files-found: warn
          retention-days: 14
