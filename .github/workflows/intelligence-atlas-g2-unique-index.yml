name: Intelligence Atlas G2 unique index safety

on:
  pull_request:
    paths:
      - 'src/data/atlas-medicine-g2-atomic-store.mjs'
      - 'src/data/atlas-g2-unique-index-migration.mjs'
      - 'scripts/test-atlas-medicine-g2-atomic-store.mjs'
      - 'scripts/test-atlas-g2-unique-index-migration.mjs'
      - '.github/workflows/intelligence-atlas-g2-unique-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g2-unique-index-contracts:
    name: G2 exact uniqueness, rollback and fail-closed admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate G2 module syntax
        run: |
          node --check src/data/atlas-g2-unique-index-migration.mjs
          node --check scripts/test-atlas-g2-unique-index-migration.mjs
      - name: Verify unique index preflight and existing transaction rollback contracts
        run: node --test scripts/test-atlas-g2-unique-index-migration.mjs scripts/test-atlas-medicine-g2-atomic-store.mjs
