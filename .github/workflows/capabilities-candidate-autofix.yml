name: One-off Capabilities candidate lint reconciliation

on:
  push:
    branches: [fix/capabilities-managed-parity-live-proof-20261111]
    paths:
      - '.github/workflows/capabilities-candidate-autofix.yml'

permissions:
  contents: write

jobs:
  reconcile-style:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/capabilities-managed-parity-live-proof-20261111
          persist-credentials: true
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Apply Biome style-only corrections without disabling lint
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          cd apps/corporate
          ../../node_modules/.bin/biome check --write --unsafe app components data lib scripts test next.config.ts proxy.ts
          cd ../..
          git diff --check
          git diff --stat
      - name: Commit formatting to isolated candidate
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "novapharm-ci-style"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/corporate
            git commit -m "style(corporate): reconcile Biome formatting on Capabilities candidate"
            git push origin HEAD:refs/heads/fix/capabilities-managed-parity-live-proof-20261111
          fi
