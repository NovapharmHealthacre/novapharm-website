name: Accept draft Contact UI in Chromium and WebKit without real submissions

on:
  pull_request:
    paths:
      - scripts/test-contact-draft-synthetic-browser.mjs
      - assets/js/contact-production.js
      - infra/aws/contact-production/index.js
      - .github/workflows/test-contact-draft-synthetic-browser.yml

permissions:
  contents: read

jobs:
  synthetic-contact-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin the exact candidate tree; mutable draft branch advances must not silently change acceptance target.
          ref: 147885c079631280a4243068958e3dd19c35dd41
          path: contact-draft
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked test dependencies and isolated browser engines
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Verify candidate JavaScript syntax and mocked DynamoDB/SNS Lambda security contracts
        run: |
          node --check contact-draft/assets/js/contact-production.js
          node --check infra/aws/contact-production/index.js
          node --test scripts/aws/contact-production.test.mjs
      - name: Verify actual proposed public form and privacy with intercepted synthetic receipts
        run: node scripts/test-contact-draft-synthetic-browser.mjs
