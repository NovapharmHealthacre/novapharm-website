name: Accept draft Contact UI in Chromium and WebKit without real submissions

on:
  pull_request:
    paths:
      - scripts/test-contact-draft-synthetic-browser.mjs
      - assets/js/contact-production.js
      - infra/aws/contact-production/index.js
      - .github/workflows/test-contact-draft-synthetic-browser.yml

permissions:
  contents: read

jobs:
  synthetic-contact-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin the exact candidate tree; mutable draft branch advances must not silently change acceptance target.
          ref: 7980391f128c51f0a5d15265239c61982ddd2ab2
          path: contact-draft
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked test dependencies and isolated browser engines
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Verify candidate JavaScript syntax and mocked DynamoDB/SNS Lambda security contracts
        run: |
          node --check contact-draft/assets/js/contact-production.js
          node --check infra/aws/contact-production/index.js
          node --test scripts/aws/contact-production.test.mjs
      - name: Verify exact Contact HIG layout and safety contract (source-only)
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const h = readFileSync("contact-draft/contact/index.html", "utf8");
          const j = readFileSync("contact-draft/assets/js/contact-production.js", "utf8");
          const mustHave = [
            'data-live-b2b-enquiry-form', 'role="status" aria-live="polite"',
            'name="safetyConfirmation" value="yes" required',
            'name="privacyAcknowledgement" value="yes" required',
            '.ref-confirmation input[type=checkbox]:focus-visible',
            '.ref-field:focus-within{outline:2px solid',
            '.ref-form{max-width:790px',
            'grid-template-columns:repeat(2,minmax(0,1fr))',
            'font-size:16px', '@media(max-width:560px)',
            'min-height:48px', '@media(forced-colors:active)',
            '#9D1B32', '#68101F', '#0B0B0E',
            ':root{--ink:#0B0B0E', ':root{--ref-ink:#0B0B0E',
            '.ref-field>span{font-weight:560;color:var(--ref-ink)',
            '<noscript>', '<noscript><style>.ref-form{display:none}</style>', 'NovaPharm Intelligence',
            'src="/assets/js/contact-production.js"'
          ];
          for (const marker of mustHave) assert.ok(h.includes(marker), "Missing contact design marker: " + marker);
          assert.equal((h.match(/type="checkbox"/g) || []).length, 2);
          assert.ok(!h.includes('data-email-enquiry-form'));
          assert.ok(h.includes('data-api-origin="https://h4dc1e4u57.execute-api.eu-north-1.amazonaws.com"'));
          for (const marker of ['response.status !== 201', 'result?.persisted !== true', 'response.status === 403', 'response.status === 422', 'response.status === 429', 'form.setAttribute("aria-busy"', 'To avoid a duplicate']) {
            assert.ok(j.includes(marker), "Missing submission safety marker: " + marker);
          }
          console.log("Exact-contact candidate: 23 source/safety invariant checks passed; synthetic browser run follows.");
          NODE
      - name: Verify production HTTPS health and CORS preflight without sending enquiries
        run: node scripts/verify-contact-health-before-restore.mjs
      - name: Verify actual proposed public form and privacy with intercepted synthetic receipts
        run: node scripts/test-contact-draft-synthetic-browser.mjs
