version: 2
updates:
  # Routine version updates are capacity-managed; security updates remain separate
  # and are not suppressed by the version-update pull request limits.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch

  # A shared Actions version touches many workflow files. Group compatible
  # routine updates to avoid repeated full-estate fan-out; leave majors isolated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:30"
      timezone: Europe/London
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      routine-action-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
