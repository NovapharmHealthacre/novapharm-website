[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "IndexNow verification keys are intentionally public protocol identifiers."
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''(^|/)src/seo/authority-config\.mjs$''',
    '''(^|/)seo/generated/indexnow-config\.json$''',
  ]
  regexes = [
    '''^\s*export const INDEXNOW_KEY = "[0-9a-f]{32}";\s*$''',
    '''^\s*"key": "[0-9a-f]{32}",?\s*$''',
  ]
