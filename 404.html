<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — NovaPharm Healthcare</title>
  <link rel="stylesheet" href="/design-system/novapharm-tokens.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0A0F1D;
      color: #F9FAFB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #3B82F6;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
    h1 { font-size: 2.25rem; margin-bottom: 0.5rem; font-weight: 800; }
    p { color: #9CA3AF; max-width: 480px; margin-bottom: 2rem; font-size: 0.95rem; }
    .nav-grid { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .btn {
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
    }
    .btn-primary { background: #2563EB; color: #fff; }
    .btn-secondary { background: #1F2937; color: #F9FAFB; border: 1px solid #374151; }
  </style>
</head>
<body>
  <div class="badge">Sovereign Healthcare Network</div>
  <h1>Resource Relocated</h1>
  <p>The requested pharmaceutical surface has been consolidated into the unified NovaPharm digital operating ecosystem.</p>
  <div class="nav-grid">
    <a href="/" class="btn btn-primary">Corporate Overview</a>
    <a href="/portal/" class="btn btn-secondary">Online Portal</a>
    <a href="/login/" class="btn btn-secondary">Secure Sign In 🔒</a>
    <a href="/contact/" class="btn btn-secondary">Contact Form</a>
  </div>
</body>
</html>
