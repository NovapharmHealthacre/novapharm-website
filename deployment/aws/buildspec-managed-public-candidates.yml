version: 0.2
# Manual / protected AWS CodeBuild candidate only. No ECS service, load balancer,
# DNS, customer accounts, source-rights grant or regulated operating cutover.
env:
  shell: bash
phases:
  pre_build:
    commands:
      - 'set -euo pipefail'
      - '[[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - 'test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"'
      - 'aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 250675045172.dkr.ecr.eu-north-1.amazonaws.com'
  build:
    commands:
      - |
        set -euo pipefail
        for app in corporate founder technology status; do
          repository="novapharm/staging/$app"
          candidate="candidate-$EXPECTED_SHA"
          if aws ecr describe-images --region eu-north-1 --repository-name "$repository" --image-ids imageTag="$candidate" >/dev/null 2>&1; then
            echo "Exact-SHA image tag already exists and is immutable: $repository"
            exit 1
          fi
          image="250675045172.dkr.ecr.eu-north-1.amazonaws.com/$repository:$candidate"
          docker build --pull \
            --file deployment/aws/Dockerfile.managed-public \
            --build-arg "APP=$app" \
            --build-arg "SOURCE_SHA=$EXPECTED_SHA" \
            --tag "$image" .
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_SHA"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "novapharm.release-gate"}}')" = "nonproduction-candidate-not-approved"
          docker push "$image"
        done
  post_build:
    commands:
      - 'echo "Candidate images only. ECS deployment, DNS, IAM OIDC, budget, customer identity and rollback remain separately gated."'
